# نشر خادم محرّك الفهم على Render.com  —  New ▸ Blueprint ▸ اختر المستودع
services:
  - type: web
    name: acs-engine
    runtime: docker
    plan: starter
    # المنطقة مثبّتة صراحةً: تركها ضمنية يجعل اسم المضيف يتغيّر إن أُعيد إنشاء
    # الخدمة في منطقة أخرى، وهو أحد أسباب ERR_NAME_NOT_RESOLVED بعد إعادة نشر.
    region: oregon              # starter لا ينام. free ينام بعد 15 دقيقة (بدء بارد ~50 ثانية)
    healthCheckPath: /health
    envVars:
      # ── سرّي: أدخله يدوياً في لوحة Render، ولا يوضع في أي ملف ──
      - key: ANTHROPIC_API_KEY
        sync: false

      # F-25: بلا هذا يبقى ACS_ENV = "development" على الخادم الحيّ، فتُطبَع
      # آثار الاستدعاء كاملةً في السجلّ عند كل عطل غير معالَج (acs_logging
      # يشتقّ STACK_TRACES من not IS_PRODUCTION)، ولا يُعلن /health أن الحدّ
      # يعمل على ذاكرة العملية وحدها بلا مخزن موزّع.
      - key: ACS_ENV
        value: production

      # F-47 · ثابتٌ إنتاجيّ مُعلَن، لا تحذير.
      # هذا النشر عمليّة واحدة (uvicorn بلا --workers) على نسخة واحدة
      # (plan: starter بلا توسيع تلقائي)، فحدّ المعدّل المحليّ للعملية دقيق.
      # الخادم **يرفض الإقلاع** إن أُزيل هذا الإقرار، أو إن أعلنت المنصّة
      # تزامناً أكبر من واحد (WEB_CONCURRENCY أو ما شابهها) بلا مخزن موزّع:
      # نسختان تعنيان حصّتين، والسقف اليوميّ العامّ يتضاعف بلا أن يعلم أحد.
      # لتشغيل أكثر من نسخة: احذف هذا المفتاح واضبط
      #   ACS_RATE_LIMIT_BACKEND=redis  و  ACS_REDIS_URL=<url>
      - key: ACS_SINGLE_INSTANCE
        value: "1"

      # ── مزوّد النموذج ──────────────────────────────────────────────────
      # هذا المخطّط يبقى على anthropic: نشرٌ قائم لا يتغيّر بمجرّد ترقية الكود.
      # للتحويل إلى deepseek أساسياً، اضبط في لوحة Render (لا في هذا الملفّ):
      #     ACS_LLM_PROVIDER      = deepseek
      #     ACS_LLM_BASE_URL      = https://api.deepseek.com/anthropic
      #     ACS_LLM_API_KEY       = <سرّ — في اللوحة وحدها>
      #     ACS_LLM_MODEL         = deepseek-v4-pro
      #     ACS_ALLOWED_MODELS    = deepseek-v4-pro,deepseek-v4-flash
      # وللإبقاء على anthropic بديلاً:
      #     ACS_LLM_FALLBACK_PROVIDER = anthropic
      #     ACS_LLM_FALLBACK_MODEL    = claude-sonnet-5
      #     ACS_LLM_FALLBACK_API_KEY  = <سرّ>   (أو يُترك ليُستعمل
      #                                          ANTHROPIC_API_KEY أعلاه)
      # التحويل عند عطل الرصيد معطّل افتراضياً — فعّله صراحةً إن أردته:
      #     ACS_LLM_FALLBACK_ON_BILLING = 1
      - key: ACS_LLM_PROVIDER
        value: anthropic
      - key: ACS_LLM_MODEL
        value: claude-sonnet-5
      # قائمة النماذج المسموح للزائر طلبها. غيابها كان يترك الافتراضي ضمنياً في
      # الكود وحده، فلا يُقرأ عقد النشر من ملفّ النشر.
      - key: ACS_ALLOWED_MODELS
        value: "claude-sonnet-5,claude-haiku-4-5"
      # مهلة الخادم للتوليد الواحد: أقصر من مهلة الواجهة (900 ث) عمداً، حتى يصل
      # العميل 504 بجسد JSON بدل انقطاع بلا رد يتعذّر تصنيفه.
      # ميزانية المخرج الواحدة. كل ميزانيات المراحل تُشتقّ منها بنِسَب معلنة في
      # acs_generation.py — لا رقم ثانٍ يُضبَط هنا ولا ثابت مدفون في الكود.
      - key: ACS_LLM_MAX_OUTPUT_TOKENS
        value: "32000"
      # حدود التصعيد بعد الانقطاع: تغيير استراتيجية واحد، وتقسيمان للمجموعة.
      - key: ACS_MAX_ESCALATIONS
        value: "1"
      - key: ACS_MAX_GROUP_SPLITS
        value: "2"
      - key: ACS_REQUEST_TIMEOUT_S
        value: "840"
      - key: ACS_UPSTREAM_TIMEOUT_S
        value: "600"

      # ── الأمان: نطاق الواجهة المسموح فقط (لا تستخدم * في الإنتاج) ──
      # أضِف نطاقات أخرى مفصولة بفواصل عند الحاجة.
      - key: ACS_ALLOWED_ORIGINS
        value: "https://sprightly-selkie-d906c3.netlify.app"

      # ── حماية الرصيد: حدود الطلبات لكل زائر وللخادم كله ──
      - key: ACS_RL_GEN_HOUR      # عمليات توليد لكل زائر في الساعة
        value: "8"
      - key: ACS_RL_GEN_DAY       # عمليات توليد لكل زائر في اليوم
        value: "25"
      - key: ACS_RL_EDIT_HOUR     # تعديلات المهندس لكل زائر في الساعة
        value: "30"
      - key: ACS_RL_GLOBAL_DAY    # سقف يومي للخادم كله — أهم صمّام أمان
        value: "400"
      - key: ACS_MAX_TEXT         # أقصى طول وصف بالحروف
        value: "60000"

      # ── التوليد على مرحلتين للطلبات الكبيرة ──
      - key: ACS_DEEP
        value: "auto"
      - key: ACS_GROUP_SIZE
        value: "5"
      - key: ACS_WORKERS
        value: "4"
