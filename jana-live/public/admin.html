<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جَنى — الإدارة</title><style>body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f7f3;color:#173126}header{background:#103725;color:#fff;padding:16px}.wrap{max-width:1100px;margin:auto;padding:20px}.panel,.card,.order{background:#fff;border:1px solid #e3ebe5;border-radius:16px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card b{font-size:25px;color:#176b4d}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input,select,button{font:inherit;padding:10px;border-radius:10px;border:1px solid #dce6df}.btn{border:0;background:#176b4d;color:#fff;font-weight:700;cursor:pointer}.soft{background:#eaf4ee;color:#176b4d}.muted{color:#6b7c73;font-size:13px}.err{color:#a43b3b}.orders{display:grid;gap:10px}.mini{font-size:12px;color:#6b7c73}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><h1 style="margin:0">لوحة إدارة جَنى</h1><div class="muted" style="color:#dfeee4">الطلبات • المخزون • التحصيل • الموظفون • الاستردادات</div></div></header><main class="wrap"><section class="panel"><h3>تسجيل دخول الإدارة</h3><div class="row"><input id="email" placeholder="البريد"><input id="pass" type="password" placeholder="كلمة المرور"><button class="btn" id="login">دخول</button><button class="soft" id="refresh">تحديث</button></div><div id="msg" class="muted"></div></section><section id="dash" class="grid"></section><section class="panel"><h3>تقرير 7 أيام</h3><div id="reports" class="muted">سجّل الدخول.</div></section><section class="panel"><h3>إنشاء موظف</h3><div class="row"><input id="staffName" placeholder="الاسم"><input id="staffEmail" placeholder="البريد"><input id="staffPass" type="password" placeholder="كلمة مرور قوية"><select id="staffRole"><option value="picker">مجهز</option><option value="courier">مندوب</option><option value="inventory">مخزون</option><option value="finance">مالية</option><option value="support">دعم</option></select><button class="btn" id="createStaff">إنشاء</button></div><div id="staffMsg" class="muted"></div></section><section class="panel"><h3>الطلبات والتحصيل والاسترداد</h3><div id="orders" class="orders"><div class="muted">سجّل الدخول.</div></div></section></main><script>let token=localStorage.getItem('jana_admin_token')||'';const $=s=>document.querySelector(s),sar=n=>(Number(n||0)/100).toFixed(2)+' ر.س',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p,o={}){const h={'content-type':'application/json',...(o.headers||{})};if(token)h.authorization='Bearer '+token;const r=await fetch('/api'+p,{...o,headers:h,cache:'no-store'});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}async function load(){if(!token)return;try{const [d,o,rp]=await Promise.all([api('/admin/dashboard'),api('/admin/orders'),api('/admin/reports')]);$('#msg').textContent='متصل بالحساب الإداري';const metrics=[['طلبات نشطة',d.active_orders],['طلبات مكتملة',d.completed_orders],['بانتظار التحصيل',d.awaiting_collection],['عهدة المندوبين',sar(d.cash_with_couriers_halalas)],['تمت تسويته',sar(d.settled_halalas)],['مخزون منخفض',d.low_stock_items],['تذاكر مفتوحة',d.open_tickets],['إشغال المواعيد',d.slot_booked+' / '+d.slot_capacity]];$('#dash').innerHTML=metrics.map(x=>`<div class="card"><div class="muted">${esc(x[0])}</div><b>${esc(x[1])}</b></div>`).join('');$('#reports').innerHTML=`<div class="grid"><div class="card"><div class="muted">مبيعات 7 أيام</div><b>${sar(rp.sales_7d_halalas)}</b></div><div class="card"><div class="muted">طلبات 7 أيام</div><b>${esc(rp.orders_7d)}</b></div><div class="card"><div class="muted">مكتملة</div><b>${esc(rp.completed_7d)}</b></div><div class="card"><div class="muted">استردادات</div><b>${sar(rp.refunds_7d_halalas)}</b></div></div><div class="mini">الأكثر طلبًا: ${(rp.top_items||[]).map(x=>esc(x.name)+' ('+esc(x.qty)+')').join(' • ')||'—'}</div><div class="mini" style="margin-top:6px">أدنى مخزون: ${(rp.low_stock||[]).map(x=>esc(x.name)+': '+esc(x.available_base)).join(' • ')||'—'}</div>`;$('#orders').innerHTML=o.length?o.map(x=>{const id=esc(x.id),showSettle=x.cash_state==='with_courier',showRefund=Number(x.collected_halalas||0)-Number(x.refunded_halalas||0)>0;return`<div class="order"><div class="row" style="justify-content:space-between"><b>${esc(x.number)}</b><span>${sar(x.total_halalas)}</span></div><div class="muted">${esc(x.fulfillment_state)} • ${esc(x.delivery_state)} • ${esc(x.payment_state)} • النقد: ${esc(x.cash_state)} • مسترد: ${sar(x.refunded_halalas)}</div>${showSettle?`<div class="row" style="margin-top:8px"><input id="ref-${id}" placeholder="مرجع التسوية"><button class="btn janaSettle" data-id="${id}">تسوية العهدة</button></div>`:''}${showRefund?`<div class="row" style="margin-top:8px"><input id="refund-${id}" type="number" min="0.01" step="0.01" placeholder="مبلغ الاسترداد ر.س"><input id="reason-${id}" placeholder="سبب الاسترداد"><button class="soft janaRefund" data-id="${id}">استرداد</button></div>`:''}</div>`}).join(''):'<div class="muted">لا توجد طلبات.</div>';$('#orders').querySelectorAll('.janaSettle').forEach(b=>b.onclick=()=>settle(b.dataset.id));$('#orders').querySelectorAll('.janaRefund').forEach(b=>b.onclick=()=>refundOrder(b.dataset.id))}catch(e){$('#msg').textContent=e.message;$('#msg').classList.add('err')}}async function settle(id){try{await api('/admin/orders/'+encodeURIComponent(id)+'/settle',{method:'POST',body:JSON.stringify({reference:$('#ref-'+CSS.escape(id))?.value||''})});await load()}catch(e){alert(e.message)}}async function refundOrder(id){try{const amount=Math.round(Number($('#refund-'+CSS.escape(id))?.value||0)*100);if(amount<=0)return alert('أدخل مبلغًا صالحًا');await api('/admin/orders/'+encodeURIComponent(id)+'/refund',{method:'POST',body:JSON.stringify({amount_halalas:amount,reason:$('#reason-'+CSS.escape(id))?.value||''})});await load()}catch(e){alert(e.message)}}$('#login').onclick=async()=>{try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#pass').value})});token=d.token;localStorage.setItem('jana_admin_token',token);$('#msg').classList.remove('err');await load()}catch(e){$('#msg').textContent=e.message;$('#msg').classList.add('err')}};$('#refresh').onclick=load;$('#createStaff').onclick=async()=>{try{const d=await api('/admin/staff',{method:'POST',body:JSON.stringify({name:$('#staffName').value,email:$('#staffEmail').value,password:$('#staffPass').value,role:$('#staffRole').value})});$('#staffMsg').textContent='تم إنشاء '+String(d.name||'')+' — '+String(d.role||'');$('#staffMsg').classList.remove('err')}catch(e){$('#staffMsg').textContent=e.message;$('#staffMsg').classList.add('err')}};load();</script></body></html>
