<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جَنى — التشغيل</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;margin:0;background:#f6f4ed;color:#173126}.wrap{max-width:1040px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e2e8e3;border-radius:18px;padding:18px;margin-bottom:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,input,select{font:inherit}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer}.p{background:#176b4d;color:#fff}.s{background:#eaf4ee;color:#176b4d}.danger{background:#fdecec;color:#9b3030}.muted{color:#6b7c73;font-size:13px}.order{border:1px solid #e6ece8;border-radius:14px;padding:14px;margin-top:10px}.badge{display:inline-block;background:#edf5f1;border-radius:999px;padding:4px 8px;font-size:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.lines{margin-top:12px;border-top:1px solid #edf1ee;padding-top:8px}.line{padding:8px 0;border-bottom:1px dashed #e7ece9}.price{font-weight:900;color:#176b4d}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="row" style="justify-content:space-between"><h1>تشغيل جَنى</h1><div class="row"><a href="/admin">الإدارة</a><a href="/">المتجر</a></div></div><div class="card"><h3>دخول الموظف</h3><div class="grid"><input id="email" placeholder="البريد"><input id="pass" type="password" placeholder="كلمة المرور"></div><div class="row" style="margin-top:10px"><button class="btn p" id="login">دخول</button><select id="role"><option value="picker">المجهز</option><option value="courier">المندوب</option></select><button class="btn s" id="load">تحديث المهام</button></div><div id="msg" class="muted"></div></div><div id="orders"></div></main><script>let token=localStorage.getItem('jana_ops_token')||'',catalog=[];const $=s=>document.querySelector(s),sar=n=>(Number(n||0)/100).toFixed(2)+' ر.س';async function api(path,opt={}){const h={'content-type':'application/json',...(opt.headers||{})};if(token)h.authorization='Bearer '+token;const r=await fetch('/api'+path,{...opt,headers:h,cache:'no-store'});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}$('#login').onclick=async()=>{try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#pass').value})});token=d.token;localStorage.setItem('jana_ops_token',token);$('#msg').textContent='تم الدخول';load()}catch(e){$('#msg').textContent=e.message}};async function action(id,a){try{let body={};if(a==='delivered')body.code=prompt('أدخل رمز التسليم المكون من 6 أرقام')||'';await api('/ops/orders/'+id+'/'+a,{method:'POST',body:JSON.stringify(body)});load()}catch(e){alert(e.message)}}window.action=action;async function weight(orderId,lineId,planned,current){const raw=prompt('أدخل الوزن الفعلي بالجرام. الحد الأعلى '+planned+' جم',current||planned);if(raw===null)return;const n=Number(raw);if(!Number.isFinite(n)||n<=0||n>planned)return alert('وزن غير صالح');try{await api('/ops/orders/'+orderId+'/actual-weight',{method:'POST',body:JSON.stringify({line_id:lineId,actual_base:Math.round(n)})});load()}catch(e){alert(e.message)}}window.weight=weight;async function propose(orderId,lineId,qty,currentId){try{if(!catalog.length)catalog=await api('/catalog');const name=prompt('اكتب اسم البديل المقترح');if(!name)return;const matches=catalog.filter(x=>x.id!==currentId&&String(x.name||'').includes(name));if(!matches.length)return alert('لم أجد بديلًا بهذا الاسم');const chosen=matches[0];if(!confirm('اقتراح '+chosen.name+' للعميل؟'))return;await api('/ops/orders/'+orderId+'/substitutions',{method:'POST',body:JSON.stringify({line_id:lineId,offering_id:chosen.id,qty:Number(qty||1)})});alert('تم إرسال البديل للعميل للموافقة');load()}catch(e){alert(e.message==='substitution_requires_requote'?'هذا البديل يحتاج إعادة حجز مخزون؛ اختر بديلًا من نفس مكونات المنتج أو أقل.':e.message)}}window.propose=propose;async function locationUpdate(orderId){if(!navigator.geolocation)return alert('الموقع غير مدعوم على هذا الجهاز');navigator.geolocation.getCurrentPosition(async p=>{try{await api('/ops/orders/'+orderId+'/location',{method:'POST',body:JSON.stringify({latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy_m:p.coords.accuracy})});alert('تم تحديث موقع المندوب بدقة تقريبية '+Math.round(p.coords.accuracy)+'م')}catch(e){alert(e.message)}},e=>alert('تعذر تحديد الموقع: '+e.message),{enableHighAccuracy:true,timeout:15000,maximumAge:5000})}window.locationUpdate=locationUpdate;function lineHtml(o,l){const comps=Array.isArray(l.components)?l.components:[],c=comps[0],planned=c?Number(c.base_qty||0)*Number(l.qty||1):0,canWeight=comps.length===1&&String(c?.base_unit||'')==='gram';return `<div class="line"><div class="row" style="justify-content:space-between"><span><b>${l.name}</b> × ${l.qty}</span><span class="price">${sar(l.line_total_halalas)}</span></div><div class="muted">${canWeight?`المطلوب ${planned} جم${l.actual_base_qty?` · الفعلي ${l.actual_base_qty} جم`:''}`:'كمية ثابتة'}</div>${o.fulfillment_state==='picking'?`<div class="row" style="margin-top:6px">${canWeight?`<button class="btn s" onclick="weight('${o.id}','${l.line_id}',${planned},${Number(l.actual_base_qty||0)})">⚖️ تسجيل الوزن</button>`:''}<button class="btn s" onclick="propose('${o.id}','${l.line_id}',${Number(l.qty||1)},'${l.offering_id}')">🔄 اقتراح بديل</button></div>`:''}</div>`}async function load(){try{if(!catalog.length){try{catalog=await api('/catalog')}catch{}}const role=$('#role').value,o=await api('/ops/'+role);$('#orders').innerHTML=o.length?o.map(x=>{const lines=Array.isArray(x.snapshot?.lines)?x.snapshot.lines:[];return `<div class="card order"><div class="row" style="justify-content:space-between"><b>${x.number}</b><span class="badge">${x.status}</span></div><div class="muted">التجهيز: ${x.fulfillment_state} · التوصيل: ${x.delivery_state} · الدفع: ${x.payment_state}</div><div class="price">الإجمالي الحالي: ${sar(x.total_halalas)}</div>${role==='picker'?`<div class="lines">${lines.map(l=>lineHtml(x,l)).join('')}</div>`:''}<div class="row" style="margin-top:10px">${role==='picker'?`<button class="btn s" onclick="action('${x.id}','start-picking')" ${x.fulfillment_state!=='queued'?'disabled':''}>بدء التجهيز</button><button class="btn p" onclick="action('${x.id}','ready')" ${x.fulfillment_state!=='picking'?'disabled':''}>إنهاء التجهيز وجاهز</button>`:`<button class="btn s" onclick="action('${x.id}','out-for-delivery')" ${!['assigned','unassigned'].includes(x.delivery_state)?'disabled':''}>خرج للتوصيل</button><button class="btn s" onclick="locationUpdate('${x.id}')" ${x.delivery_state!=='out_for_delivery'?'disabled':''}>📍 تحديث موقعي</button><button class="btn p" onclick="action('${x.id}','delivered')" ${x.delivery_state!=='out_for_delivery'?'disabled':''}>تم التسليم</button>`}</div></div>`}).join(''):'<div class="card muted">لا توجد مهام متاحة.</div>'}catch(e){$('#orders').innerHTML='<div class="card danger">'+e.message+'</div>'}}$('#load').onclick=load;if(token)load();</script></body></html>
