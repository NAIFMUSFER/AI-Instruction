<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جَنى — التشغيل</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;margin:0;background:#f6f4ed;color:#173126}.wrap{max-width:980px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e2e8e3;border-radius:18px;padding:18px;margin-bottom:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,input,select{font:inherit}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer}.p{background:#176b4d;color:#fff}.s{background:#eaf4ee;color:#176b4d}.danger{background:#fdecec;color:#9b3030}.muted{color:#6b7c73;font-size:13px}.order{border:1px solid #e6ece8;border-radius:14px;padding:14px;margin-top:10px}.badge{display:inline-block;background:#edf5f1;border-radius:999px;padding:4px 8px;font-size:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="row" style="justify-content:space-between"><h1>تشغيل جَنى</h1><a href="/">العودة للمتجر</a></div><div class="card"><h3>دخول الموظف</h3><div class="grid"><input id="email" placeholder="البريد"><input id="pass" type="password" placeholder="كلمة المرور"></div><div class="row" style="margin-top:10px"><button class="btn p" id="login">دخول</button><select id="role"><option value="picker">المجهز</option><option value="courier">المندوب</option></select><button class="btn s" id="load">تحديث المهام</button></div><div id="msg" class="muted"></div></div><div id="orders"></div></main><script>let token=localStorage.getItem('jana_ops_token')||'';const $=s=>document.querySelector(s);async function api(path,opt={}){const h={'content-type':'application/json',...(opt.headers||{})};if(token)h.authorization='Bearer '+token;const r=await fetch('/api'+path,{...opt,headers:h,cache:'no-store'});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}$('#login').onclick=async()=>{try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#pass').value})});token=d.token;localStorage.setItem('jana_ops_token',token);$('#msg').textContent='تم الدخول';load()}catch(e){$('#msg').textContent=e.message}};async function action(id,a){try{let body={};if(a==='delivered')body.code=prompt('أدخل رمز التسليم المكون من 6 أرقام')||'';await api('/ops/orders/'+id+'/'+a,{method:'POST',body:JSON.stringify(body)});load()}catch(e){alert(e.message)}}window.action=action;async function load(){try{const role=$('#role').value,o=await api('/ops/'+role);$('#orders').innerHTML=o.length?o.map(x=>`<div class="card order"><div class="row" style="justify-content:space-between"><b>${x.number}</b><span class="badge">${x.status}</span></div><div class="muted">التجهيز: ${x.fulfillment_state} · التوصيل: ${x.delivery_state} · الدفع: ${x.payment_state}</div><div class="row" style="margin-top:10px">${role==='picker'?`<button class="btn s" onclick="action('${x.id}','start-picking')">بدء التجهيز</button><button class="btn p" onclick="action('${x.id}','ready')">جاهز</button>`:`<button class="btn s" onclick="action('${x.id}','out-for-delivery')">خرج للتوصيل</button><button class="btn p" onclick="action('${x.id}','delivered')">تم التسليم</button>`}</div></div>`).join(''):'<div class="card muted">لا توجد مهام متاحة.</div>'}catch(e){$('#orders').innerHTML='<div class="card danger">'+e.message+'</div>'}}$('#load').onclick=load;if(token)load();</script></body></html>
