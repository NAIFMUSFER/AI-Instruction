# ينشر Netlify محتوى مجلد public فقط — فلا تُنشر ملفات الخادم Python
[build]
  publish = "public"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
