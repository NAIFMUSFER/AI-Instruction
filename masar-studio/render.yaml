services:
  - type: web
    name: masar-studio
    runtime: node
    rootDir: masar-studio
    plan: free
    region: frankfurt
    buildCommand: npm ci --ignore-scripts && npm run check && npm run build
    startCommand: npm start
    healthCheckPath: /api/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: ALLOW_REGISTRATION
        value: 'true'
      - key: PERSISTENCE_CLASS
        value: ephemeral
      - key: NODE_VERSION
        value: 22.23.2
      - key: DB_PATH
        value: /tmp/masar-data/masar.sqlite
