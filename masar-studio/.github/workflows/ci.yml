name: MASAR 4.1 release verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: masar-release-${{ github.ref }}
  cancel-in-progress: false
env:
  APP_DIR: .
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: mkdir -p test-output && npm test | tee test-output/node-tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: masar-node-evidence
          path: ./test-output/
          retention-days: 14
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts && npm run build
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps ${{ matrix.engine }}
      - run: python tests/browser_http.py
        env:
          MASAR_BROWSER: ${{ matrix.engine }}
      - if: matrix.engine == 'chromium'
        run: python tests/browser_flows.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: masar-browser-${{ matrix.engine }}-evidence
          path: |
            ./test-output/browser-http-*/
            ./docs/browser-tests.json
            ./docs/desktop-tested.png
            ./docs/mobile-tested.png
          retention-days: 14
  ifc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install ifcopenshell==0.8.5 pytest==8.4.2
      - run: node tests/ifc-fixtures.mjs
      - run: python tests/ifc_external.py
      - run: python -m pip freeze > test-output/ifc/validator-environment.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: masar-ifc-evidence
          path: |
            ./test-output/ifc/independent-report.json
            ./test-output/ifc/validator-environment.txt
          retention-days: 14
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - run: node tests/docker-smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: masar-docker-evidence
          path: ./test-output/docker-report.json
          retention-days: 14
  package:
    needs: [node, browser, ifc, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - uses: actions/download-artifact@v4
        with:
          pattern: masar-*-evidence
          path: ci-evidence
      - run: npm run build && python tools/package.py --out delivery --evidence ci-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masar-4.1.0-release
          path: delivery/
          if-no-files-found: error
          retention-days: 30
  verify-delivery:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: masar-4.1.0-release
          path: release
      - run: |
          cd release && sha256sum -c SHA256SUMS
          python -m zipfile -e Masar-Studio-4.1.0-Source.zip ../recheck
          cd ../recheck/masar-studio
          python tools/verify-package.py .
          npm ci --ignore-scripts
          npm run check
          npm run build
          cmp dist/index.html ../../release/Masar-Studio-4.1.0.html
          npm test
      - run: python -m pip install playwright==1.55.0 ifcopenshell==0.8.5 pytest==8.4.2
      - run: python -m playwright install --with-deps chromium
      - run: |
          cd recheck/masar-studio
          python tests/browser_flows.py
          MASAR_BROWSER=chromium python tests/browser_http.py
          node tests/ifc-fixtures.mjs
          python tests/ifc_external.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: masar-delivery-recheck
          path: |
            recheck/masar-studio/test-output/browser-http-chromium/report.json
            recheck/masar-studio/test-output/ifc/independent-report.json
            recheck/masar-studio/docs/browser-tests.json
          retention-days: 30
