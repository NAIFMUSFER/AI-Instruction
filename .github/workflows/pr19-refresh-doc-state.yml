name: PR19 refresh measured doc state

on:
  push:
    branches:
      - feature/residential-v2-save-revisions
    paths:
      - .github/workflows/pr19-refresh-doc-state.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/residential-v2-save-revisions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked JS and browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Regenerate measured bundle and documentation state
        run: |
          python3 tools/bundle_report.py
          python3 tools/check_doc_claims.py --fix
          python3 tools/check_doc_claims.py
      - name: Commit generated measurements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KNOWN-ISSUES.md tests/performance/bundle_report.json
          if git diff --cached --quiet; then
            echo "No generated measurement changes needed."
            exit 0
          fi
          git commit -m "docs: refresh measured source state"
          git push origin HEAD:feature/residential-v2-save-revisions
