name: One-time commercial bootstrap implementation
on:
  push:
    branches:
      - 'feature/commercial-project-bootstrap-v2'
    paths:
      - '.github/workflows/one-time-commercial-bootstrap-implementation.yml'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 'feature/commercial-project-bootstrap-v2'
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Insert atomic bootstrap method exactly once
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('acs_plan_store.py')
          s = p.read_text()
          marker = '''    def grant_role(self, project_id: str, *, by_actor_id: str,\n'''
          if s.count(marker) != 1:
              raise SystemExit('expected one grant_role insertion marker')
          method = '''    def create_project_with_revision(self, project_id: str, *, owner_id: str,\n                                     revision: Any) -> dict:\n        \"\"\"Atomically create a project, owner membership and immutable revision #1.\n\n        Revision admission is validated before the transaction begins. The project\n        row, owner membership, first revision and head pointer then commit together,\n        so callers can never observe a durable empty project caused by a partial\n        bootstrap. This does not generate geometry or authenticate the owner; those\n        remain host responsibilities.\n        \"\"\"\n        project_id, owner_id = _id(project_id, \"project_id\"), _id(owner_id, \"owner_id\")\n        doc = revision_document(revision)\n        if doc[\"number\"] != 1 or doc[\"parent_id\"] is not None:\n            raise PlanError(\"INVALID_REVISION_CHAIN\",\n                            \"Project bootstrap requires revision 1 with no parent\")\n        with self._connect() as con:\n            con.execute(\"BEGIN IMMEDIATE\")\n            try:\n                con.execute(\"INSERT INTO projects(project_id,owner_id) VALUES(?,?)\",\n                            (project_id, owner_id))\n                con.execute(\"INSERT INTO project_members(project_id,actor_id,role) \"\n                            \"VALUES(?,?, 'owner')\", (project_id, owner_id))\n                con.execute(\"\"\"INSERT INTO plan_revisions(\n                    project_id,revision_id,number,parent_id,revision_json,model_hash,\n                    content_hash,bound_content_hash,semantic_lock_manifest_hash,\n                    created_by,created_at) VALUES(?,?,?,?,?,?,?,?,?,?,?)\"\"\",\n                    (project_id, doc[\"revision_id\"], doc[\"number\"], doc[\"parent_id\"],\n                     _json(doc), doc[\"model_hash\"], doc[\"content_hash\"],\n                     doc[\"bound_content_hash\"], doc[\"semantic_lock_manifest_hash\"],\n                     owner_id, doc[\"created_at\"]))\n                con.execute(\"UPDATE projects SET head_revision_id=?,updated_at=CURRENT_TIMESTAMP \"\n                            \"WHERE project_id=?\", (doc[\"revision_id\"], project_id))\n                con.execute(\"COMMIT\")\n            except sqlite3.IntegrityError as exc:\n                if con.in_transaction:\n                    con.execute(\"ROLLBACK\")\n                raise PlanError(\"PROJECT_EXISTS\",\n                                \"Project identity already exists\") from exc\n            except Exception:\n                if con.in_transaction:\n                    con.execute(\"ROLLBACK\")\n                raise\n        return {\n            \"schema\": SCHEMA, \"project_id\": project_id, \"owner_id\": owner_id,\n            \"head_revision_id\": doc[\"revision_id\"], \"baseline_revision_id\": None,\n            \"revision_id\": doc[\"revision_id\"],\n        }\n\n'''
          p.write_text(s.replace(marker, method + marker, 1))
          PY
      - name: Prove atomic bootstrap and existing store contracts
        env:
          ACS_ENV: test
          ANTHROPIC_API_KEY: dummy
        run: |
          python -m py_compile acs_plan_store.py tests/remediation/test_commercial_project_bootstrap.py
          python -S tests/remediation/test_commercial_project_bootstrap.py
          python -S tests/remediation/test_plan_store.py
          git diff --check
      - name: Commit implementation and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-commercial-bootstrap-implementation.yml
          git add acs_plan_store.py
          git commit -m 'feat(store): add atomic first-revision project bootstrap'
          git push origin HEAD:feature/commercial-project-bootstrap-v2
