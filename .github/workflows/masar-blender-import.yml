name: MASAR import tested Blender bridge
on:
  push:
    branches: ['feature/masar-blender-20260908']
    paths: ['.github/workflows/masar-blender-import.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/masar-blender-20260908
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Verify transport and apply only the audited application patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,lzma,hashlib,subprocess
          expected=['f8bc2dbfc657add59a8872fed987d743b921e359c11261650400eed6157e5e22','33fc928060d7a5036933b6dcb7546e3c6a71d7be0d8d79d63386abe458742440','ce0c041ed8248b64fdc6a846611ae7545bad888c16dd2436c27894198fccd284','25ac23659e4d366f1f65c3e53b6617593d321f0ab7810e8e4fdf8b8f90a5dff6','9f136e58c745fdf6881c6a06e34da78d72c79b2bb94e2ea99953fa98b3b89d31']
          chunks=sorted(Path('.masar-blender-transfer').glob('part-*.b64'))
          assert len(chunks)==5, 'Incomplete or already imported transfer'
          for p,digest in zip(chunks,expected):
              actual=hashlib.sha256(p.read_bytes()).hexdigest();print(p.name,len(p.read_bytes()),actual)
              assert actual==digest,'Transport corruption: '+p.name
          encoded=b''.join(p.read_bytes() for p in chunks)
          assert hashlib.sha256(encoded).hexdigest()=='c76644fa9f33f68f1c490aaa303d97bb05a01698a228ba5b1536080a01c95ca2'
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert len(patch)==151615 and hashlib.sha256(patch).hexdigest()=='29ceeccdbdd286cc232d68ca65cd8dc3f11caa37d6d740220f2b9b07227bea62'
          for line in patch.decode().splitlines():
              if line.startswith(('--- ','+++ ')):
                  name=line[4:];assert name=='/dev/null' or name.startswith(('a/masar-studio/','b/masar-studio/')),name
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          for p in chunks:p.unlink()
          PY
      - name: Validate source before publishing feature commit
        working-directory: masar-studio
        run: |
          npm ci --ignore-scripts && npm run check && npm run build
          npm test > /tmp/masar-blender-node.log 2>&1 || { tail -100 /tmp/masar-blender-node.log; exit 1; }
          tail -12 /tmp/masar-blender-node.log
      - name: Commit new source without altering main or production branch
        run: |
          test "$(git branch --show-current)" = 'feature/masar-blender-20260908'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add masar-studio/docs/BLENDER-INTEGRATION.md masar-studio/public/index.html masar-studio/public/sw.js masar-studio/render-viewer masar-studio/render-worker masar-studio/server/render-service.mjs masar-studio/server/server.mjs masar-studio/shared/render-glb.js masar-studio/shared/render-scene.js masar-studio/src/app.js masar-studio/src/render-ui.js masar-studio/src/style.css masar-studio/src/three-viewer.mjs masar-studio/tests/blender-e2e.mjs masar-studio/tests/browser_http.py masar-studio/tests/browser_render.py masar-studio/tests/render-glb.test.mjs masar-studio/tests/render-scene.test.mjs masar-studio/tests/render-service.test.mjs masar-studio/tests/verify_blend_file.py masar-studio/tests/verify_blender_outputs.py masar-studio/tools/build.mjs masar-studio/tools/package-blender.py
          git add -u .masar-blender-transfer
          git diff --cached --check
          git commit -m 'feat(masar): add revision-bound Blender rendering, isolated worker and private PBR viewer'
          git push origin HEAD:feature/masar-blender-20260908
      - name: Dispatch full Blender, browser and clean-delivery verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/NAIFMUSFER/AI-Instruction/actions/workflows/masar-blender-ci.yml/dispatches -f ref=feature/masar-blender-20260908
