# =============================================================================
# CI — every gate that can run without touching production.
#
# Rules this file obeys:
#   • A pull request FAILS if any mandatory job fails. The `ci-required` job at
#     the bottom is the single status check to mark "required" in branch
#     protection: it re-reads the result of every other job and fails unless all
#     of them succeeded, so a newly added job can never silently become optional.
#   • Nothing here talks to the live deployment. Live production verification is
#     a SEPARATE workflow (production-verify.yml), triggered manually or on a
#     schedule, never from a PR.
#   • Every job writes its output to logs/<job>.log and uploads it, pass or
#     fail. `test-logs` then bundles them into one artifact.
#   • Versions match the environment the repository was verified in
#     (tests/remediation_baseline/environment.txt): Python 3.11, Node 22.
# =============================================================================
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  python-contracts:
    name: 1 · Python contracts (py_compile + phase suites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the pinned backend dependencies
        # This is also the first real proof that the pins in requirements.txt
        # resolve at all: they were derived offline from the repository's own
        # declared floors and have never been checked against PyPI.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run the Python contract suites
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          {
            set -e   # W0: بلا هذا تُقاس حالةُ آخر أمرٍ في المجموعة وحدها
            echo "=== 0 · syntax and imports ==="
            python -m py_compile acs_*.py && echo "py_compile: OK"
            python - <<'PY'
          import importlib
          mods = ["acs_visual", "acs_runtime", "acs_authoring", "acs_workspace",
                  "acs_render", "acs_bim", "acs_docs", "acs_pbr", "acs_archdetail",
                  "acs_understand", "acs_understand_api", "acs_validate",
                  "acs_layout", "acs_api_errors", "acs_generation"]
          for m in mods:
              importlib.import_module(m)
          print("imports: OK (%d modules)" % len(mods))
          PY
          } 2>&1 | tee logs/python-contracts.log
          # W0: كانت هذه حلقة `for` عارية، وحالة خروجها حالةُ آخر تكرار وحده،
          # فلم يكن يُفشِل الوظيفةَ إلا آخر اختبار. تُشغَّل الآن عبر مُشغِّل يجمع
          # الأعطال ويخرج بغير صفر إن فشل **أيّ** هدف.
          bash tools/ci_run.sh --log logs/python-contracts.log \
               --label "python contract suites" --runner "python3" \
                   tests/phase8/test_bim.py \
                   tests/phase9/test_docs.py \
                   tests/phase9_1/test_pbr.py \
                   tests/phase9_2/test_alignment.py \
                   tests/phase9_2/test_archdetail.py \
                   tests/phase9_2/test_backend_contract.py \
                   tests/phase9_2/test_black_viewport.py \
                   tests/phase9_2/test_generation_budget.py \
                   tests/phase9_2/test_live_render.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-python-contracts
          path: logs/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  js-parity:
    name: 2 · JS ⇄ Python parity and browser-mirror suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parity of every mirrored layer (Python vs the shipped JS)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          : > logs/js-parity.log
          bash tools/ci_run.sh --log logs/js-parity.log \
               --label "parity suites" --runner "node" \
                   tests/phase4/test_parity.js \
                   tests/phase5/test_parity.js \
                   tests/phase6/test_parity.js \
                   tests/phase7/test_parity.js \
                   tests/phase8/test_parity.js \
                   tests/phase9/test_parity.js \
                   tests/phase9_1/test_parity.js \
                   tests/phase9_2/test_parity.js
      - name: The JS mirrors themselves (run against the shipped page bundle)
        shell: bash
        run: |
          set -o pipefail
          # glob مُوسَّع بالصَّدَفة ثم يُمرَّر كأهداف صريحة للمُشغِّل.
          bash tools/ci_run.sh --log logs/js-parity.log \
               --label "js mirror suites" --runner "node tests/lib/run.js" \
                   tests/phase2/test_*.js \
                   tests/phase3/test_visual.js \
                   tests/phase3/test_visual_adversarial.js \
                   tests/phase3/test_dev_api.js
      - name: Remediation contracts that need only Node (W0 — previously ungated)
        # These five were outside every workflow. They pin the production error
        # UI (the backend code -> user state map must stay TOTAL), the declared
        # CSP, the WebGL diagnostics contract, request concurrency and local
        # persistence safety. Nothing here needs a browser or the network.
        shell: bash
        run: |
          set -o pipefail
          bash tools/ci_run.sh --log logs/js-parity.log \
               --label "remediation (node scope)" --runner "node tests/lib/run.js" \
                   tests/remediation/test_production_error_ui.js \
                   tests/remediation/test_csp.js \
                   tests/remediation/test_webgl_diagnostics.js \
                   tests/remediation/test_concurrency.js \
                   tests/remediation/test_persistence.js
      - name: The bundle extractor needs no installed dependency
        # This job deliberately does NOT run `npm ci`. That is exactly the
        # condition under which the extractor used to die on a private
        # Playwright path, so this is the right job to prove it never returns.
        shell: bash
        run: |
          set -o pipefail
          bash tools/ci_run.sh --log logs/js-parity.log \
               --label "bundle extractor (no node_modules)" --runner "node" \
                   tests/remediation/test_bundle_extractor.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-js-parity
          path: logs/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  chromium-browser:
    name: 3 · Real Chromium (Playwright — this job MAY use the network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the locked Playwright and its browser binaries
        # `npm ci` installs package-lock.json exactly and fails on any drift
        # from package.json. The browser binaries are NOT in the repository —
        # downloading them is why this job needs the network.
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Vendor the frontend runtime libraries (three · shims · pdf.js)
        # public/vendor/ is git-ignored and populated at build time. Without it
        # the page cannot boot, so the browser suites would be meaningless.
        run: bash tools/netlify-build.sh
      - name: Browser suites against the shipped page
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          # W0: كانت هذه مجموعة أقواس، فحالة خروجها آخر أمرٍ وحده — نفس عطل
          # الحلقة في موضعٍ خامس. ثلاثة مُشغِّلات لأن البادئات مختلفة، وعلَمٌ
          # واحد يجمعها: أيّ فشل في أيّ منها يُفشل الوظيفة.
          rc=0
          bash tools/ci_run.sh --log logs/chromium-browser.log \
               --label "page bundle in Chromium" \
               --runner "node tests/phase3/lib/run_browser.js" \
                   test_visual.js \
                   test_dev_api.js \
                   "$PWD/tests/phase6/test_dom.js" \
                   "$PWD/tests/phase9_2/test_archdetail_browser.js" || rc=1
          # KI-13 · F-30 — معمارية التنسيق تحت السياسة الإنتاجية. تُشغَّل هنا
          # لأن هذه هي الوظيفة الوحيدة التي تملك Chromium حقيقياً و
          # public/vendor مملوءاً، فيقاس الرسم الكامل لا رسمٌ مُكعَّب.
          # KI-25: رد 200 لا يصل النافذة عطلٌ لا نجاح — والبكسلات تُقاس في
          # test_apply_render_browser.js على WebGL2 حقيقي.
          # W0: أُضيف test_accessibility و csp_browser_probe — كانا خارج كل
          # الوظائف، وهذه الوظيفة الوحيدة التي تملك ما يقيسانه. والمِسبار هو
          # ما يكتب outputs/csp_probe.json الذي يمنح test_csp.js ~15 تأكيداً.
          bash tools/ci_run.sh --log logs/chromium-browser.log \
               --label "browser suites (direct)" --runner "node" \
                   tests/remediation/test_pdf_runtime.mjs \
                   tests/deploy/test_viewport_pixels.js \
                   tests/deploy/verify_page_boot.js \
                   tests/remediation/test_csp_style_architecture.js \
                   tests/remediation/test_panel_entry.js \
                   tests/remediation/test_module_graph.js \
                   tests/remediation/test_apply_render_browser.js \
                   tests/remediation/test_scene_benchmark.js \
                   tests/remediation/test_accessibility.js \
                   tests/remediation/csp_browser_probe.js || rc=1
          bash tools/ci_run.sh --log logs/chromium-browser.log \
               --label "node-scope scene suites" --runner "node tests/lib/run.js" \
                   tests/remediation/test_model_apply.js \
                   tests/remediation/test_scene_limits.js \
                   tests/remediation/test_alignment_diagnostics.js || rc=1
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-chromium-browser
          path: logs/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  security:
    name: 4 · Security and configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the pinned dependencies
        # Same latent defect as job 7 had: this job runs a Python suite on a
        # bare interpreter. It passes today only because that suite happens to
        # import nothing third-party — one added import would break it for a
        # reason that has nothing to do with security. Installed, not gambled.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: tests/security
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          python3 tests/security/test_security.py 2>&1 | tee logs/security.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-security
          path: logs/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  accessibility:
    name: 5 · Accessibility (DOM contract of the shipped page)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: DOM/ARIA contract
        # NOTE ON SCOPE — this asserts the DOM contract the repository declares:
        # every top-bar control carries an accessible label, aria-pressed /
        # aria-live / aria-modal are present where the spec requires them, and
        # the specification itself does NOT claim formal conformance
        # (ACS_WORKSPACE_SPEC.accessibility.claims_formal_compliance === false).
        # Formal WCAG conformance and real assistive-technology testing are
        # NOT VERIFIED — EXTERNAL ENVIRONMENT REQUIRED (a human with a screen
        # reader). This job must never be described as a WCAG pass.
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          {
            set -e   # W0: بلا هذا تُقاس حالةُ آخر أمرٍ في المجموعة وحدها
            node tests/lib/run.js tests/phase6/test_dom.js
            echo
            echo "NOT VERIFIED — EXTERNAL ENVIRONMENT REQUIRED: formal WCAG"
            echo "conformance and assistive-technology testing are outside CI."
          } 2>&1 | tee logs/accessibility.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-accessibility
          path: logs/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  deploy-verification:
    name: 6 · Deployment closure (content, not the live site)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: tests/deploy/verify_deploy.sh
        # Verifies WHAT WOULD BE DEPLOYED (import closure vs Dockerfile COPY,
        # generated page blocks, no secret, no sandbox path). It never contacts
        # the deployment — that is production-verify.yml.
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          sh tests/deploy/verify_deploy.sh 2>&1 | tee logs/deploy-verification.log
      - name: Fail if the working tree was modified by the regenerators
        # verify_deploy.sh re-runs the browser-block injectors. If that changes
        # public/index.html, the committed page is stale.
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-deploy-verification
          path: logs/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  dependency-audit:
    name: 7 · Dependency audit and lock contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the pinned dependencies the remediation suites import
        # This job used to run 22 suites on a BARE interpreter: checkout,
        # setup-python, setup-node, then straight into the tests. Six of them
        # import packages that were therefore never installed, and failed for
        # that reason alone — no logic defect in any of them:
        #   test_event_loop · test_upload_security · test_generation_cancel
        #   test_privacy_boundary · test_api_wiring · test_p0_hardening
        # Job 1 has always installed requirements.txt; this job simply never
        # did. Nothing was made optional and no import was wrapped to pass a
        # test: the dependency is real, so it is installed.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Offline audit + lock contract
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          # W0: كانت هذه مجموعةَ أقواس `{ … } | tee`، وحالة خروجها حالةُ آخر
          # أمرٍ فيها وحده — نفس عطل الحلقة في موضعٍ رابع. أُعيد إنتاجه.
          python3 tools/dependency_audit.py 2>&1 | tee logs/dependency-audit.log
          rc_audit=${PIPESTATUS[0]}
          bash tools/ci_run.sh --log logs/dependency-audit.log \
               --label "dependency + provider + remediation contracts" \
               --runner "python3" \
                   tests/remediation/test_dependency_lock.py \
                   tests/remediation/test_provider_integration.py \
                   tests/remediation/test_plan_chunking.py \
                   tests/remediation/test_event_loop.py \
                   tests/remediation/test_provider_reject.py \
                   tests/remediation/test_multi_provider.py \
                   tests/remediation/test_upload_security.py \
                   tests/remediation/test_rate_limit.py \
                   tests/remediation/test_engineering_authority.py \
                   tests/remediation/test_generation_cancel.py \
                   tests/remediation/test_logging.py \
                   tests/remediation/test_privacy_boundary.py \
                   tests/remediation/test_build_metadata.py \
                   tests/remediation/test_plate_extent.py \
                   tests/remediation/test_bundle_report.py \
                   tests/remediation/test_api_wiring.py \
                   tests/remediation/test_ci_gate.py \
                   tests/remediation/test_p0_hardening.py \
                   tests/remediation/test_provider_accounting.py \
                   tests/remediation/test_provider_capability.py \
                   tests/remediation/test_browser_acquisition.py \
                   tests/remediation/test_asgi_client_contract.py \
                   tests/remediation/test_ci_dependencies.py \
                   tests/remediation/test_job_boundary.py \
                   tests/remediation/test_container_topology.py \
                   tests/remediation/test_inline_style_sources.py
          rc_suites=$?
          if [ "$rc_audit" -ne 0 ] || [ "$rc_suites" -ne 0 ]; then exit 1; fi
      - name: CVE scan (required — findings or unavailable advisories block release)
        # This is the ONE dependency check that cannot be done offline, so it is
        # required here where the network exists. Findings and service errors
        # both block ci-required; neither is silently converted into success.
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt 2>&1 | tee -a logs/dependency-audit.log
          npm audit --package-lock-only 2>&1 | tee -a logs/dependency-audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-dependency-audit
          path: logs/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  build-frontend:
    name: 8 · Frontend build gates (index guard · integration · API base)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static gates that tools/netlify-build.sh runs after vendoring
        # tools/netlify-build.sh has NO check-only mode: every path in it does a
        # real `npm ci`. So this job runs the three guards the script invokes
        # after vendoring, plus a shell syntax check of the script itself. The
        # vendoring half is exercised for real in the chromium-browser job.
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          {
            set -e   # W0: بلا هذا تُقاس حالةُ آخر أمرٍ في المجموعة وحدها
            bash -n tools/netlify-build.sh && echo "netlify-build.sh: shell syntax OK"
            python3 tools/check_integration.py
            python3 tools/check_index_guard.py public/index.html
            python3 tools/check_api_base.py
            python3 tools/check_harness_encapsulation.py
          } 2>&1 | tee logs/build-frontend.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-build-frontend
          path: logs/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  docker-build:
    name: 9 · Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        # Builds the exact image Render builds. This is where the pinned
        # requirements.txt is proven installable end to end.
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          docker build -t acs-engine:ci . 2>&1 | tee logs/docker-build.log
      - name: The image boots and answers /health
        # لماذا لا `--rm` هنا
        # ----------------------
        # كانت الحاوية تُشغَّل بـ`--rm`، فإن سقطت عند الإقلاع حذفها Docker
        # فوراً. فما وصل السجلّ هو نتيجةُ الحذف لا سببُ السقوط:
        #     curl: (56) Recv failure: Connection reset by peer
        #     Error response from daemon: No such container: acs-ci
        # أي أن الاستثناء الذي أوقف الخادم لم يُطبَع قطّ. الحاوية تبقى الآن
        # حتى تُقرأ، ثم تُحذف صراحةً.
        #
        # هذه الخطوة أداةُ تشخيص لا فرضية: لا تدّعي سبباً (ربط المنفذ، PORT،
        # نقطة الدخول، تبعية ناقصة) — تطبع ما تقوله الحاوية نفسها. والبوّابة
        # تبقى كما هي: إن لم يُجب /health خرجت الخطوة بغير صفر.
        shell: bash
        run: |
          set -o pipefail
          say() { printf '\n=== %s ===\n' "$1" | tee -a logs/docker-build.log; }
          dump() {
            say "docker ps -a"
            docker ps -a 2>&1 | tee -a logs/docker-build.log
            say "docker logs acs-ci (the startup exception, if any)"
            docker logs acs-ci 2>&1 | tail -300 | tee -a logs/docker-build.log
            say "docker inspect acs-ci — ExitCode · Error · Cmd · Entrypoint"
            for f in State.ExitCode State.OOMKilled State.Error State.Status \
                     State.StartedAt State.FinishedAt Config.Cmd \
                     Config.Entrypoint Config.User Config.WorkingDir \
                     Config.ExposedPorts HostConfig.PortBindings; do
              v=$(docker inspect -f "{{json .$f}}" acs-ci 2>&1 || echo '<unavailable>')
              printf '%-26s %s\n' "$f" "$v" | tee -a logs/docker-build.log
            done
          }

          # ── طوبولوجيا هذه الوظيفة، مُعلَنة لا مفترَضة ────────────────────
          # الأداة التي أُضيفت في الالتزام السابق أثبتت السبب بدل تخمينه:
          #     ExitCode 3 · Status exited · Cmd sh -c "uvicorn … --host 0.0.0.0"
          #     [ACS-BOOT] REFUSING TO START — ACS_ENV=production with a
          #     process-local rate limiter and no ACS_SINGLE_INSTANCE=1
          #     acknowledgement.
          # الصورة تبني وتُقلع؛ الخادم هو من يرفض. والرفض صحيح: حدُّ معدّلٍ
          # محليّ العملية بلا إقرارٍ يعني أن السقف اليوميّ يتضاعف بعدد النسخ
          # بصمت. لا يُضعَّف الثابت ولا يُلتفّ عليه بتعديل Dockerfile.
          #
          # وهذه الوظيفة تشغّل **حاويةً واحدة** بالضبط: `docker run` واحد،
          # اسمٌ واحد، ومنفذٌ واحد. فالإقرار هنا وصفٌ صادق للطوبولوجيا التي
          # تُختبَر، لا التفاف عليها — وهو المخرج الذي يعلنه نصّ الرفض نفسه.
          # الإنتاج لا يتأثّر: القيم تُمرَّر إلى هذا التشغيل وحده.
          # واسمُ متغيّر التزامن هو WEB_CONCURRENCY بالضبط — وهو أحد الأسماء
          # في acs_rate_limit.CONCURRENCY_VARS. اسمٌ غيره يمرّ صامتاً بلا أثر،
          # فيبدو الإقرار مضبوطاً وهو لا يُقرأ. مثبَّت باختبار.
          docker run -d -p 8000:8000 -e PORT=8000 \
            -e ACS_ENV=production \
            -e ACS_SINGLE_INSTANCE=1 \
            -e WEB_CONCURRENCY=1 \
            --name acs-ci acs-engine:ci \
            2>&1 | tee -a logs/docker-build.log

          healthy=0
          for i in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Status}}' acs-ci 2>/dev/null || echo missing)
            if [ "$state" != "running" ]; then
              say "container state is '$state' after $((i*2))s — it is not running"
              break
            fi
            if curl -fsS http://127.0.0.1:8000/health > /tmp/health.json 2>/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done

          dump
          if [ "$healthy" -eq 1 ]; then
            say "/health"
            cat /tmp/health.json | tee -a logs/docker-build.log
          fi

          # التنظيف بعد قراءة كل شيء، وبحراسة الوجود لا بكتم الخطأ.
          if docker ps -a --format '{{.Names}}' | grep -qx acs-ci; then
            docker rm -f acs-ci > /dev/null
          fi

          if [ "$healthy" -ne 1 ]; then
            echo "::error::the image did not answer /health — see the container logs and inspect output above"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-docker-build
          path: logs/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  test-logs:
    name: 10 · Collect every test log
    runs-on: ubuntu-latest
    if: always()
    needs:
      - python-contracts
      - js-parity
      - chromium-browser
      - security
      - accessibility
      - deploy-verification
      - dependency-audit
      - build-frontend
      - docker-build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all-logs
          pattern: log-*
          merge-multiple: false
      - name: Index what was collected
        shell: bash
        run: |
          {
            echo "run: ${{ github.run_id }}  ref: ${{ github.ref }}"
            echo "commit: ${{ github.sha }}"
            echo
            find all-logs -type f | sort
          } | tee all-logs/INDEX.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ github.run_id }}
          path: all-logs/
          retention-days: 30

  # ---------------------------------------------------------------------------
  ci-required:
    name: CI required (mark THIS one as the required status check)
    runs-on: ubuntu-latest
    if: always()
    needs:
      - python-contracts
      - js-parity
      - chromium-browser
      - security
      - accessibility
      - deploy-verification
      - dependency-audit
      - build-frontend
      - docker-build
    steps:
      - name: Fail unless every mandatory job succeeded
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          bad=0
          for state in failure cancelled skipped; do
            if echo "$RESULTS" | grep -q "\"result\": *\"$state\""; then
              echo "::error::a mandatory CI job is in state '$state' — this pull request cannot merge"
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            exit 1
          fi
          echo "all mandatory jobs succeeded"
