name: Apply room presentation handoff repair
on:
  push:
    paths:
      - 'tools/_apply_room_presentation_guard.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/approved-room-presentation-geometry-v2
      - name: Apply audited handoff guard
        run: python tools/_apply_room_presentation_guard.py
      - name: Verify focused repair
        run: |
          python -m py_compile tools/acs_plan_handoff.py tests/remediation/test_plan_handoff_room_presentation_geometry.py
          python -S tests/remediation/test_plan_handoff_room_presentation_geometry.py
      - name: Remove temporary tooling and push repair
        run: |
          rm tools/_apply_room_presentation_guard.py .github/workflows/_apply-room-presentation-guard.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(acs-v2): fail closed on implicit approved room presentation geometry'
          git push origin HEAD:audit/approved-room-presentation-geometry-v2
