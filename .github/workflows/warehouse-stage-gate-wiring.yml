name: ACS warehouse stage-gate production wiring

on:
  push:
    branches:
      - acs-v2/warehouse-vertical-stage-gate-20260915
    paths:
      - tools/wire_warehouse_stage_gate.py

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acs-v2/warehouse-vertical-stage-gate-20260915
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact production wiring
        run: python tools/wire_warehouse_stage_gate.py
      - name: Run focused regression
        run: |
          python tests/remediation/test_warehouse_vertical_stage_gate.py
          python -m py_compile warehouse_vertical_stage_gate.py acs_workspace_service.py acs_plan_projection.py acs_plan_review.py
      - name: Commit wiring if changed
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add acs_workspace_service.py acs_plan_projection.py acs_plan_review.py Dockerfile tests/remediation/test_warehouse_vertical_stage_gate.py
          git commit -m 'feat(acs-v2): wire warehouse vertical stage gate into production flow'
          git push origin HEAD:acs-v2/warehouse-vertical-stage-gate-20260915
