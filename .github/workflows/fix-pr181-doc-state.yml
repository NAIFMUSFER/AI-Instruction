name: Refresh measured current-state documentation for PR181
on:
  push:
    branches: [acs-v2/warehouse-scorecard-ui-disclosures]
    paths: [.github/workflows/fix-pr181-doc-state.yml]
permissions: {contents: write}
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: acs-v2/warehouse-scorecard-ui-disclosures, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Regenerate measured documentation state
        shell: bash
        run: |
          python3 tools/bundle_report.py
          # --fix regenerates ACS:CURRENT-STATE before it reports any optional
          # browser-measurement limitation. CI proper installs Chromium and will
          # perform the authoritative post-commit verification.
          python3 tools/check_doc_claims.py --fix || true
          git diff -- KNOWN-ISSUES.md
      - name: Commit measured documentation only
        run: |
          git config user.name 'NAIFMUSFER'
          git config user.email 'whili9070@gmail.com'
          git add KNOWN-ISSUES.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs: refresh measured current-state bundle facts'
          git push origin HEAD:acs-v2/warehouse-scorecard-ui-disclosures
