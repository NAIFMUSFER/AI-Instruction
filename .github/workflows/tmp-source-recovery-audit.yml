name: Temporary source recovery audit snapshot
on:
  push:
    branches: [fix/plan-source-review-recovery-20260915]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive tracked public source only
        shell: bash
        run: |
          git ls-files -z | tar --null -T - -czf /tmp/acs-source-recovery.tar.gz
          git rev-parse HEAD > /tmp/acs-source-recovery-head.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: acs-source-recovery-audit
          path: |
            /tmp/acs-source-recovery.tar.gz
            /tmp/acs-source-recovery-head.txt
          retention-days: 1
