name: Plan-first approved 3D derived authority

on:
  pull_request:
    paths:
      - 'tools/acs_plan_handoff.py'
      - 'tests/remediation/test_plan_handoff_derived_authority.py'
      - '.github/workflows/plan-approved-3d-derived-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile approved 3D authority contracts
        run: python -m py_compile tools/acs_plan_handoff.py tests/remediation/test_plan_handoff_derived_authority.py
      - name: Explicit approved 3D derived-authority regressions
        run: python tests/remediation/test_plan_handoff_derived_authority.py
      - name: No generated diff
        run: git diff --exit-code
