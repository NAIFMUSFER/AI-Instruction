name: Correct isolated panel harness
on:
  push:
    branches: ['fix/async-generation-20260911']
permissions:
  contents: write
jobs:
  harness:
    if: ${{ !contains(github.event.head_commit.message, '[panel-harness-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/async-generation-20260911
      - name: Apply correction to the isolated test graph only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/remediation/test_panel_entry.js');s=p.read_text()
          old="  'generated/arch-detail-bridge.js', 'trust/wiring.js']);"
          new="  'generated/arch-detail-bridge.js', 'trust/wiring.js', 'ui/generation-jobs.js']);"
          assert s.count(old)==1
          s=s.replace(old,new)
          anchor='const THREE_DEPENDENT = new Set('
          note='/* The delivery recovery layer uses real model/first-frame exports absent\n   from this isolated panel stub. Run 34542836057 proved the missing export;\n   test_generation_jobs_shipped_page.js separately measures this layer with\n   the actual shipped UI, Three.js and verified model pixels. Panel assertions\n   below remain unchanged. */\n'
          assert s.count(anchor)==1
          p.write_text(s.replace(anchor,note+anchor))
          PY
          node --check tests/remediation/test_panel_entry.js
          git diff --check
          git add tests/remediation/test_panel_entry.js
          git config user.name 'NAIFMUSFER'
          git config user.email 'whili9070@gmail.com'
          git commit -m 'Keep rendering recovery out of isolated panel stub [panel-harness-applied]'
          git push origin HEAD:fix/async-generation-20260911
