name: RC merge measurement regeneration
on:
  push:
    branches:
      - release/acs-design-pipeline-v2-rc1
permissions:
  contents: write
concurrency:
  group: rc-merge-measurement-regeneration
  cancel-in-progress: true
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release/acs-design-pipeline-v2-rc1
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Regenerate measured bundle state
        run: |
          set -euo pipefail
          python3 tools/bundle_report.py
          python3 - <<'PY'
          import tools.check_doc_claims as claims
          ok, message = claims.check_state(fix=True)
          print(message)
          if not ok:
              raise SystemExit(1)
          PY
          git diff --check
      - name: Commit generated measurements when changed
        run: |
          set -euo pipefail
          git add tests/performance/bundle_report.json KNOWN-ISSUES.md
          if git diff --cached --quiet; then
            echo 'Measured state already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(rc): regenerate measured source state after main sync'
          git push origin HEAD:release/acs-design-pipeline-v2-rc1
