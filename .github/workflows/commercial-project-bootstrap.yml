name: Commercial atomic project bootstrap
on:
  push:
    branches:
      - 'feature/commercial-project-bootstrap-v2'
    paths:
      - 'acs_plan_store.py'
      - 'tests/remediation/test_commercial_project_bootstrap.py'
      - '.github/workflows/commercial-project-bootstrap.yml'
  pull_request:
    paths:
      - 'acs_plan_store.py'
      - 'tests/remediation/test_commercial_project_bootstrap.py'
      - '.github/workflows/commercial-project-bootstrap.yml'
permissions:
  contents: read
concurrency:
  group: commercial-project-bootstrap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile bootstrap contracts
        run: python -m py_compile acs_plan_store.py tests/remediation/test_commercial_project_bootstrap.py
      - name: Atomic bootstrap regressions
        env:
          ACS_ENV: test
          ANTHROPIC_API_KEY: dummy
        run: python -S tests/remediation/test_commercial_project_bootstrap.py
      - name: Existing store regressions
        env:
          ACS_ENV: test
          ANTHROPIC_API_KEY: dummy
        run: python -S tests/remediation/test_plan_store.py
      - name: No generated diff
        run: git diff --exit-code
