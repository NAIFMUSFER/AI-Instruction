name: MASAR materialize verified 4.1 source
on:
  push:
    branches: ['masar/production-v4']
    paths: ['masar-deploy/recovery-4.1/part-010']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Recover exact source from verified transport
        env:
          RECOVER_B64: 
          MANIFEST_B64: 
        run: |
          printf '%s' "$RECOVER_B64" | base64 -d > /tmp/recover.py
          printf '%s' "$MANIFEST_B64" | base64 -d > masar-deploy/recovery-4.1/manifest.json
          python /tmp/recover.py --payload masar-deploy/recovery-4.1 --base masar-deploy/payload --dest masar-studio | tee masar-recovery-result.json
      - name: Verify source gates before repository materialization
        working-directory: masar-studio
        run: |
          npm ci --ignore-scripts
          npm run check
          npm run build
          npm test
      - name: Preserve recovery evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masar-4.1-materialization-evidence
          path: |
            masar-recovery-result.json
            masar-deploy/recovery-4.1/manifest.json
          retention-days: 30
      - name: Commit ordinary readable MASAR source
        run: |
          test "$(git branch --show-current)" = 'masar/production-v4'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add masar-studio masar-deploy/recovery-4.1/manifest.json
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'feat(masar): materialize verified 4.1.0 source'
          git push origin HEAD:masar/production-v4
