name: MASAR materialize verified 4.1 source
on:
  push:
    branches: ['masar/production-v4']
    paths: ['masar-deploy/recovery-4.1/part-010']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Recover exact source from verified transport
        run: |
          python masar-deploy/ci/recover-4.1.py \
            --payload masar-deploy/recovery-4.1 \
            --base masar-deploy/payload \
            --contract masar-deploy/ci/recovery-4.1-manifest.json \
            --dest masar-studio | tee masar-recovery-result.json
      - name: Verify source gates before repository materialization
        working-directory: masar-studio
        run: |
          npm ci --ignore-scripts
          npm run check
          npm run build
          npm test
      - name: Preserve recovery evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masar-4.1-materialization-evidence
          path: |
            masar-recovery-result.json
            masar-deploy/ci/recovery-4.1-manifest.json
          retention-days: 30
      - name: Commit ordinary readable MASAR source
        run: |
          test "$(git branch --show-current)" = 'masar/production-v4'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add masar-studio
          git add -f masar-studio/dist/index.html masar-studio/dist/app.bundle.js
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'feat(masar): materialize verified 4.1.0 source'
          git push origin HEAD:masar/production-v4
