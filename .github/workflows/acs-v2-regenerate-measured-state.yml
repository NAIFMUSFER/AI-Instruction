name: ACS v2 regenerate measured source state

on:
  push:
    branches:
      - acs-v2/connected-property-lock-ui-20260915-r2

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'NAIFMUSFER/AI-Instruction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acs-v2/connected-property-lock-ui-20260915-r2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate measured bundle report
        run: python3 tools/bundle_report.py
      - name: Regenerate only the measured CURRENT-STATE documentation block
        run: |
          python3 - <<'PY'
          import tools.check_doc_claims as c
          ok, msg = c.check_state(fix=True)
          print(msg)
          raise SystemExit(0 if ok else 1)
          PY
      - name: Commit generated evidence only when changed
        run: |
          git add tests/performance/bundle_report.json KNOWN-ISSUES.md
          if git diff --cached --quiet; then
            echo 'Measured state already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(acs-v2): regenerate measured frontend state'
          git push origin HEAD:acs-v2/connected-property-lock-ui-20260915-r2
