name: PR49 regenerate measured source state
on:
  push:
    branches:
      - feature/warehouse-render-identity-v2
    paths:
      - '.github/workflows/pr49-regenerate-measurements.yml'
permissions:
  contents: write
concurrency:
  group: pr49-regenerate-measurements
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/warehouse-render-identity-v2
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Regenerate bundle measurement and current-state block
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bundle_report.py
          python3 - <<'PY'
          from pathlib import Path
          import tools.check_doc_claims as claims

          path = Path(claims.STATE_DOC)
          text = path.read_text(encoding='utf-8')
          start = text.index(claims.STATE_BEGIN)
          end = text.index(claims.STATE_END, start) + len(claims.STATE_END)
          path.write_text(text[:start] + claims.render_state() + text[end:], encoding='utf-8')
          PY
          git diff --check -- KNOWN-ISSUES.md tests/performance/bundle_report.json
      - name: Commit only generated measurements and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add KNOWN-ISSUES.md tests/performance/bundle_report.json
          git rm .github/workflows/pr49-regenerate-measurements.yml
          git diff --cached --check
          git commit -m 'chore(pr49): refresh measured frontend state'
          git push origin HEAD:feature/warehouse-render-identity-v2
