name: MASAR Blender integration verification
on:
  workflow_dispatch:
  pull_request:
    branches: ['masar/production-v4']
    paths: ['masar-studio/**', '.github/workflows/masar-blender-ci.yml']
permissions:
  contents: read
concurrency:
  group: masar-blender-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
    working-directory: masar-studio
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - run: npm ci --ignore-scripts && npm run check && npm run build
      - run: mkdir -p test-output && npm test | tee test-output/node-blender-tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: blender-node-evidence
          path: masar-studio/test-output/node-blender-tests.log
          retention-days: 14
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts && npm run build
      - run: python -m pip install playwright==1.62.0 && python -m playwright install --with-deps ${{ matrix.engine }}
      - run: python tests/browser_http.py
        env:
          MASAR_BROWSER: ${{ matrix.engine }}
      - if: matrix.engine == 'chromium'
        run: python tests/browser_flows.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: blender-browser-${{ matrix.engine }}-evidence
          path: |
            masar-studio/test-output/browser-http-*/
            masar-studio/docs/browser-tests.json
          retention-days: 14
  exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install ifcopenshell==0.8.5 pytest==8.4.2
      - run: node tests/ifc-fixtures.mjs && python tests/ifc_external.py
      - run: node tests/docker-smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: blender-exchange-evidence
          path: |
            masar-studio/test-output/ifc/independent-report.json
            masar-studio/test-output/docker-report.json
          retention-days: 14
  blender:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build self-hosted pinned browser runtime
        run: |
          npm ci --ignore-scripts && npm run check && npm run build
          cd render-viewer && npm ci && npm run build
      - name: Install test browser and image verifier
        run: |
          python -m pip install playwright==1.62.0 pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Build actual isolated worker image
        run: docker build --progress=plain -f render-worker/Dockerfile -t masar-blender:4.5.13 .
      - name: Real API to Docker to Blender to authenticated browser
        env:
          MASAR_RENDER_DOCKER: 'true'
          MASAR_RENDER_BROWSER: 'true'
        run: node tests/blender-e2e.mjs
      - name: Independently decode actual GLB vertices and image bytes
        run: python tests/verify_blender_outputs.py
      - name: Reopen generated blend and verify source coordinates again
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 3g --cpus 2 --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,nosuid,size=256m -v "$PWD:/verify:ro" -v "$PWD/test-output/blender:/out:rw" masar-blender:4.5.13 --background --disable-autoexec --offline-mode /out/model.blend --python-exit-code 1 --python /verify/tests/verify_blend_file.py -- /out
      - name: Record source and tool provenance
        run: |
          git rev-parse HEAD > test-output/blender/source-commit.txt
          cp public/render-viewer-integrity.json test-output/blender/
          python -m pip freeze > test-output/blender/test-environment.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: blender-real-render-evidence
          path: masar-studio/test-output/blender/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blender-viewer-assets
          path: |
            masar-studio/public/render-engine.js
            masar-studio/public/render-viewer.js
            masar-studio/public/render-viewer-integrity.json
            masar-studio/public/render-viewer-LICENSE.txt
          retention-days: 14
  package:
    needs: [node, browser, exchange, blender]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: blender-viewer-assets
          path: masar-studio/public
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: blender-*-evidence
          path: delivery-blender/verification
      - name: Assemble source and verify clean extraction
        run: |
          npm run build
          python tools/package-blender.py ../delivery-blender
          cd ../delivery-blender && sha256sum -c SHA256SUMS
          python -m zipfile -e Masar-Blender-Integration-v1-Source.zip ../blender-recheck
          cd ../blender-recheck/masar-studio
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          m=json.loads(Path('BLENDER-RELEASE-MANIFEST.json').read_text())
          for name,digest in m['files'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          for p in Path('.').rglob('*'):
              assert p.suffix.lower() not in {'.ttf','.otf','.woff','.woff2','.sqlite','.db','.pyc'},str(p)
          print('PASS: clean package checksums, no credentials/databases/font files')
          PY
          npm ci --ignore-scripts && npm run check && npm run build
          cmp dist/index.html ../../delivery-blender/Masar-Blender-Integration-v1.html
          npm test > ../../delivery-blender/clean-package-node-tests.log
          tail -12 ../../delivery-blender/clean-package-node-tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masar-blender-integration-v1
          path: delivery-blender/
          if-no-files-found: error
          retention-days: 30
