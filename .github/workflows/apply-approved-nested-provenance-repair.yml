name: Apply approved nested provenance repair
on:
  pull_request:
    paths:
      - '.github/workflows/apply-approved-nested-provenance-repair.yml'
permissions:
  contents: write
concurrency:
  group: apply-approved-nested-provenance-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'audit/approved-3d-nested-provenance-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/approved-3d-nested-provenance-v2
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Apply minimal handoff-only repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/acs_plan_handoff.py')
          text = path.read_text(encoding='utf-8')

          marker = 'def _require_explicit_object_geometry(building: dict) -> None:\n'
          if marker not in text:
              raise SystemExit('guard insertion marker missing')
          if 'def _require_traceable_approved_nested_elements(' not in text:
              helper = '''_APPROVED_NESTED_COLLECTIONS = (\n    "racks", "docks", "lanes", "stations", "doors", "windows",\n    "objects", "points", "furniture",\n)\n\n\ndef _stable_nested_identity(value: object) -> bool:\n    return isinstance(value, str) and bool(value.strip()) and len(value) <= 160\n\n\ndef _require_traceable_approved_nested_elements(building: dict) -> None:\n    """Require stable canonical identity for geometry that can reach approved 3D.\n\n    ``provenance_map`` derives nested-element ``source_id`` only from a stable\n    explicit canonical ``id``.  Final approved 3D therefore refuses anonymous\n    nested geometry instead of promoting renderer array position to engineering\n    identity.  Requirement links/source ids are never invented here.\n    """\n    floors = building.get("floors")\n    if not isinstance(floors, dict):\n        return  # PlanWorkspace owns the top-level model contract.\n    for template, floor in floors.items():\n        if not isinstance(floor, dict) or not isinstance(floor.get("rooms"), list):\n            continue\n        for room in floor["rooms"]:\n            if not isinstance(room, dict):\n                continue\n            room_id = room.get("id")\n            for collection in _APPROVED_NESTED_COLLECTIONS:\n                items = room.get(collection)\n                if items is None:\n                    continue\n                if not isinstance(items, list):\n                    continue  # Existing provenance admission owns malformed shapes.\n                for index, item in enumerate(items):\n                    if not isinstance(item, dict):\n                        continue  # Existing provenance admission owns malformed entries.\n                    if not _stable_nested_identity(item.get("id")):\n                        where = f"{template}/{room_id}/{collection}/{index}"\n                        raise PlanError(\n                            "DOWNSTREAM_PROVENANCE_NOT_SPECIFIED",\n                            f"Approved nested geometry requires a stable explicit id at {where}",\n                        )\n\n\n'''
              text = text.replace(marker, helper + marker, 1)

          call_marker = '    building = json.loads(canonical(handoff.get("building")))\n    _require_explicit_object_geometry(building)\n'
          if call_marker not in text:
              raise SystemExit('handoff call marker missing')
          if '    _require_traceable_approved_nested_elements(building)\n' not in text:
              text = text.replace(
                  call_marker,
                  '    building = json.loads(canonical(handoff.get("building")))\n'
                  '    _require_traceable_approved_nested_elements(building)\n'
                  '    _require_explicit_object_geometry(building)\n',
                  1,
              )

          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile tools/acs_plan_handoff.py tests/remediation/test_plan_handoff_nested_provenance.py
          python -S tests/remediation/test_plan_handoff_nested_provenance.py
          git diff --check
      - name: Commit repair and remove one-time workflow
        env:
          BRANCH: audit/approved-3d-nested-provenance-v2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-approved-nested-provenance-repair.yml
          git add tools/acs_plan_handoff.py
          git commit -m 'fix(acs-v2): require traceable approved nested geometry'
          git push origin HEAD:${BRANCH}
