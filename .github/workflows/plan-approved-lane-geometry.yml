name: Plan-first approved warehouse lane geometry
on:
  pull_request:
    paths:
      - 'tools/acs_plan_handoff.py'
      - 'tests/remediation/test_plan_handoff_warehouse_lane_geometry.py'
      - '.github/workflows/plan-approved-lane-geometry.yml'
permissions:
  contents: read
concurrency:
  group: plan-approved-lane-geometry-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lane-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Explicit approved warehouse lane geometry regressions
        run: |
          set -o pipefail
          python -m py_compile tools/acs_plan_handoff.py tests/remediation/test_plan_handoff_warehouse_lane_geometry.py
          python tests/remediation/test_plan_handoff_warehouse_lane_geometry.py
      - name: Working tree remains clean
        run: git diff --exit-code
