name: MASAR exact WebKit PWA outage patch
on:
  push:
    branches: ['masar/production-v4']
    paths: ['.github/workflows/masar-patch-webkit-pwa.yml']
permissions:
  contents: write
  actions: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: masar/production-v4
      - name: Apply exact controlled-client PWA outage test
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('masar-studio/tests/browser_http.py')
          s=p.read_text()
          old="""            def offline():\n                # Stop the actual origin instead of relying on Playwright's offline emulator.\n                # This exercises the real PWA outage path equally in all three engines.\n                server.terminate();server.wait(timeout=8);offline_page=context.new_page();offline_page.set_default_timeout(15000);observe(offline_page)\n                try:\n                    offline_page.goto(base,wait_until='domcontentloaded');ready(offline_page);expect(offline_page.locator('#project-title')).to_have_text(current_title);action(offline_page,'account');expect(offline_page.locator('#modal-title')).to_contain_text('تحتاج تشغيل الخادم');close(offline_page)\n                finally:\n                    offline_page.close()"""
          new="""            def offline():\n                # Verify this persisted client is actively controlled before removing the origin.\n                # Reloading the controlled document under a real server outage tests the service\n                # worker navigation fallback without depending on engine-specific new-page races.\n                page.wait_for_function('navigator.serviceWorker.controller!==null')\n                server.terminate();server.wait(timeout=8)\n                page.reload(wait_until='domcontentloaded');ready(page);expect(page.locator('#project-title')).to_have_text(current_title);action(page,'account');expect(page.locator('#modal-title')).to_contain_text('تحتاج تشغيل الخادم');close(page)"""
          if s.count(old) != 1:
              raise SystemExit(f'exact patch target count={s.count(old)}, refusing')
          p.write_text(s.replace(old,new))
          PY
          python -m py_compile masar-studio/tests/browser_http.py
          git diff --check
          git diff -- masar-studio/tests/browser_http.py
      - name: Commit exact browser harness fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add masar-studio/tests/browser_http.py
          git commit -m 'test(masar): exercise outage through an existing controlled PWA client'
          git push origin HEAD:masar/production-v4
      - name: Dispatch full release verification on patched branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run masar-release-ci.yml --ref masar/production-v4
