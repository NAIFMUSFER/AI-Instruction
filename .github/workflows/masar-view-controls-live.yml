name: MASAR floor views published acceptance
on:
  push:
    branches: ['ops/masar-customer-live-20260908']
    paths: ['.github/workflows/masar-view-controls-live.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: masar-view-controls-live
  cancel-in-progress: false
env:
  MASAR_EXPECTED_COMMIT: 3c971cddc52e1fbe00275f0c5be627b82b81c74a
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3c971cddc52e1fbe00275f0c5be627b82b81c74a
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3a6c4ce1cf3254f8650d24d114e052653d9c1a4f
          path: ops
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build exact accepted source and repeat every Node regression
        working-directory: masar-studio
        run: |
          mkdir -p test-output/view-controls
          npm ci --ignore-scripts
          npm run check
          npm run build
          npm test > test-output/view-controls/node.log 2>&1 || { tail -100 test-output/view-controls/node.log; exit 1; }
          tail -12 test-output/view-controls/node.log
          cd render-viewer
          npm ci --include=dev
          npm run build
      - name: Compare actual live source and preview capabilities without customer data writes
        run: python ops/.masar-ops/view-controls-20260909/verify-live.py
      - name: Install pinned browsers and independent GLB validator
        run: |
          python -m pip install playwright==1.62.0 pillow==11.3.0 > /tmp/masar-pip.log 2>&1 || { tail -80 /tmp/masar-pip.log; exit 1; }
          sudo mkdir -p /tmp/masar-unused-apt
          for f in /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources; do
            if test -f "$f"; then sudo mv "$f" /tmp/masar-unused-apt/; fi
          done
          python -m playwright install --with-deps chromium webkit > /tmp/masar-pw.log 2>&1 || { tail -100 /tmp/masar-pw.log; exit 1; }
          npm install --prefix /tmp/masar-gltf-validator --ignore-scripts --no-audit --no-fund gltf-validator@2.0.0-dev.3.10
      - name: Actual floor isolation perspective framing PNG GLB and retained product journeys
        working-directory: masar-studio
        env:
          MASAR_ACCEPTANCE_URL: https://masar-customer-preview.onrender.com
        run: |
          for engine in chromium webkit; do
            MASAR_BROWSER=$engine python tests/view_controls_browser.py
            MASAR_BROWSER=$engine python tests/material_downloads_browser.py
            MASAR_BROWSER=$engine python tests/room_review_browser.py
            MASAR_BROWSER=$engine python tests/plan_inspection_browser.py
            MASAR_BROWSER=$engine python tests/layout_quality_browser.py
            MASAR_BROWSER=$engine python tests/acceptance_chalet.py
          done
      - name: Independently validate complete GLB downloaded from isolated and all-floor views
        working-directory: masar-studio
        run: |
          node --input-type=module <<'JS'
          import validator from '/tmp/masar-gltf-validator/node_modules/gltf-validator/index.js';
          import {readFileSync,writeFileSync} from 'node:fs';
          for(const name of ['isolated-full-model.glb','all-floors-model.glb']){
            const path='test-output/view-controls/chromium/'+name;
            const result=await validator.validateBytes(new Uint8Array(readFileSync(path)),{maxIssues:10000});
            writeFileSync(path+'.validation.json',JSON.stringify(result,null,2));
            console.log(name,JSON.stringify(result.issues));
            if(result.issues.numErrors||result.issues.numWarnings)process.exit(1);
          }
          JS
      - name: Package immutable source and actual test outputs without fonts or server database
        run: python ops/.masar-ops/view-controls-20260909/package-live.py
      - name: Verify the actual delivered archive in a separate clean directory
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,json,hashlib
          output=Path('recheck');output.mkdir()
          with zipfile.ZipFile('delivery/MASAR-View-Controls-Source.zip') as z:
              assert z.testzip() is None
              for name in z.namelist():assert (output/name).resolve().is_relative_to(output.resolve())
              z.extractall(output)
          manifest=json.loads((output/'VIEW-CONTROLS-MANIFEST.json').read_text())
          for name,digest in manifest['sha256'].items():assert hashlib.sha256((output/name).read_bytes()).hexdigest()==digest,name
          print('Verified source files',len(manifest['sha256']))
          PY
          cd recheck/masar-studio
          npm ci --ignore-scripts
          npm run check
          npm run build
          cmp dist/index.html ../../delivery/MASAR-View-Controls-Standalone.html
          npm test > ../package-node.log 2>&1 || { tail -100 ../package-node.log; exit 1; }
          tail -12 ../package-node.log
          cd render-viewer
          npm ci --include=dev
          npm run build
          cd ..
          MASAR_BROWSER=chromium python tests/view_controls_browser.py
      - name: Derive final acceptance only from successful live and package reports
        run: python ops/.masar-ops/view-controls-20260909/finish-live.py
      - name: Preserve delivery and exact observations even on an assertion failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masar-view-controls-live
          path: |
            delivery/
            masar-studio/test-output/view-controls/
            masar-studio/test-output/material-downloads/*/report.json
            masar-studio/test-output/room-review/*/report.json
            masar-studio/test-output/plan-inspection/*/report.json
            masar-studio/test-output/layout-quality-ui/*/report.json
            masar-studio/test-output/customer-ui/*report.json
            recheck/package-node.log
            recheck/masar-studio/test-output/view-controls/chromium/report.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masar-view-controls-summary
          path: delivery/LIVE-SUMMARY.json
          if-no-files-found: error
          retention-days: 30
