name: MASAR repaired customer acceptance
on:
  push:
    branches: ['audit/masar-customer-journey-20260908']
    paths: ['.github/workflows/masar-customer-acceptance.yml', 'masar-studio/tests/acceptance_chalet.py']
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build and rerun all model and server assertions
        working-directory: masar-studio
        run: |
          npm ci --ignore-scripts && npm run check && npm run build
          mkdir -p test-output/customer-after
          npm test > test-output/customer-after/node.log 2>&1 || { tail -100 test-output/customer-after/node.log; exit 1; }
          tail -12 test-output/customer-after/node.log
          cat test-output/customer-after/summary.json
          cd render-viewer && npm ci --include=dev && npm run build
      - name: Install pinned browser and validator
        run: |
          python -m pip install playwright==1.62.0 ifcopenshell==0.8.5 pytest==8.4.2 > /tmp/pip.log 2>&1 || { tail -80 /tmp/pip.log; exit 1; }
          python -m playwright install --with-deps ${{ matrix.engine }} > /tmp/pw.log 2>&1 || { tail -80 /tmp/pw.log; exit 1; }
      - name: Exact long brief through the real mobile UI
        working-directory: masar-studio
        env:
          MASAR_BROWSER: ${{ matrix.engine }}
        run: python tests/acceptance_chalet.py
      - name: Independent IFC geometry check for the actual new customer plan
        if: matrix.engine == 'chromium'
        working-directory: masar-studio
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {exportIFC} from './shared/building.js';
          const model=JSON.parse(readFileSync('test-output/customer-after/model.json','utf8'));
          writeFileSync('test-output/customer-after/customer.ifc',exportIFC(model));
          JS
          python - <<'PY'
          import json,ifcopenshell,ifcopenshell.validate,ifcopenshell.geom
          from pathlib import Path
          f=ifcopenshell.open('test-output/customer-after/customer.ifc')
          logger=ifcopenshell.validate.json_logger();ifcopenshell.validate.validate(f,logger,express_rules=True)
          settings=ifcopenshell.geom.settings();shapes=0;failures=[]
          for obj in f.by_type('IfcProduct'):
              if not obj.Representation:continue
              try:
                  shape=ifcopenshell.geom.create_shape(settings,obj)
                  assert len(shape.geometry.verts)>0
                  shapes+=1
              except Exception as e:failures.append({'id':obj.id(),'type':obj.is_a(),'error':str(e)})
          report={'schema':f.schema,'schemaIssues':logger.statements,'geometryShapes':shapes,'geometryFailures':failures,'scope':'file schema/geometry only, not architectural/code approval'}
          Path('test-output/customer-after/customer-ifc-report.json').write_text(json.dumps(report,default=str,indent=2));print(json.dumps(report,default=str))
          assert shapes>0 and not logger.statements and not failures
          PY
      - name: Record exact tested revision
        if: always()
        run: git rev-parse HEAD > masar-studio/test-output/customer-after/source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: masar-customer-acceptance-${{ matrix.engine }}
          path: |
            masar-studio/test-output/customer-after/
            masar-studio/test-output/customer-ui/
          retention-days: 14
