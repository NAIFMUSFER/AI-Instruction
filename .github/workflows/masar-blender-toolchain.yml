name: MASAR Blender integration toolchain
on:
  push:
    branches: ['feature/masar-blender-20260908']
    paths: ['.github/workflows/masar-blender-toolchain.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Download exact Blender release and verify official SHA256 manifest
        run: |
          mkdir -p blender-tools
          cd blender-tools
          curl --fail --location --retry 2 -O https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz
          curl --fail --location --retry 2 -O https://download.blender.org/release/Blender4.5/blender-4.5.13.sha256
          grep 'blender-4.5.13-linux-x64.tar.xz$' blender-4.5.13.sha256 | sha256sum -c -
      - name: Compile a local-only Three.js dependency module
        run: |
          mkdir -p viewer-tools
          cd viewer-tools
          npm init -y >/dev/null
          npm install --save-exact three@0.180.0 esbuild@0.25.10
          printf "export * as THREE from 'three';\nexport {OrbitControls} from 'three/addons/controls/OrbitControls.js';\nexport {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';\n" > runtime-entry.mjs
          ./node_modules/.bin/esbuild runtime-entry.mjs --bundle --minify --format=esm --target=es2022 --legal-comments=eof --outfile=render-engine.js
          cp node_modules/three/LICENSE render-viewer-LICENSE.txt
          sha256sum render-engine.js > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masar-blender-4.5.13-toolchain
          path: blender-tools/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masar-three180-local-runtime
          path: |
            viewer-tools/render-engine.js
            viewer-tools/render-viewer-LICENSE.txt
            viewer-tools/package-lock.json
            viewer-tools/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
