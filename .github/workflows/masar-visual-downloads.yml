name: MASAR browser visual downloads
on:
  push:
    branches: ['audit/masar-customer-journey-20260908']
    paths: ['masar-studio/**', '.github/workflows/masar-visual-downloads.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: masar-visual-downloads-acceptance
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build committed source and run existing model server and security tests
        working-directory: masar-studio
        run: |
          mkdir -p test-output/material-downloads
          git rev-parse HEAD > test-output/material-downloads/tested-commit.txt
          node --check src/three-viewer.mjs
          npm ci --ignore-scripts
          npm run check
          npm run build
          npm test > test-output/material-downloads/node.log 2>&1 || { grep -A 40 '^not ok' test-output/material-downloads/node.log; tail -20 test-output/material-downloads/node.log; exit 1; }
          tail -12 test-output/material-downloads/node.log
          cd render-viewer
          npm ci --include=dev
          npm run build
      - name: Install pinned browsers without the unrelated system Chrome index
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          for p in Path('/etc/apt/sources.list.d').glob('*.list'):
              s=p.read_text()
              if 'dl.google.com/linux/chrome' in s:p.write_text('\n'.join('# Unused Chrome index: '+line if 'dl.google.com/linux/chrome' in line and not line.lstrip().startswith('#') else line for line in s.splitlines())+'\n')
          for p in Path('/etc/apt/sources.list.d').glob('*.sources'):
              s=p.read_text()
              if 'dl.google.com/linux/chrome' not in s:continue
              parts=[]
              for part in s.split('\n\n'):
                  if 'dl.google.com/linux/chrome' in part:part='\n'.join(line for line in part.splitlines() if not line.startswith('Enabled:'))+'\nEnabled: no'
                  parts.append(part)
              p.write_text('\n\n'.join(parts))
          PY
          python -m pip install playwright==1.62.0 pillow==11.3.0 ifcopenshell==0.8.5 pytest==8.4.2 >/tmp/masar-pip.log 2>&1 || { tail -80 /tmp/masar-pip.log; exit 1; }
          python -m playwright install --with-deps chromium firefox webkit >/tmp/masar-browsers.log 2>&1 || { tail -80 /tmp/masar-browsers.log; exit 1; }
          npm install --prefix /tmp/masar-gltf-validator --ignore-scripts --no-audit --no-fund gltf-validator@2.0.0-dev.3.10
      - name: Real browser output source identity geometry material and history checks
        working-directory: masar-studio
        run: |
          MASAR_BROWSER=chromium python tests/material_downloads_browser.py
          MASAR_BROWSER=webkit python tests/material_downloads_browser.py
      - name: Independently validate the actual GLB files with Khronos validator
        working-directory: masar-studio
        run: |
          node --input-type=module <<'JS'
          import{createRequire}from'node:module';import{readFileSync,writeFileSync,readdirSync}from'node:fs';
          const require=createRequire('/tmp/masar-gltf-validator/package.json'),validator=require('gltf-validator'),dir='test-output/material-downloads/chromium';
          const files=readdirSync(dir).filter(n=>n.endsWith('.glb'));if(files.length!==3)throw Error('Expected three actual downloads');
          for(const name of files){const r=await validator.validateBytes(new Uint8Array(readFileSync(dir+'/'+name)),{uri:name});writeFileSync(dir+'/'+name+'.validation.json',JSON.stringify(r,null,2));console.log(name,JSON.stringify({errors:r.issues.numErrors,warnings:r.issues.numWarnings,infos:r.issues.numInfos}));if(r.issues.numErrors)throw Error('Invalid GLB '+name);}
          JS
      - name: Import browser files in isolated Blender and measure every mesh
        working-directory: masar-studio
        run: |
          docker build -f render-worker/Dockerfile -t masar-blender-visual-test . >/tmp/masar-blender-build.log 2>&1 || { tail -100 /tmp/masar-blender-build.log; exit 1; }
          docker run --rm --network none --read-only --cpus 2 --memory 2g --pids-limit 256 --tmpfs /tmp:rw,size=512m --user "$(id -u):$(id -g)" -v "$PWD/tests/material_glb_blender.py:/verify.py:ro" -v "$PWD/test-output/material-downloads/chromium:/out:rw" masar-blender-visual-test --background --factory-startup --python-exit-code 1 --python /verify.py -- /out
          test -s test-output/material-downloads/chromium/blender-import-report.json
      - name: Preserve complete customer room inspection quality and legacy journeys
        working-directory: masar-studio
        run: |
          for engine in chromium webkit; do
            MASAR_BROWSER=$engine python tests/room_review_browser.py
            MASAR_BROWSER=$engine python tests/plan_inspection_browser.py
            MASAR_BROWSER=$engine python tests/layout_quality_browser.py
            MASAR_BROWSER=$engine python tests/visual_source_browser.py
            MASAR_BROWSER=$engine python tests/acceptance_chalet.py
          done
      - name: Existing three-browser offline standalone and IFC gates
        working-directory: masar-studio
        run: |
          for engine in chromium firefox webkit; do MASAR_BROWSER=$engine python tests/browser_http.py; done
          python tests/browser_flows.py
          node tests/ifc-fixtures.mjs
          python tests/ifc_external.py
      - name: Preserve actual results; this job never modifies source or deployment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masar-visual-downloads-ci
          path: |
            masar-studio/test-output/material-downloads/
            masar-studio/test-output/room-review/*/report.json
            masar-studio/test-output/plan-inspection/*/report.json
            masar-studio/test-output/layout-quality-ui/*/report.json
            masar-studio/test-output/visual-source/*/report.json
            masar-studio/test-output/customer-ui/*report.json
            masar-studio/test-output/browser-http-*/report.json
            masar-studio/test-output/ifc/independent-report.json
            masar-studio/docs/browser-tests.json
          retention-days: 14
          if-no-files-found: error
