name: MASAR browser visual downloads
on:
  push:
    branches: ['audit/masar-customer-journey-20260908']
    paths: ['.github/workflows/masar-visual-downloads.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: masar-visual-downloads-acceptance
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Apply candidate only to the inspected baseline
        run: |
          test "$GITHUB_REF" = 'refs/heads/audit/masar-customer-journey-20260908'
          python .masar-ops/material-downloads-20260909/apply.py
          python - <<'PY'
          from pathlib import Path
          p=Path('masar-studio/tests/material_downloads_browser.py');s=p.read_text()
          # Auto-scrolling a button changes its viewport y, not canvas dimensions.
          old="assert page.locator('#render-canvas').bounding_box()==box_before"
          new="assert all(page.locator('#render-canvas').bounding_box()[k]==box_before[k] for k in ['width','height'])"
          assert s.count(old)==1;p.write_text(s.replace(old,new));compile(p.read_text(),str(p),'exec')
          PY
      - name: Build and existing Node security model and server tests
        working-directory: masar-studio
        run: |
          npm ci --ignore-scripts && npm run check && npm run build
          npm test > test-output/material-downloads/node.log 2>&1 || { grep -A 40 '^not ok' test-output/material-downloads/node.log; tail -20 test-output/material-downloads/node.log; exit 1; }
          tail -12 test-output/material-downloads/node.log
          cd render-viewer && npm ci --include=dev && npm run build
      - name: Install pinned browsers and independent validators
        run: |
          python -m pip install playwright==1.62.0 pillow==11.3.0 ifcopenshell==0.8.5 pytest==8.4.2 > /tmp/masar-pip.log 2>&1 || { tail -80 /tmp/masar-pip.log; exit 1; }
          python -m playwright install --with-deps chromium firefox webkit > /tmp/masar-browsers.log 2>&1 || { tail -80 /tmp/masar-browsers.log; exit 1; }
          npm install --prefix /tmp/masar-gltf-validator --ignore-scripts --no-audit --no-fund gltf-validator@2.0.0-dev.3.10
      - name: Real browser output source identity geometry material and history checks
        working-directory: masar-studio
        run: |
          MASAR_BROWSER=chromium python tests/material_downloads_browser.py
          MASAR_BROWSER=webkit python tests/material_downloads_browser.py
      - name: Independently validate every exported GLB with Khronos validator
        working-directory: masar-studio
        run: |
          node --input-type=module <<'JS'
          import {createRequire} from 'node:module';import{readFileSync,writeFileSync,readdirSync}from'node:fs';
          const require=createRequire('/tmp/masar-gltf-validator/package.json'),validator=require('gltf-validator');
          const dir='test-output/material-downloads/chromium';
          for(const name of readdirSync(dir).filter(n=>n.endsWith('.glb'))){const r=await validator.validateBytes(new Uint8Array(readFileSync(dir+'/'+name)),{uri:name});writeFileSync(dir+'/'+name+'.validation.json',JSON.stringify(r,null,2));console.log(name,JSON.stringify(r.issues));if(r.issues.numErrors)throw Error('Invalid GLB '+name);}
          JS
      - name: Import the browser files in isolated Blender and measure every mesh
        working-directory: masar-studio
        run: |
          docker build -f render-worker/Dockerfile -t masar-blender-visual-test . > /tmp/masar-blender-build.log 2>&1 || { tail -100 /tmp/masar-blender-build.log; exit 1; }
          docker run --rm --network none --read-only --cpus 2 --memory 2g --pids-limit 256 --tmpfs /tmp:rw,size=512m --user "$(id -u):$(id -g)" -v "$PWD/tests/material_glb_blender.py:/verify.py:ro" -v "$PWD/test-output/material-downloads/chromium:/out:rw" masar-blender-visual-test --background --factory-startup --python /verify.py -- /out
      - name: Preserve complete customer room inspection quality and legacy journeys
        working-directory: masar-studio
        run: |
          for engine in chromium webkit; do
            MASAR_BROWSER=$engine python tests/room_review_browser.py
            MASAR_BROWSER=$engine python tests/plan_inspection_browser.py
            MASAR_BROWSER=$engine python tests/layout_quality_browser.py
            MASAR_BROWSER=$engine python tests/visual_source_browser.py
            MASAR_BROWSER=$engine python tests/acceptance_chalet.py
          done
      - name: Existing three-browser offline standalone and IFC gates
        working-directory: masar-studio
        run: |
          for engine in chromium firefox webkit; do MASAR_BROWSER=$engine python tests/browser_http.py; done
          python tests/browser_flows.py
          node tests/ifc-fixtures.mjs && python tests/ifc_external.py
      - name: Commit only verified runtime paths with a non-force push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add masar-studio/src/material-downloads.js masar-studio/src/render-ui.js masar-studio/src/three-viewer.mjs masar-studio/render-viewer/runtime-entry.mjs masar-studio/render-viewer/package-viewer.mjs masar-studio/tools/build.mjs masar-studio/public/sw.js masar-studio/tests/browser_http.py masar-studio/tests/material-downloads.test.mjs masar-studio/tests/material_downloads_browser.py masar-studio/tests/material_glb_blender.py
          git rm .masar-ops/material-downloads-20260909/apply.py .masar-ops/material-downloads-20260909/viewer-methods.txt .masar-ops/material-downloads-20260909/material-downloads.js .masar-ops/material-downloads-20260909/material-downloads.test.mjs .masar-ops/material-downloads-20260909/material_downloads_browser.py .masar-ops/material-downloads-20260909/material_glb_blender.py
          git diff --cached --check
          git commit -m 'feat(masar): download source-bound PNG and complete GLB locally without a cloud renderer'
          git push origin HEAD:audit/masar-customer-journey-20260908
          git rev-parse HEAD > masar-studio/test-output/material-downloads/runtime-commit.txt
      - name: Preserve actual results on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masar-visual-downloads-ci
          path: |
            masar-studio/test-output/material-downloads/
            masar-studio/test-output/room-review/*/report.json
            masar-studio/test-output/plan-inspection/*/report.json
            masar-studio/test-output/layout-quality-ui/*/report.json
            masar-studio/test-output/visual-source/*/report.json
            masar-studio/test-output/customer-ui/*report.json
            masar-studio/test-output/browser-http-*/report.json
            masar-studio/test-output/ifc/independent-report.json
            masar-studio/docs/browser-tests.json
          retention-days: 14
          if-no-files-found: error
