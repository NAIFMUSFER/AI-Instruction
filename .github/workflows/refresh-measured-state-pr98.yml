name: Refresh measured state PR98

on:
  push:
    branches:
      - feature/connected-semantic-locks-v2

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/connected-semantic-locks-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate measured bundle report and current-state block
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bundle_report.py
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools')
          import check_doc_claims as c

          path = Path(c.STATE_DOC)
          text = path.read_text(encoding='utf-8')
          have = c.state_block(text)
          if have is None:
              raise SystemExit('CURRENT-STATE block missing')
          want = c.render_state()
          path.write_text(text.replace(have, want), encoding='utf-8')
          PY
          git diff --check
      - name: Commit exact generated state if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- KNOWN-ISSUES.md tests/performance/bundle_report.json; then
            echo 'Measured state already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add KNOWN-ISSUES.md tests/performance/bundle_report.json
          git commit -m 'ACS: refresh measured frontend state for semantic locks'
          git push origin HEAD:feature/connected-semantic-locks-v2
