name: MASAR measured layout quality
on:
  push:
    branches: ['audit/masar-customer-journey-20260908']
    paths: ['masar-studio/**', '.github/workflows/masar-layout-quality-fix.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: masar-measured-layout-quality
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build and run every engine and server regression
        working-directory: masar-studio
        run: |
          mkdir -p test-output/layout-quality
          git rev-parse HEAD > test-output/layout-quality/tested-commit.txt
          npm ci --ignore-scripts && npm run check && npm run build
          npm test > test-output/layout-quality/node.log 2>&1 || { tail -120 test-output/layout-quality/node.log; exit 1; }
          tail -12 test-output/layout-quality/node.log
          cd render-viewer && npm ci --include=dev && npm run build
      - name: Install pinned real browsers and independent IFC validator
        run: |
          python -m pip install playwright==1.62.0 ifcopenshell==0.8.5 pytest==8.4.2 pillow==11.3.0 > /tmp/masar-pip.log 2>&1 || { tail -80 /tmp/masar-pip.log; exit 1; }
          python -m playwright install --with-deps chromium firefox webkit > /tmp/masar-browsers.log 2>&1 || { tail -80 /tmp/masar-browsers.log; exit 1; }
      - name: Optional design improvement through actual mobile UI with cancellation and undo
        working-directory: masar-studio
        run: |
          MASAR_BROWSER=chromium python tests/layout_quality_browser.py
          MASAR_BROWSER=webkit python tests/layout_quality_browser.py
      - name: Preserve original text acceptance, legacy recovery and all browser regressions
        working-directory: masar-studio
        run: |
          MASAR_BROWSER=chromium python tests/acceptance_chalet.py
          MASAR_BROWSER=webkit python tests/acceptance_chalet.py
          MASAR_BROWSER=chromium python tests/visual_source_browser.py
          MASAR_BROWSER=webkit python tests/visual_source_browser.py
          MASAR_BROWSER=chromium python tests/browser_http.py
          MASAR_BROWSER=firefox python tests/browser_http.py
          MASAR_BROWSER=webkit python tests/browser_http.py
          python tests/browser_flows.py
      - name: Independently validate the improved customer IFC and retain comparisons
        working-directory: masar-studio
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {current,importEnvelope} from './shared/model.js';
          import {reviewLayout} from './shared/layout-quality.js';
          import {exportIFC} from './shared/building.js';
          const before=current(importEnvelope(readFileSync('test-output/layout-quality-ui/chromium/before.json','utf8'))),after=current(importEnvelope(readFileSync('test-output/layout-quality-ui/chromium/after.json','utf8')));
          writeFileSync('test-output/layout-quality/improved.ifc',exportIFC(after));
          writeFileSync('test-output/layout-quality/comparison.json',JSON.stringify({before:reviewLayout(before),after:reviewLayout(after)},null,2));
          JS
          python - <<'PY'
          import json,ifcopenshell,ifcopenshell.validate,ifcopenshell.geom
          from pathlib import Path
          f=ifcopenshell.open('test-output/layout-quality/improved.ifc');logger=ifcopenshell.validate.json_logger();ifcopenshell.validate.validate(f,logger,express_rules=True)
          settings=ifcopenshell.geom.settings();shapes=0;failures=[]
          for obj in f.by_type('IfcProduct'):
              if not obj.Representation:continue
              try:
                  shape=ifcopenshell.geom.create_shape(settings,obj);assert len(shape.geometry.verts)>0;shapes+=1
              except Exception as e:failures.append({'id':obj.id(),'error':str(e)})
          report={'schema':f.schema,'schemaIssues':logger.statements,'geometryShapes':shapes,'geometryFailures':failures,'scope':'IFC file schema/geometry, not code or architectural approval'}
          Path('test-output/layout-quality/independent-ifc.json').write_text(json.dumps(report,default=str,indent=2));print(json.dumps(report,default=str));assert shapes>0 and not logger.statements and not failures
          PY
      - name: Preserve actual results even on failure; never commit or deploy from this job
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masar-layout-quality-evidence
          path: |
            masar-studio/test-output/layout-quality/
            masar-studio/test-output/layout-quality-ui/
            masar-studio/test-output/customer-ui/
            masar-studio/test-output/visual-source/
            masar-studio/test-output/browser-http-*/report.json
            masar-studio/docs/browser-tests.json
          retention-days: 14
          if-no-files-found: error
