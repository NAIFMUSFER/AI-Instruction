name: Plan-first session command contracts
on:
  pull_request:
    paths:
      - 'acs_plan_commands.py'
      - 'tests/remediation/test_plan_commands.py'
      - '.github/workflows/plan-session-commands.yml'
permissions:
  contents: read
concurrency:
  group: plan-session-commands-${{ github.ref }}
  cancel-in-progress: true
jobs:
  commands:
    name: Server-held Plan-first command boundary
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Authenticated-host command regressions (stdlib-only)
        run: |
          set -o pipefail
          mkdir -p logs
          python -S tests/remediation/test_plan_commands.py 2>&1 | tee logs/plan-commands.log
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plan-session-command-logs
          path: logs/
          retention-days: 7
