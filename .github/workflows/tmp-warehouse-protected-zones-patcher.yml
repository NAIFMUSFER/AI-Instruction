name: Temporary warehouse protected-zone patcher

on:
  push:
    branches:
      - acs-v2/warehouse-protected-zones-20260915

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acs-v2/warehouse-protected-zones-20260915
          fetch-depth: 0
      - name: Apply bounded warehouse protected-zone slice
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected exactly one marker, found {text.count(old)}")
              return text.replace(old, new, 1)

          score_path = Path('acs_plan_scorecard.py')
          score = score_path.read_text(encoding='utf-8')
          score = replace_once(
              score,
              '_INDUSTRIAL = {"warehouse", "industrial", "factory", "logistics", "مستودع"}\n',
              '_INDUSTRIAL = {"warehouse", "industrial", "factory", "logistics", "مستودع"}\n'
              '_PROTECTED_WAREHOUSE_ROLES = frozenset({"equipment", "mep", "fire_safety"})\n',
              'protected role constant')

          helper = r'''

def _measure_declared_protected_zones(model: dict) -> dict:
    """Measure intrusions into explicitly declared warehouse protected zones.

    Roles are intentionally narrow and literal: ``equipment``, ``mep`` and
    ``fire_safety``. Their presence is a customer/engineer declaration, not a
    regulatory requirement invented by ACS. Only room rectangles plus explicit
    rack/lane x/z/w/d geometry are measured. No clearance distance, equipment
    envelope, fire code, egress rule or safety-compliance claim is inferred.
    """
    floors = model.get("floors") if isinstance(model.get("floors"), dict) else {}
    levels = model.get("levels")
    if not isinstance(levels, list) or not levels:
        return {
            "status": "NOT_VERIFIED", "area_by_role_m2": None,
            "intrusion_area_by_role_m2": None, "intrusions": [],
            "reason": "Protected-zone review needs explicit level/template identities.",
        }

    seen_indices: set[int] = set()
    declared = False
    area_complete = True
    intrusion_complete = True
    area_by_role: defaultdict[str, float] = defaultdict(float)
    intrusion_by_role: defaultdict[str, float] = defaultdict(float)
    intrusions: list[dict] = []

    instances: list[tuple[int, str, list]] = []
    for level in levels:
        if (not isinstance(level, dict) or type(level.get("index")) is not int
                or level["index"] in seen_indices):
            return {
                "status": "NOT_VERIFIED", "area_by_role_m2": None,
                "intrusion_area_by_role_m2": None, "intrusions": [],
                "reason": "Protected-zone review needs unique integer level identities.",
            }
        seen_indices.add(level["index"])
        template = level.get("template")
        floor = floors.get(template) if isinstance(template, str) else None
        rooms = floor.get("rooms") if isinstance(floor, dict) else None
        if not isinstance(template, str) or not isinstance(rooms, list):
            return {
                "status": "NOT_VERIFIED", "area_by_role_m2": None,
                "intrusion_area_by_role_m2": None, "intrusions": [],
                "reason": "Protected-zone review needs inspectable canonical room collections.",
            }
        instances.append((level["index"], template, rooms))

    for level_index, template, rooms in instances:
        protected: list[tuple[str, str | None, tuple[float, float, float, float]]] = []
        for room in rooms:
            if not isinstance(room, dict):
                intrusion_complete = False
                continue
            role_raw = room.get("role")
            role = role_raw.strip().lower() if isinstance(role_raw, str) and role_raw.strip() else None
            if role not in _PROTECTED_WAREHOUSE_ROLES:
                continue
            declared = True
            rect = _rect_tuple(room.get("rect"))
            if rect is None:
                area_complete = False
                intrusion_complete = False
                continue
            protected.append((role, _element_id(room), rect))
            area_by_role[role] += rect[2] * rect[3]
            intrusion_by_role.setdefault(role, 0.0)

        if not protected:
            continue

        for protected_role, protected_id, protected_rect in protected:
            for room in rooms:
                if not isinstance(room, dict):
                    intrusion_complete = False
                    continue
                role_raw = room.get("role")
                room_role = role_raw.strip().lower() if isinstance(role_raw, str) and role_raw.strip() else None
                if room_role in _PROTECTED_WAREHOUSE_ROLES:
                    continue
                room_rect = _rect_tuple(room.get("rect"))
                if room_rect is None:
                    intrusion_complete = False
                    continue
                overlap = _rect_overlap_area(protected_rect, room_rect)
                if overlap > EPS:
                    intrusion_by_role[protected_role] += overlap
                    intrusions.append({
                        "level_index": level_index, "template": template,
                        "protected_role": protected_role,
                        "protected_room_id": protected_id,
                        "element_kind": "zone", "element_id": _element_id(room),
                        "overlap_area_m2": round(overlap, 6),
                    })

                owner_rect = room_rect
                raw_racks = room.get("racks")
                racks = [] if raw_racks is None else raw_racks
                if not isinstance(racks, list):
                    intrusion_complete = False
                else:
                    for rack in racks:
                        rack_rect = _rack_rect(rack)
                        site_rect = _site_rect(rack_rect, owner_rect)
                        if site_rect is None:
                            intrusion_complete = False
                            continue
                        rack_overlap = _rect_overlap_area(protected_rect, site_rect)
                        if rack_overlap > EPS:
                            element_id = _element_id(rack)
                            if element_id is None:
                                intrusion_complete = False
                                continue
                            intrusion_by_role[protected_role] += rack_overlap
                            intrusions.append({
                                "level_index": level_index, "template": template,
                                "protected_role": protected_role,
                                "protected_room_id": protected_id,
                                "element_kind": "rack", "element_id": element_id,
                                "overlap_area_m2": round(rack_overlap, 6),
                            })

                raw_lanes = room.get("lanes")
                lanes = [] if raw_lanes is None else raw_lanes
                if not isinstance(lanes, list):
                    intrusion_complete = False
                else:
                    for lane in lanes:
                        lane_rect = _lane_rect(lane)
                        site_rect = _site_rect(lane_rect, owner_rect)
                        if site_rect is None:
                            intrusion_complete = False
                            continue
                        lane_overlap = _rect_overlap_area(protected_rect, site_rect)
                        if lane_overlap > EPS:
                            element_id = _element_id(lane)
                            if element_id is None:
                                intrusion_complete = False
                                continue
                            kind = str(lane.get("kind") or "").strip().lower() if isinstance(lane, dict) else ""
                            intrusion_by_role[protected_role] += lane_overlap
                            intrusions.append({
                                "level_index": level_index, "template": template,
                                "protected_role": protected_role,
                                "protected_room_id": protected_id,
                                "element_kind": f"lane:{kind or 'unknown'}",
                                "element_id": element_id,
                                "overlap_area_m2": round(lane_overlap, 6),
                            })

    if not declared:
        return {
            "status": "NOT_APPLICABLE", "area_by_role_m2": {},
            "intrusion_area_by_role_m2": {}, "intrusions": [], "reason": None,
        }

    area_metric = ({key: round(value, 6) for key, value in sorted(area_by_role.items())}
                   if area_complete else None)
    intrusion_metric = (
        {key: round(value, 6) for key, value in sorted(intrusion_by_role.items())}
        if area_complete and intrusion_complete else None)
    if not area_complete or not intrusion_complete:
        status = "NOT_VERIFIED"
        reason = (
            "Protected-zone intrusion review needs finite protected/operational room rectangles "
            "and explicit auditable rack/lane x/z/w/d geometry where those collections are present.")
    elif any(value > EPS for value in intrusion_by_role.values()):
        status = "FAIL"
        reason = None
    else:
        status = "PASS"
        reason = None

    return {
        "status": status,
        "area_by_role_m2": area_metric,
        "intrusion_area_by_role_m2": intrusion_metric,
        "intrusions": sorted(
            intrusions,
            key=lambda row: (row["level_index"], row["protected_role"],
                             str(row.get("protected_room_id")), row["element_kind"],
                             str(row.get("element_id")), row["overlap_area_m2"])),
        "reason": reason,
    }
'''
          score = replace_once(score, '\ndef measure_plan(model: dict) -> dict:\n', helper + '\ndef measure_plan(model: dict) -> dict:\n', 'helper insertion')
          score = replace_once(
              score,
              '    if typology == "warehouse":\n        zone_ratios = (\n',
              '    if typology == "warehouse":\n        protected_zones = _measure_declared_protected_zones(model)\n        zone_ratios = (\n',
              'warehouse measurement call')
          score = replace_once(
              score,
              '            "unclassified_zone_area_m2": metrics["unclassified_space_area_m2"],\n',
              '            "unclassified_zone_area_m2": metrics["unclassified_space_area_m2"],\n'
              '            "declared_protected_zone_area_by_role_m2": protected_zones["area_by_role_m2"],\n'
              '            "declared_protected_zone_intrusion_area_by_role_m2": protected_zones["intrusion_area_by_role_m2"],\n',
              'warehouse protected metrics')
          score = replace_once(
              score,
              '        unavailable.update({\n            "storage_capacity_positions": (\n',
              '        checks["declared_protected_zone_intrusions"] = {\n'
              '            "status": protected_zones["status"],\n'
              '            "measurement_basis": "explicit_rectangles",\n'
              '            "canonical_roles": sorted(_PROTECTED_WAREHOUSE_ROLES),\n'
              '            "intrusions": protected_zones["intrusions"],\n'
              '            "claims_required_clearance": False,\n'
              '            "claims_regulatory_compliance": False,\n'
              '            "claims_safety_compliance": False,\n'
              '        }\n'
              '        unavailable.update({\n            "storage_capacity_positions": (\n',
              'warehouse protected check')
          score = replace_once(
              score,
              '        if not rack_height_complete or not rack_height_seen:\n',
              '        if protected_zones["area_by_role_m2"] is None:\n'
              '            unavailable["declared_protected_zone_area_by_role_m2"] = protected_zones["reason"]\n'
              '        if protected_zones["intrusion_area_by_role_m2"] is None:\n'
              '            unavailable["declared_protected_zone_intrusion_area_by_role_m2"] = protected_zones["reason"]\n'
              '        if not rack_height_complete or not rack_height_seen:\n',
              'warehouse protected unavailable')
          score_path.write_text(score, encoding='utf-8')

          options_path = Path('acs_plan_options.py')
          options = options_path.read_text(encoding='utf-8')
          options = replace_once(
              options,
              '    "zone_area_ratio_by_role",\n    "dock_count_by_edge",\n',
              '    "zone_area_ratio_by_role",\n'
              '    "declared_protected_zone_area_by_role_m2",\n'
              '    "declared_protected_zone_intrusion_area_by_role_m2",\n'
              '    "dock_count_by_edge",\n',
              'option protected metrics')
          options_path.write_text(options, encoding='utf-8')

          test = r'''#!/usr/bin/env python3
"""Warehouse protected-zone geometry regressions for ACS Design Pipeline v2.

The fixtures assert only explicit canonical geometry. `equipment`, `mep` and
`fire_safety` are literal engineer/customer-declared zone roles; these tests do not
invent required zones, clearances, code distances, egress rules or safety approval.
"""
from __future__ import annotations

import copy
from pathlib import Path
import sys
import unittest

sys.path.insert(0, str(Path(__file__).resolve().parents[2]))
import acs_plan_options as O
import acs_plan_scorecard as S


def model(*, equipment_x=40.0, malformed_protected=False, include_protected=True):
    rooms = [
        {"id": "receiving", "role": "receiving", "rect": [0.0, 0.0, 12.0, 10.0]},
        {
            "id": "storage", "role": "storage", "rect": [12.0, 0.0, 26.0, 30.0],
            "racks": [{"id": "rack_a", "kind": "pallet", "x": 2.0, "z": 2.0,
                       "w": 8.0, "d": 18.0, "dir": "z", "rows": 2,
                       "bay": 2.0, "levels": 4, "h": 7.0}],
            "lanes": [{"id": "forklift_main", "kind": "forklift", "x": 12.0,
                       "z": 2.0, "w": 3.0, "d": 20.0, "dir": "z"}],
        },
        {"id": "shipping", "role": "shipping", "rect": [48.0, 0.0, 12.0, 10.0]},
    ]
    if include_protected:
        rooms.extend([
            {"id": "equipment_zone", "role": "equipment",
             "rect": None if malformed_protected else [equipment_x, 0.0, 6.0, 6.0]},
            {"id": "mep_zone", "role": "mep", "rect": [40.0, 8.0, 6.0, 6.0]},
            {"id": "fire_reserve", "role": "fire_safety", "rect": [40.0, 16.0, 6.0, 6.0]},
        ])
    return {
        "meta": {"type": "warehouse", "name": "protected-zones"},
        "site": {"w": 60.0, "d": 40.0},
        "levels": [{"index": 0, "template": "ground"}],
        "floors": {"ground": {"rooms": rooms}},
    }


class WarehouseProtectedZoneTests(unittest.TestCase):
    def test_explicit_protected_zones_pass_when_operational_geometry_stays_out(self):
        result = S.measure_plan(model())
        metrics = result["metrics"]
        self.assertEqual(metrics["declared_protected_zone_area_by_role_m2"], {
            "equipment": 36.0, "fire_safety": 36.0, "mep": 36.0,
        })
        self.assertEqual(metrics["declared_protected_zone_intrusion_area_by_role_m2"], {
            "equipment": 0.0, "fire_safety": 0.0, "mep": 0.0,
        })
        check = result["checks"]["declared_protected_zone_intrusions"]
        self.assertEqual(check["status"], "PASS")
        self.assertEqual(check["intrusions"], [])
        self.assertFalse(check["claims_required_clearance"])
        self.assertFalse(check["claims_regulatory_compliance"])
        self.assertFalse(check["claims_safety_compliance"])
        self.assertIsNone(metrics["fire_life_safety_compliance"])

    def test_overlap_with_operational_zone_is_measured_as_conflict_not_compliance(self):
        result = S.measure_plan(model(equipment_x=34.0))
        check = result["checks"]["declared_protected_zone_intrusions"]
        self.assertEqual(check["status"], "FAIL")
        self.assertGreater(
            result["metrics"]["declared_protected_zone_intrusion_area_by_role_m2"]["equipment"],
            0.0)
        self.assertTrue(any(row["protected_role"] == "equipment"
                            and row["element_kind"] == "zone" for row in check["intrusions"]))
        self.assertFalse(result["claims_regulatory_compliance"])

    def test_missing_protected_geometry_fails_intrusion_review_closed(self):
        result = S.measure_plan(model(malformed_protected=True))
        self.assertEqual(result["checks"]["declared_protected_zone_intrusions"]["status"],
                         "NOT_VERIFIED")
        self.assertIsNone(result["metrics"]["declared_protected_zone_area_by_role_m2"])
        self.assertIsNone(result["metrics"]["declared_protected_zone_intrusion_area_by_role_m2"])
        self.assertIn("declared_protected_zone_intrusion_area_by_role_m2", result["unavailable"])

    def test_absent_protected_roles_are_not_applicable_not_implicitly_required(self):
        result = S.measure_plan(model(include_protected=False))
        self.assertEqual(result["metrics"]["declared_protected_zone_area_by_role_m2"], {})
        self.assertEqual(result["metrics"]["declared_protected_zone_intrusion_area_by_role_m2"], {})
        self.assertEqual(result["checks"]["declared_protected_zone_intrusions"]["status"],
                         "NOT_APPLICABLE")

    def test_options_compare_measured_protected_zone_intrusions_without_ranking(self):
        safe = model(equipment_x=40.0)
        conflicted = model(equipment_x=34.0)
        comparison = O.compare_options([
            {"id": "A", "model": safe},
            {"id": "B", "model": conflicted},
        ], declared_program_receipt="program:warehouse:protected-zones")
        delta = comparison["options"][1]["delta_from_reference"]
        self.assertEqual(delta["mapping"]["declared_protected_zone_area_by_role_m2"]["equipment"], 0.0)
        self.assertGreater(delta["mapping"]["declared_protected_zone_intrusion_area_by_role_m2"]["equipment"], 0.0)
        self.assertFalse(comparison["claims_best_option"])
        self.assertFalse(comparison["claims_regulatory_compliance"])

    def test_residential_models_do_not_receive_warehouse_protected_zone_metrics(self):
        residential = model()
        residential["meta"]["type"] = "residential"
        result = S.measure_plan(residential)
        self.assertNotIn("declared_protected_zone_area_by_role_m2", result["metrics"])
        self.assertNotIn("declared_protected_zone_intrusions", result["checks"])

    def test_measurement_is_read_only(self):
        canonical = model()
        before = copy.deepcopy(canonical)
        S.measure_plan(canonical)
        self.assertEqual(canonical, before)


if __name__ == "__main__":
    unittest.main(verbosity=2)
'''
          Path('tests/remediation/test_plan_warehouse_protected_zones.py').write_text(test, encoding='utf-8')

