name: Apply residential v2 branch transform

on:
  push:
    branches: [feature/residential-v2-save-revisions]
    paths:
      - tools/diagnose_design_markers.py
      - tools/transform_design_versions.py
      - tools/transform_design_versions_tests.py
      - tools/transform_residential_quality_v2.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/residential-v2-save-revisions
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose source markers
        run: python tools/diagnose_design_markers.py
      - name: Apply deterministic transforms
        run: |
          python tools/transform_design_versions.py
          python tools/transform_design_versions_tests.py
          python tools/transform_residential_quality_v2.py
      - name: Static syntax and focused regressions
        run: |
          python -m py_compile acs_understand.py
          node --check public/app/trust/wiring.js
          node --check public/app/ui/workspace-ui-wiring.js
          python tests/remediation/test_residential_quality.py
          node tests/remediation/test_persistence.js
          git diff --check
      - name: Commit transformed product files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add acs_understand.py public/index.html public/app/trust/wiring.js public/app/ui/workspace-ui-wiring.js tests/remediation/test_residential_quality.py tests/remediation/test_persistence.js
          if git diff --cached --quiet; then
            echo 'No transformed changes to commit.'
            exit 0
          fi
          git commit -m 'Improve residential plan quality and add saved design versions'
          git push origin HEAD:feature/residential-v2-save-revisions
