name: Warehouse rendered canonical identity
on:
  pull_request:
    paths:
      - 'public/app/render/warehouse-canonical-identity.js'
      - 'tests/remediation/test_warehouse_render_identity.mjs'
      - '.github/workflows/warehouse-render-identity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: warehouse-render-identity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    name: Stable warehouse sub-element identity
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Explicit-id, reorder, provenance and no-mutation regressions
        run: |
          set -euo pipefail
          mkdir -p logs
          node tests/remediation/test_warehouse_render_identity.mjs 2>&1 | tee logs/warehouse-render-identity.log
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: warehouse-render-identity-evidence
          path: logs/
          retention-days: 7
