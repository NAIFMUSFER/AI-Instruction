name: Apply and verify native OpenAI integration

on:
  push:
    branches: ['feature/openai-provider']
    paths:
      - '.github/workflows/apply-openai-provider.yml'
      - 'tools/apply_openai_provider.py'
      - 'acs_openai.py'
      - 'tests/remediation/test_openai_provider.py'

permissions:
  contents: write

concurrency:
  group: apply-openai-provider
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[openai-wired]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the project's pinned Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Apply exact guarded wiring
        run: python tools/apply_openai_provider.py
      - name: Verify native transport and existing provider contracts
        run: |
          set -euo pipefail
          mkdir -p logs
          python -m py_compile acs_openai.py acs_provider.py acs_understand.py
          bash tools/ci_run.sh --log logs/openai-provider.log --label 'OpenAI and provider regressions' --runner python3 \
            tests/remediation/test_openai_provider.py \
            tests/remediation/test_generation_spatial_context.py \
            tests/remediation/test_multi_provider.py \
            tests/remediation/test_provider_integration.py \
            tests/remediation/test_thinking_wire.py \
            tests/remediation/test_provider_accounting.py \
            tests/remediation/test_provider_capability.py \
            tests/remediation/test_plan_chunking.py \
            tests/phase9_2/test_generation_budget.py
          git diff --check
      - name: Commit only validated product files
        run: |
          set -euo pipefail
          git rm tools/apply_openai_provider.py
          git add acs_openai.py acs_provider.py acs_understand.py Dockerfile tests/remediation/test_generation_spatial_context.py
          git config user.name 'NAIFMUSFER'
          git config user.email 'whili9070@gmail.com'
          git commit -m 'Wire verified native OpenAI provider and isolated fallback [openai-wired]'
          git push origin HEAD:feature/openai-provider
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openai-provider-focused-logs
          path: logs/
          if-no-files-found: warn
