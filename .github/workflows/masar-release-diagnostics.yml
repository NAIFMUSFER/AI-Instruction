name: MASAR release diagnostics
on:
  push:
    branches: ['masar/production-v4']
    paths: ['.github/workflows/masar-release-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, chromium]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4e394b97806cf6b060b5707fb71fd340f86b46d4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Preserve exact diagnostic input source
        if: matrix.engine == 'chromium'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masar-diagnostic-input-4e394b9
          path: masar-studio/
          include-hidden-files: true
          retention-days: 7
      - name: Install pinned browser quietly
        run: |
          python -m pip install playwright==1.55.0 > /tmp/masar-pip.log 2>&1 || { cat /tmp/masar-pip.log; exit 1; }
          python -m playwright install --with-deps ${{ matrix.engine }} > /tmp/masar-browser-install.log 2>&1 || { tail -100 /tmp/masar-browser-install.log; exit 1; }
          cd masar-studio && npm ci --ignore-scripts && npm run build
      - name: Add observation only to temporary test checkout
        if: matrix.engine == 'webkit'
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('masar-studio/tests/browser_http.py')
          text=p.read_text()
          text=text.replace('results=[];errors=[];requests_failed=[]','results=[];errors=[];requests_failed=[];console_records=[];responses=[]')
          old='    page.locator(\'#scene[data-ready="true"]\').wait_for(state=\'attached\',timeout=20000)'
          new='''    try:
                  page.locator('#scene[data-ready="true"]').wait_for(state='attached',timeout=20000)
              except Exception:
                  diagnostic={'engine':ENGINE,'url':page.url,'console':console_records[-60:],'failedRequests':requests_failed[-60:],'responses':responses[-80:]}
                  try:
                      diagnostic['dom']=page.evaluate("""async()=>({title:document.title,body:document.body.innerText.slice(0,2500),readyState:document.readyState,scene:document.querySelector('#scene')?.outerHTML,system:document.querySelector('#system-status')?.textContent,controller:navigator.serviceWorker.controller?.scriptURL,scripts:[...document.scripts].map(s=>({src:s.src,type:s.type})),caches:await Promise.all((await caches.keys()).map(async n=>({name:n,entries:await Promise.all((await(await caches.open(n)).keys()).map(async q=>{const r=await caches.match(q);return{url:q.url,responseUrl:r.url,status:r.status,headers:[...r.headers],length:(await r.text()).length}}))})))})""")
                      page.screenshot(path=str(OUT/'offline-failure.png'),full_page=True)
                  except Exception as e:
                      diagnostic['captureError']=str(e)
                  (OUT/'offline-diagnostic.json').write_text(json.dumps(diagnostic,ensure_ascii=False,indent=2))
                  print('OFFLINE_DIAGNOSTIC '+json.dumps(diagnostic,ensure_ascii=False),flush=True)
                  raise'''
          assert text.count(old)==1
          text=text.replace(old,new)
          old="            def observe(p):p.on('pageerror',lambda e:errors.append(str(e)))"
          new="""            def observe(p):
                          p.on('pageerror',lambda e:errors.append(str(e)))
                          p.on('console',lambda m:console_records.append({'type':m.type,'text':m.text}))
                          p.on('requestfailed',lambda r:requests_failed.append({'url':r.url,'type':r.resource_type,'failure':r.failure}))
                          p.on('response',lambda r:responses.append({'url':r.url,'status':r.status,'fromSW':r.from_service_worker}))"""
          assert text.count(old)==1
          p.write_text(text.replace(old,new))
          compile(p.read_text(),str(p),'exec')
          PY
      - name: Reproduce original WebKit HTTP suite with observations
        if: matrix.engine == 'webkit'
        working-directory: masar-studio
        env:
          MASAR_BROWSER: webkit
        run: python tests/browser_http.py
      - name: Reproduce original standalone initialization three times
        if: matrix.engine == 'chromium'
        working-directory: masar-studio
        run: |
          python - <<'PY'
          import subprocess,shutil
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print('system chromium:',shutil.which('chromium'),'playwright chromium:',p.chromium.executable_path,flush=True)
          failures=0
          for attempt in range(3):
              print('STANDALONE_ATTEMPT',attempt+1,flush=True)
              failures+=subprocess.run(['python','tests/browser_flows.py']).returncode!=0
          raise SystemExit(1 if failures else 0)
          PY
      - name: Preserve diagnosis artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masar-diagnostic-${{ matrix.engine }}
          path: |
            masar-studio/test-output/browser-http-*/
            masar-studio/docs/browser-tests.json
          retention-days: 7
