name: MASAR release diagnostics
on:
  push:
    branches: ['masar/production-v4']
    paths: ['.github/workflows/masar-release-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            playwright: '1.55.0'
          - os: macos-15
            playwright: '1.55.0'
          - os: ubuntu-latest
            playwright: '1.56.1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4e394b97806cf6b060b5707fb71fd340f86b46d4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install exact browser environment
        run: |
          python -m pip install playwright==${{ matrix.playwright }} > /tmp/masar-pip.log 2>&1 || { cat /tmp/masar-pip.log; exit 1; }
          python -m playwright install --with-deps webkit > /tmp/masar-browser-install.log 2>&1 || { tail -100 /tmp/masar-browser-install.log; exit 1; }
          cd masar-studio && npm ci --ignore-scripts && npm run build
      - name: Insert independent native storage preflight in disposable profile
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          probe="""async () => {
              const name = 'native-cache-diagnostic';
              const cache = await caches.open(name);
              const results = [];
              for (const [kind, response] of [
                  ['synthetic', new Response('native-cache-probe', {headers: {'Content-Type': 'text/plain'}})],
                  ['network', await fetch('/src/style.css')]
              ]) {
                  const key = '/native-probe-' + kind;
                  await cache.put(key, response);
                  const same = await cache.match(key);
                  const reopened = await (await caches.open(name)).match(key);
                  results.push({kind, same: !!same, reopened: !!reopened, keys: (await cache.keys()).map(r => r.url)});
              }
              await caches.delete(name);
              const shell = [];
              for (const cacheName of await caches.keys()) {
                  shell.push({name: cacheName, keys: (await (await caches.open(cacheName)).keys()).map(r => r.url)});
              }
              return {results, estimate: await navigator.storage.estimate(), shell};
          }"""
          subprocess.run(['node','--check'],input=probe,text=True,check=True)
          p=Path('masar-studio/tests/browser_http.py');s=p.read_text()
          old="            observe(page);page.goto(base,wait_until='networkidle');ready(page)"
          new=old+"\n            page.evaluate('navigator.serviceWorker.ready');page.wait_for_function('navigator.serviceWorker.controller!==null')\n            native=page.evaluate("+repr(probe)+")\n            (OUT/'native-cache-preflight.json').write_text(json.dumps(native,indent=2));print('NATIVE_CACHE_PREFLIGHT '+json.dumps(native),flush=True)"
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s);compile(s,str(p),'exec')
          PY
      - name: Run original full-stack assertions without application changes
        working-directory: masar-studio
        env:
          MASAR_BROWSER: webkit
        run: python tests/browser_http.py
      - name: Preserve native-storage and app evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masar-native-cache-${{ matrix.os }}-${{ matrix.playwright }}
          path: masar-studio/test-output/browser-http-webkit/
          retention-days: 7
