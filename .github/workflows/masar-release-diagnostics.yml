name: MASAR release diagnostics
on:
  push:
    branches: ['masar/production-v4']
    paths: ['.github/workflows/masar-release-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        playwright: ['1.55.0', '1.62.0']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4e394b97806cf6b060b5707fb71fd340f86b46d4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install exact browser environment
        run: |
          python -m pip install playwright==${{ matrix.playwright }} > /tmp/masar-pip.log 2>&1 || { cat /tmp/masar-pip.log; exit 1; }
          python -m playwright install --with-deps webkit > /tmp/masar-browser-install.log 2>&1 || { tail -100 /tmp/masar-browser-install.log; exit 1; }
          cd masar-studio && npm ci --ignore-scripts && npm run build
      - name: Compare native storage and unchanged application on loopback origins
        working-directory: masar-studio
        env:
          MASAR_BROWSER: webkit
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, shutil, json
          probe="""async () => {
              const name = 'native-cache-diagnostic';
              const cache = await caches.open(name), results = [];
              for (const kind of ['relative', 'absolute', 'request', 'network']) {
                  const path = '/native-probe-' + kind, absolute = new URL(path, location.origin).href;
                  const key = kind === 'relative' ? path : kind === 'request' ? new Request(absolute) : absolute;
                  const response = kind === 'network' ? await fetch('/src/style.css') : new Response('native-cache-probe');
                  try {
                      await cache.put(key, response);
                      const same = await cache.match(key), reopened = await (await caches.open(name)).match(key);
                      results.push({kind, same: !!same, reopened: !!reopened, keys: (await cache.keys()).map(r => r.url)});
                  } catch (error) { results.push({kind, error: String(error)}); }
              }
              await caches.delete(name);
              const shell = [];
              for (const cacheName of await caches.keys()) shell.push({name: cacheName, keys: (await (await caches.open(cacheName)).keys()).map(r => r.url)});
              return {results, secureContext: globalThis.isSecureContext, origin: location.origin, shell};
          }"""
          subprocess.run(['node','--check'],input=probe,text=True,check=True)
          p=Path('tests/browser_http.py');original=p.read_text()
          old="            observe(page);page.goto(base,wait_until='networkidle');ready(page)"
          new=old+"\n            page.evaluate('navigator.serviceWorker.ready')\n            native=page.evaluate("+repr(probe)+")\n            (OUT/'native-cache-preflight.json').write_text(json.dumps(native,indent=2));print('NATIVE_CACHE_PREFLIGHT '+json.dumps(native),flush=True)"
          assert original.count(old)==1
          observed=original.replace(old,new)
          summaries=[]
          for host in ['127.0.0.1','localhost']:
              s=observed.replace("base=f'http://127.0.0.1:{port}'","base=f'http://"+host+":{port}'")
              compile(s,str(p),'exec');p.write_text(s)
              print('LOOPBACK_CASE',host,flush=True)
              result=subprocess.run(['python','tests/browser_http.py'])
              src=Path('test-output/browser-http-webkit');dest=Path('test-output/native-cache-evidence')/host
              shutil.copytree(src,dest,dirs_exist_ok=True)
              summaries.append({'host':host,'exitCode':result.returncode})
          p.write_text(original)
          print('NATIVE_MATRIX_SUMMARY '+json.dumps(summaries),flush=True)
          raise SystemExit(1 if any(r['exitCode'] for r in summaries) else 0)
          PY
      - name: Preserve native-storage and app evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masar-native-cache-${{ matrix.playwright }}
          path: masar-studio/test-output/native-cache-evidence/
          retention-days: 7
