name: MASAR apply verified release fixes
on:
  push:
    branches: ['masar/production-v4']
    paths: ['.github/workflows/masar-release-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: masar/production-v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
