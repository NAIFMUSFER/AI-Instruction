name: MASAR release diagnostics
on:
  push:
    branches: ['masar/production-v4']
    paths: ['.github/workflows/masar-release-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, await-write]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4e394b97806cf6b060b5707fb71fd340f86b46d4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned WebKit quietly
        run: |
          python -m pip install playwright==1.55.0 > /tmp/masar-pip.log 2>&1 || { cat /tmp/masar-pip.log; exit 1; }
          python -m playwright install --with-deps webkit > /tmp/masar-browser-install.log 2>&1 || { tail -100 /tmp/masar-browser-install.log; exit 1; }
          cd masar-studio && npm ci --ignore-scripts && npm run build
      - name: Observe real cache writes and evaluate ordered-write candidate in temporary checkout
        env:
          MASAR_VARIANT: ${{ matrix.variant }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          root=Path('masar-studio')
          sw=root/'public/sw.js'
          s=sw.read_text()
          intro="""const writes=[];
          self.addEventListener('message',e=>{if(e.data!=='MASAR_CACHE_DIAG')return;e.waitUntil((async()=>{const names=await caches.keys();const stores=await Promise.all(names.map(async name=>({name,urls:(await(await caches.open(name)).keys()).map(r=>new URL(r.url).pathname)})));e.ports[0].postMessage({writes,stores});})());});
          """
          s=intro+s
          needle=".then(c=>c.put(key,copy))"
          replacement=".then(async c=>{try{await c.put(key,copy);writes.push({key,status:'stored'});}catch(err){writes.push({key,status:'failed',error:String(err)});throw err;}})"
          assert s.count(needle)==1
          s=s.replace(needle,replacement)
          if os.environ['MASAR_VARIANT']=='await-write':
              old="fetch(e.request).then(r=>{if(r.ok){const copy=r.clone();e.waitUntil(caches.open(CACHE).then(async c=>{try{await c.put(key,copy);writes.push({key,status:'stored'});}catch(err){writes.push({key,status:'failed',error:String(err)});throw err;}}));}return r;})"
              new="fetch(e.request).then(async r=>{if(r.ok){const copy=r.clone();try{const c=await caches.open(CACHE);await c.put(key,copy);writes.push({key,status:'stored'});}catch(err){writes.push({key,status:'failed',error:String(err)});}}return r;})"
              assert s.count(old)==1
              s=s.replace(old,new)
          sw.write_text(s)
          p=root/'tests/browser_http.py'
          s=p.read_text()
          fn='''def cache_checkpoint(label):
              try:
                  p=globals().get('page')
                  if p is None or p.is_closed():return
                  d=p.evaluate("""async()=>({body:document.body.innerText.slice(0,180),stores:await Promise.all((await caches.keys()).map(async name=>({name,urls:(await(await caches.open(name)).keys()).map(r=>new URL(r.url).pathname)}))),worker:await new Promise(resolve=>{if(!navigator.serviceWorker.controller)return resolve(null);const c=new MessageChannel();const timer=setTimeout(()=>resolve('worker diagnostic timed out'),2000);c.port1.onmessage=e=>{clearTimeout(timer);c.port1.close();resolve(e.data);};navigator.serviceWorker.controller.postMessage('MASAR_CACHE_DIAG',[c.port2]);})})""")
                  with open(OUT/'cache-checkpoints.jsonl','a') as f:f.write(json.dumps({'label':label,**d},ensure_ascii=False)+'\\n')
                  print('CACHE_CHECKPOINT '+json.dumps({'label':label,**d},ensure_ascii=False),flush=True)
              except Exception as e:print('CACHE_CAPTURE_ERROR',str(e),flush=True)
          '''
          s=s.replace('def assert_true',fn+'def assert_true',1)
          s=s.replace('    finally:print(json.dumps(results[-1],ensure_ascii=False),flush=True)',"    finally:\n        cache_checkpoint(name)\n        print(json.dumps(results[-1],ensure_ascii=False),flush=True)",1)
          p.write_text(s)
          compile(s,str(p),'exec')
          PY
      - name: Run unchanged HTTP assertions with real cache observations
        working-directory: masar-studio
        env:
          MASAR_BROWSER: webkit
        run: python tests/browser_http.py
      - name: Preserve cache lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masar-cache-${{ matrix.variant }}
          path: masar-studio/test-output/browser-http-webkit/
          retention-days: 7
