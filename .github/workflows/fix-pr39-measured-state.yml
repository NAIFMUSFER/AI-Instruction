name: PR39 regenerate measured source state

on:
  push:
    branches:
      - feature/workspace-viewport-selection-v2

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/workspace-viewport-selection-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          npm ci
          python -m pip install -r requirements.txt -r requirements-dev.txt
          npx playwright install --with-deps chromium
      - name: Regenerate measured state with repository tools
        run: |
          python3 tools/bundle_report.py
          python3 tools/check_doc_claims.py --fix
          python3 tools/check_doc_claims.py
          git diff --check
      - name: Commit generated state and remove this one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-pr39-measured-state.yml
          git add KNOWN-ISSUES.md tests/performance/bundle_report.json
          if git diff --cached --quiet; then
            echo 'No generated changes remain.'
            exit 0
          fi
          git commit -m 'docs(ci): regenerate measured source state after identity guard'
          git push origin HEAD:feature/workspace-viewport-selection-v2
