name: Plan-first explicit element provenance
on:
  pull_request:
    paths:
      - 'acs_plan_projection.py'
      - 'tests/remediation/test_plan_element_provenance.py'
      - '.github/workflows/plan-element-provenance.yml'
permissions:
  contents: read
concurrency:
  group: plan-element-provenance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile provenance contracts
        run: python -m py_compile acs_plan_projection.py tests/remediation/test_plan_element_provenance.py
      - name: Explicit nested-element provenance regressions
        env:
          ACS_ENV: test
          ANTHROPIC_API_KEY: dummy
        run: python -S tests/remediation/test_plan_element_provenance.py
      - name: No generated diff
        run: git diff --exit-code
