name: MASAR PNG aspect regression repair
on:
  push:
    branches: ['audit/masar-customer-journey-20260908']
    paths: ['.github/workflows/masar-png-frame-fix.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: masar-png-frame-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build original renderer and install the guarded reproducer only
        run: |
          test "$GITHUB_REF" = 'refs/heads/audit/masar-customer-journey-20260908'
          python .masar-ops/png-framing-20260909/apply.py test
          cd masar-studio
          npm ci --ignore-scripts
          npm run check
          npm run build
          cd render-viewer
          npm ci --include=dev
          npm run build
      - name: Install exact browsers and independent IFC validator
        run: |
          python -m pip install playwright==1.62.0 pillow==11.3.0 ifcopenshell==0.8.5 pytest==8.4.2 >/tmp/masar-pip.log 2>&1 || { tail -80 /tmp/masar-pip.log; exit 1; }
          sudo mkdir -p /tmp/masar-unused-apt
          for f in /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources; do
            if test -f "$f"; then sudo mv "$f" /tmp/masar-unused-apt/; fi
          done
          python -m playwright install --with-deps chromium firefox webkit >/tmp/masar-pw.log 2>&1 || { tail -100 /tmp/masar-pw.log; exit 1; }
      - name: Require the unmodified renderer to reproduce this exact PNG framing failure
        working-directory: masar-studio
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,os,json,shutil
          result=subprocess.run(['python','tests/view_controls_browser.py'],env={**os.environ,'MASAR_BROWSER':'chromium'})
          report=json.loads(Path('test-output/view-controls/chromium/report.json').read_text())
          assert result.returncode!=0 and report['failed']==1,report
          assert any('wide-camera PNG crops the fitted visible scene' in row.get('error','') for row in report['checks']),report
          shutil.copytree('test-output/view-controls','test-output/png-framing-baseline')
          print('Confirmed actual PNG cropping before applying a renderer change')
          PY
      - name: Apply the guarded aspect-preserving correction and rebuild
        run: |
          python .masar-ops/png-framing-20260909/apply.py runtime
          cd masar-studio
          npm run check
          npm run build
          mkdir -p test-output/view-controls
          npm test > test-output/view-controls/node.log 2>&1 || { tail -100 test-output/view-controls/node.log; exit 1; }
          tail -12 test-output/view-controls/node.log
          cd render-viewer
          npm run build
      - name: Require the same framing reproducer and all current user journeys to pass
        working-directory: masar-studio
        run: |
          for engine in chromium webkit; do
            MASAR_BROWSER=$engine python tests/view_controls_browser.py
            MASAR_BROWSER=$engine python tests/material_downloads_browser.py
            MASAR_BROWSER=$engine python tests/room_review_browser.py
            MASAR_BROWSER=$engine python tests/plan_inspection_browser.py
            MASAR_BROWSER=$engine python tests/layout_quality_browser.py
            MASAR_BROWSER=$engine python tests/visual_source_browser.py
            MASAR_BROWSER=$engine python tests/acceptance_chalet.py
          done
      - name: Existing accounts offline standalone and IFC regression gates
        working-directory: masar-studio
        run: |
          for engine in chromium firefox webkit; do MASAR_BROWSER=$engine python tests/browser_http.py; done
          python tests/browser_flows.py
          node tests/ifc-fixtures.mjs
          python tests/ifc_external.py
      - name: Commit only the verified correction without force or deployment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add masar-studio/src/three-viewer.mjs masar-studio/public/sw.js masar-studio/tests/view_controls_browser.py
          git rm .masar-ops/png-framing-20260909/apply.py
          git diff --cached --check
          git commit -m 'fix(masar): preserve visible camera framing in fixed-size PNG exports'
          git push origin HEAD:audit/masar-customer-journey-20260908
          git rev-parse HEAD > masar-studio/test-output/view-controls/runtime-commit.txt
      - name: Preserve both the reproduced defect and corrected acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masar-png-framing-repair
          path: |
            masar-studio/test-output/png-framing-baseline/
            masar-studio/test-output/view-controls/
            masar-studio/test-output/material-downloads/*/report.json
            masar-studio/test-output/room-review/*/report.json
            masar-studio/test-output/plan-inspection/*/report.json
            masar-studio/test-output/layout-quality-ui/*/report.json
            masar-studio/test-output/visual-source/*/report.json
            masar-studio/test-output/customer-ui/*report.json
            masar-studio/test-output/browser-http-*/report.json
            masar-studio/test-output/ifc/independent-report.json
            masar-studio/docs/browser-tests.json
          if-no-files-found: error
          retention-days: 14
