name: Refresh measured documentation claims for PR160
on:
  push:
    branches: [acs-v2/warehouse-program-feasibility-20260915]
    paths: [.github/workflows/refresh-doc-claims-160.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acs-v2/warehouse-program-feasibility-20260915
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - name: Install Chromium exactly as the required CI documentation gate does
        run: npx playwright install --with-deps chromium
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python3 tools/bundle_report.py
      - name: Regenerate measured claims
        run: python3 tools/check_doc_claims.py --fix
      - name: Verify measured claims with real Chromium available
        run: python3 tools/check_doc_claims.py
      - name: Commit measured documentation only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add KNOWN-ISSUES.md tests/performance/bundle_report.json
          if git diff --cached --quiet; then echo 'No measured doc drift remains'; exit 0; fi
          git commit -m 'docs: refresh measured current-state claims'
          git push origin HEAD:acs-v2/warehouse-program-feasibility-20260915
