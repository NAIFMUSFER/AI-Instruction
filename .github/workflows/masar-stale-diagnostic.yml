name: MASAR stale-preview layout diagnosis
on:
  push:
    branches: ['audit/masar-customer-journey-20260908']
    paths: ['.github/workflows/masar-stale-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: dbf31a752143e09464603a6f95d6c877a0562c0c
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Recover exact pending patch and preserve inspectable source
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,zlib,hashlib,subprocess,zipfile
          parts=sorted(Path('.masar-ops/visual-source-20260909').glob('part-*'));assert len(parts)==3
          patch=zlib.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts)))
          assert hashlib.sha256(patch).hexdigest()=='d18cabe312d2a688cdbacb92528a47e97bef925cfa6ec63afb0766d4792a5a10'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          out=Path('stale-diagnostic');out.mkdir()
          (out/'pending.patch').write_bytes(patch)
          with zipfile.ZipFile(out/'candidate-source.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(Path('masar-studio').rglob('*')):
                  if not path.is_file() or any(p in path.parts for p in ['node_modules','__pycache__','test-output','data']):continue
                  if path.suffix.lower() in ['.ttf','.otf','.woff','.woff2','.sqlite','.db','.pyc']:continue
                  archive.write(path,str(path))
          p=Path('masar-studio/tests/visual_source_browser.py');text=p.read_text()
          old="assert page.locator('#modal').evaluate('e=>e.scrollWidth<=e.clientWidth+1')"
          probe="""() => { const modal=document.querySelector('#modal'), r=modal.getBoundingClientRect(); return {viewport:innerWidth,modal:{width:r.width,left:r.left,right:r.right,scroll:modal.scrollWidth,client:modal.clientWidth},elements:[...modal.querySelectorAll('*')].filter(e=>{const b=e.getBoundingClientRect();return b.width&&b.height&&(b.left<r.left-1||b.right>r.right+1||e.scrollWidth>e.clientWidth+1)}).map(e=>{const b=e.getBoundingClientRect(),c=getComputedStyle(e);return {tag:e.tagName,id:e.id,class:e.className,text:e.textContent.slice(0,100),left:b.left,right:b.right,width:b.width,client:e.clientWidth,scroll:e.scrollWidth,display:c.display,minWidth:c.minWidth,overflow:c.overflowX,whiteSpace:c.whiteSpace}})}}"""
          assert text.count(old)==1
          new="layout=page.evaluate("+repr(probe)+");print('LAYOUT_EVIDENCE '+json.dumps(layout,ensure_ascii=False),flush=True);(OUT/(ENGINE+'-layout-'+str(layout['viewport'])+'.json')).write_text(json.dumps(layout,ensure_ascii=False,indent=2));page.screenshot(path=str(OUT/(ENGINE+'-layout-'+str(layout['viewport'])+'.png')),full_page=True);"+old
          p.write_text(text.replace(old,new));compile(p.read_text(),str(p),'exec')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masar-stale-pending-source
          path: stale-diagnostic/
          retention-days: 7
      - name: Build known candidate and install WebKit
        run: |
          cd masar-studio && npm ci --ignore-scripts && npm run check && npm run build
          cd render-viewer && npm ci --include=dev && npm run build
          python -m pip install playwright==1.62.0 pillow==11.3.0 >/tmp/masar-pip.log 2>&1 || { tail -60 /tmp/masar-pip.log; exit 1; }
          python -m playwright install --with-deps webkit >/tmp/masar-pw.log 2>&1 || { tail -60 /tmp/masar-pw.log; exit 1; }
      - name: Reproduce exact failure with layout observations only
        working-directory: masar-studio
        env:
          MASAR_BROWSER: webkit
        run: python tests/visual_source_browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: masar-stale-webkit-diagnosis
          path: masar-studio/test-output/visual-source/
          retention-days: 7
