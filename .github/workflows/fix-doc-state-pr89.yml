name: PR89 regenerate measured documentation state

on:
  push:
    branches:
      - release/production-supabase-auth-ui
    paths:
      - '.github/workflows/fix-doc-state-pr89.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/production-supabase-auth-ui
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Regenerate measured bundle report and documentation state
        run: |
          python3 tools/bundle_report.py
          python3 tools/check_doc_claims.py --fix
      - name: Commit generated measurements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/performance/bundle_report.json KNOWN-ISSUES.md
          if git diff --cached --quiet; then
            echo 'No generated drift remains.'
            exit 0
          fi
          git commit -m 'ACS auth: regenerate measured documentation state'
          git push origin HEAD:release/production-supabase-auth-ui
