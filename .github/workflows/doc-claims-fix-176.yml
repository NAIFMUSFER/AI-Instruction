name: Fix measured doc claims for PR176
on:
  push:
    branches: [acs-v2/typology-isolation-20260916-fix]
    paths: [tools/doc-claims-fix-176.trigger]
permissions: {contents: write}
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: acs-v2/typology-isolation-20260916-fix, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture the exact pre-stamp measurement used by CI
        run: |
          python3 tools/bundle_report.py
          cp tests/performance/bundle_report.json /tmp/bundle_report.pre-stamp.json
      - name: Match CI build/provenance stamping order exactly
        run: bash tools/netlify-build.sh
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Refresh measured documentation
        run: python3 tools/check_doc_claims.py --fix
      - name: Restore the canonical pre-stamp measurement after measurement suites mutate it
        run: cp /tmp/bundle_report.pre-stamp.json tests/performance/bundle_report.json
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add KNOWN-ISSUES.md tests/performance/bundle_report.json
          git diff --cached --quiet && { echo 'nothing to update'; exit 0; }
          git commit -m 'docs: align measured current-state claims with CI pre-stamp state'
          git push origin HEAD:acs-v2/typology-isolation-20260916-fix
