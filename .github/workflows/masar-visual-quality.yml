name: MASAR visual quality candidate
on:
  push:
    branches:
      - audit/masar-customer-journey-20260908
    paths:
      - .github/workflows/masar-visual-quality.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
      - name: Apply presentation candidate
        run: python .masar-ops/visual-quality-20260909/apply.py
      - name: Verify application
        working-directory: masar-studio
        run: |
          npm ci --ignore-scripts
          npm run check
          npm run build
          npm test
          cd render-viewer
          npm ci --include=dev
          npm run build
      - name: Commit verified runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add masar-studio/shared/render-scene.js masar-studio/src/three-viewer.mjs masar-studio/tests/visual-materials.test.mjs
          git diff --cached --check
          git commit -m "feat(masar): enrich architectural materials lighting and pool presentation"
          git push origin HEAD:audit/masar-customer-journey-20260908
