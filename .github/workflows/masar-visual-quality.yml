name: MASAR visual quality acceptance
on:
  push:
    branches:
      - audit/masar-customer-journey-20260908
    paths:
      - .github/workflows/masar-visual-quality.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build and run all Node regressions
        working-directory: masar-studio
        run: |
          npm ci --ignore-scripts
          npm run check
          npm run build
          npm test
          cd render-viewer
          npm ci --include=dev
          npm run build
      - name: Install pinned browser test tools
        run: |
          python -m pip install playwright==1.62.0 pillow==11.3.0
          python -m playwright install chromium webkit
      - name: Verify material downloads floor controls and exact chalet journey
        working-directory: masar-studio
        run: |
          python tests/material_downloads_browser.py
          python tests/view_controls_browser.py
          python tests/acceptance_chalet.py
