name: ACS engineering opening geometry
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acs-audit-engineering-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engineering-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ACS_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pinned compiler dependency
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Geometry, corpus silence and regulatory boundary
        run: |
          set -euo pipefail
          python tests/remediation/test_audit_engineering_openings.py
          python tests/remediation/test_audit_engineering_openings.py --mutations
          python tests/remediation/test_validate_topology.py
          python tests/remediation/test_validate_against_real_models.py
          python tests/remediation/test_rule_source_boundary.py
          python tests/remediation/test_audit_engineering_door_meshes.py
          python tests/remediation/test_audit_engineering_door_meshes.py --mutations
          python tests/remediation/test_audit_engineering_vertical_coverage.py
          python tests/remediation/test_audit_engineering_vertical_coverage.py --mutations
          python tests/remediation/test_plan_review.py
          python tests/remediation/test_plan_bridge.py
          python tests/remediation/test_plan_bridge_integration.py
      - name: Working tree remains clean
        run: git diff --exit-code
