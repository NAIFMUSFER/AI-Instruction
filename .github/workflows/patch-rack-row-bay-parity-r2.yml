name: Wire approved warehouse rack row/bay parity guard r2
on:
  push:
    branches: [acs-v2/warehouse-rack-row-bay-parity]
    paths: [.github/workflows/patch-rack-row-bay-parity-r2.yml]
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: acs-v2/warehouse-rack-row-bay-parity, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Apply deterministic rack parity guard and focused regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/acs_plan_handoff.py')
          s=p.read_text(encoding='utf-8')
          marker='''                if rack["w"] > room_w or rack["d"] > room_d:\n                    raise PlanError(\n                        "DOWNSTREAM_GEOMETRY_INVALID",\n                        f"Approved rack extent would be clamped by the 3D compiler at {where}",\n                    )\n'''
          assert s.count(marker)==1
          guard='''                if rack["w"] > room_w or rack["d"] > room_d:\n                    raise PlanError(\n                        "DOWNSTREAM_GEOMETRY_INVALID",\n                        f"Approved rack extent would be clamped by the 3D compiler at {where}",\n                    )\n                # Mirror the renderer's explicit rack placement limits so an\n                # approved Frozen Baseline can never render fewer rows/bays.\n                run = rack["w"] if rack["dir"] == "x" else rack["d"]\n                across = rack["d"] if rack["dir"] == "x" else rack["w"]\n                row_pitch = rack["depth"] + rack["aisle"]\n                last_row_origin = (rows - 1) * row_pitch\n                if last_row_origin > across - 0.05:\n                    raise PlanError(\n                        "DOWNSTREAM_GEOMETRY_INVALID",\n                        f"Approved rack rows would be truncated by the 3D compiler at {where}",\n                    )\n                derived_bays = math.floor(run / rack["bay"])\n                if not 1 <= derived_bays <= 60:\n                    raise PlanError(\n                        "DOWNSTREAM_GEOMETRY_INVALID",\n                        f"Approved rack bay geometry would be clamped by the 3D compiler at {where}",\n                    )\n'''
          s=s.replace(marker,guard,1)
          p.write_text(s,encoding='utf-8')

          t=Path('tests/remediation/test_plan_handoff_warehouse_rack_geometry.py')
          q=t.read_text(encoding='utf-8')
          marker2='''    def test_compiler_clamping_is_not_allowed_for_approved_racks(self):\n        cases = (("levels", 12), ("rows", 45), ("w", 25.0), ("d", 25.0))\n        for key, value in cases:\n            with self.subTest(key=key):\n                model = warehouse_model()\n                model["floors"]["ground"]["rooms"][0]["racks"][0][key] = value\n                self.assertFailsBeforeCompiler(model, expected="DOWNSTREAM_GEOMETRY_INVALID")\n'''
          assert q.count(marker2)==1
          addition=marker2+'''\n    def test_renderer_row_break_and_derived_bay_clamp_are_rejected(self):\n        model = warehouse_model()\n        model["floors"]["ground"]["rooms"][0]["racks"][0]["rows"] = 3\n        self.assertFailsBeforeCompiler(model, expected="DOWNSTREAM_GEOMETRY_INVALID")\n        for bay in (20.0, 0.2):\n            with self.subTest(bay=bay):\n                model = warehouse_model()\n                model["floors"]["ground"]["rooms"][0]["racks"][0]["bay"] = bay\n                self.assertFailsBeforeCompiler(model, expected="DOWNSTREAM_GEOMETRY_INVALID")\n'''
          q=q.replace(marker2,addition,1)
          t.write_text(q,encoding='utf-8')
          PY
          python3 -m py_compile tools/acs_plan_handoff.py
          PYTHONPATH=. python3 tests/remediation/test_plan_handoff_warehouse_rack_geometry.py
      - name: Commit product change
        shell: bash
        run: |
          git config user.name 'NAIFMUSFER'
          git config user.email 'whili9070@gmail.com'
          git add tools/acs_plan_handoff.py tests/remediation/test_plan_handoff_warehouse_rack_geometry.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix(acs-v2): block approved rack row and bay truncation'
          git push origin HEAD:acs-v2/warehouse-rack-row-bay-parity
