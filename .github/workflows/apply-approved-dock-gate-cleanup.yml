name: Apply approved dock gate cleanup
on:
  push:
    branches: [audit/warehouse-approved-dock-geometry-v2]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/warehouse-approved-dock-geometry-v2
          fetch-depth: 0
      - name: Normalize the regression gate without changing product scope
        run: |
          python - <<'PYTHON'
          from pathlib import Path

          wrapper = Path('tests/remediation/test_plan_handoff.py')
          core = Path('tests/remediation/test_plan_handoff_core.py')
          dedicated = Path('tests/remediation/test_plan_handoff_warehouse_dock_geometry.py')
          assert core.exists() and dedicated.exists()
          text = core.read_text(encoding='utf-8')
          marker = '\n\nif __name__ == "__main__":\n'
          assert text.count(marker) == 1
          import_line = '\n\nfrom test_plan_handoff_warehouse_dock_geometry import ApprovedWarehouseDockGeometryTests\n'
          wrapper.write_text(text.replace(marker, import_line + marker, 1), encoding='utf-8')
          core.unlink()

          handoff = Path('tools/acs_plan_handoff.py')
          text = handoff.read_text(encoding='utf-8')
          bad = "room.get(chr(39) + 'id' + chr(39))"
          assert text.count(bad) == 2
          text = text.replace(bad, "room.get('id')")
          text = text.replace('chr(44).join(missing)', "','.join(missing)")
          handoff.write_text(text, encoding='utf-8')

          fixture = Path('tests/remediation/test_plan_source_span_artifacts.py')
          text = fixture.read_text(encoding='utf-8')
          old = '"width": 3.6, "height": 4.2,\n                         "requirement_ids": ["dock-anchor"]}'
          new = '"width": 3.6, "height": 4.2, "count": 1, "pitch": 5.4,\n                         "requirement_ids": ["dock-anchor"]}'
          assert text.count(old) == 1
          fixture.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('.github/workflows/apply-approved-dock-gate-cleanup.yml').unlink()
          PYTHON
      - name: Verify the repaired boundary and provenance fixture
        env:
          ACS_ENV: test
          ANTHROPIC_API_KEY: dummy
        run: |
          python -m py_compile tools/acs_plan_handoff.py tests/remediation/test_plan_handoff.py tests/remediation/test_plan_handoff_warehouse_dock_geometry.py tests/remediation/test_plan_source_span_artifacts.py
          python -S tests/remediation/test_plan_handoff_warehouse_dock_geometry.py
          python -S tests/remediation/test_plan_source_span_artifacts.py
      - name: Commit verified cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: gate explicit approved dock geometry in existing handoff suite'
          git push origin HEAD:audit/warehouse-approved-dock-geometry-v2
