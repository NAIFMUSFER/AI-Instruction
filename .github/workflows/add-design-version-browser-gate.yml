name: Add permanent design-version browser gate

on:
  push:
    branches:
      - audit/live-async-smoke-20260911

permissions:
  contents: write

jobs:
  add-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/residential-v2-save-revisions
          fetch-depth: 0
      - name: Add real IndexedDB reload regression to the existing Chromium gate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a66871a217b53179062928bba04aa7f259c14893"
          cat > tests/remediation/test_design_versions_browser.js <<'NODE'
          /* Real-browser regression for explicit design versions.
             Scope: Chromium + production CSP + genuine IndexedDB across reloads.
             This does not claim physical-iPhone storage durability or quota behavior. */
          const fs=require('fs'), path=require('path'), http=require('http');
          const ROOT=path.resolve(__dirname,'..','..'), PUB=path.join(ROOT,'public');
          const PW=require(path.join(ROOT,'tools','pw_chromium.js'));
          const MIME={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8',
            '.mjs':'text/javascript; charset=utf-8','.css':'text/css; charset=utf-8',
            '.json':'application/json','.png':'image/png','.svg':'image/svg+xml'};

          function productionCSP(){
            const text=fs.readFileSync(path.join(ROOT,'netlify.toml'),'utf8');
            const m=/Content-Security-Policy\s*=\s*"([^"]+)"/.exec(text);
            if(!m) throw new Error('production CSP not found in netlify.toml');
            return m[1];
          }
          function serve(){
            const csp=productionCSP();
            return new Promise(resolve=>{
              const srv=http.createServer((rq,rs)=>{
                const u=decodeURIComponent(rq.url.split('?')[0]);
                const p=path.normalize(path.join(PUB,u==='/'?'index.html':u));
                if(!p.startsWith(PUB)||!fs.existsSync(p)||fs.statSync(p).isDirectory()){
                  rs.writeHead(404); rs.end(); return;
                }
                rs.writeHead(200,{'Content-Type':MIME[path.extname(p)]||'application/octet-stream',
                  'X-Content-Type-Options':'nosniff','Content-Security-Policy':csp});
                fs.createReadStream(p).pipe(rs);
              });
              srv.listen(0,'127.0.0.1',()=>resolve(srv));
            });
          }
          function assert(cond,msg){ if(!cond) throw new Error(msg); }

          (async()=>{
            const srv=await serve();
            let browser=null;
            try{
              browser=await PW.launch();
              const ctx=await browser.newContext();
              const pg=await ctx.newPage();
              const pageErrors=[];
              pg.on('pageerror',e=>pageErrors.push(String(e.message||e)));
              await pg.addInitScript(()=>{
                window.__DV_CSP=[];
                document.addEventListener('securitypolicyviolation',e=>
                  window.__DV_CSP.push(e.violatedDirective+' '+(e.blockedURI||'')));
              });
              const url='http://127.0.0.1:'+srv.address().port+'/index.html';
              await pg.goto(url,{waitUntil:'load',timeout:90000});
              await pg.waitForFunction(()=>window.ACS&&window.ACS.trustReady===true
                &&window.ACS.designVersions&&typeof window.ACS.setModel==='function'
                &&typeof window.ACS.exportModel==='function',{timeout:30000});

              const fixtures=JSON.parse(fs.readFileSync(path.join(ROOT,
                'tests/phase3/fixtures/base_fixtures.json'),'utf8'));
              const model=fixtures.villa_glazed||fixtures.villa;
              assert(model,'villa fixture absent');
              await pg.evaluate(m=>window.ACS.setModel(m),model);

              let rows=await pg.evaluate(()=>window.ACS.designVersions.list());
              assert(rows.length===0,'fresh context must begin with no explicit versions');
              const saved=await pg.evaluate(()=>window.ACS.designVersions.save());
              assert(saved&&saved.ok&&saved.label==='V1','V1 save failed: '+JSON.stringify(saved));
              rows=await pg.evaluate(()=>window.ACS.designVersions.list());
              assert(rows.length===1&&rows[0].record_id===saved.record_id,
                'saved version is not immediately readable');

              await pg.waitForTimeout(3000); // allow AUTOSAVE to run; it must not prune explicit versions
              await pg.reload({waitUntil:'load',timeout:90000});
              await pg.waitForFunction(()=>window.ACS&&window.ACS.trustReady===true
                &&window.ACS.designVersions,{timeout:30000});
              rows=await pg.evaluate(()=>window.ACS.designVersions.list());
              assert(rows.length===1&&rows[0].version_label==='V1',
                'V1 did not survive a genuine browser reload');

              const restored=await pg.evaluate(id=>window.ACS.designVersions.restore(id),saved.record_id);
              assert(restored&&restored.ok,'restore failed: '+JSON.stringify(restored));
              const restoredModel=await pg.evaluate(()=>window.ACS.exportModel());
              assert(JSON.stringify(restoredModel)===JSON.stringify(model),
                'restored model differs from saved model');

              const accepted=await pg.evaluate(id=>window.ACS.designVersions.accept(id),saved.record_id);
              assert(accepted&&accepted.ok,'accept failed');
              await pg.reload({waitUntil:'load',timeout:90000});
              await pg.waitForFunction(()=>window.ACS&&window.ACS.designVersions,{timeout:30000});
              rows=await pg.evaluate(()=>window.ACS.designVersions.list());
              assert(rows.length===1&&rows[0].accepted===true,
                'accepted marker did not survive reload');

              const removed=await pg.evaluate(id=>window.ACS.designVersions.remove(id),saved.record_id);
              assert(removed&&removed.ok,'delete failed');
              rows=await pg.evaluate(()=>window.ACS.designVersions.list());
              assert(rows.length===0,'explicit version store not empty after delete');
              const csp=await pg.evaluate(()=>window.__DV_CSP||[]);
              assert(csp.length===0,'CSP violation(s): '+JSON.stringify(csp));
              assert(pageErrors.length===0,'page error(s): '+pageErrors.join(' | '));
              console.log('DESIGN VERSION BROWSER: 10 passed, 0 failed');
              console.log('Scope: real Chromium + production CSP + IndexedDB reload; physical iPhone NOT VERIFIED.');
            } finally {
              if(browser) await browser.close();
              await new Promise(r=>srv.close(r));
            }
          })().catch(e=>{ console.error(e.stack||e); process.exit(1); });
          NODE

          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/ci.yml')
          s=p.read_text()
          old='''                   tests/remediation/test_accessibility.js \\\n                   tests/remediation/csp_browser_probe.js || rc=1'''
          new='''                   tests/remediation/test_accessibility.js \\\n                   tests/remediation/test_design_versions_browser.js \\\n                   tests/remediation/csp_browser_probe.js || rc=1'''
          if old not in s:
              raise SystemExit('CI insertion marker missing')
          if s.count(old)!=1:
              raise SystemExit('CI insertion marker not unique')
          p.write_text(s.replace(old,new,1))
          PY
          node --check tests/remediation/test_design_versions_browser.js
          git diff --check
      - name: Commit and push to PR19 branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/remediation/test_design_versions_browser.js .github/workflows/ci.yml
          git commit -m "test: keep design-version reload durability in Chromium CI"
          git push origin HEAD:feature/residential-v2-save-revisions
