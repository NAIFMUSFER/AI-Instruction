name: Wire residential quality regressions

on:
  push:
    branches: ['fix/residential-quality-pass']

permissions:
  contents: write

jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, '[residential-quality-wired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/residential-quality-pass
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Add companion gates to an existing mandatory CI target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/remediation/test_generation_spatial_context.py')
          text = path.read_text(encoding='utf-8')
          anchor = '\n\nif __name__ == "__main__":\n    unittest.main(verbosity=2)\n'
          if text.count(anchor) != 1:
              raise SystemExit('mandatory test entry anchor drifted')
          block = r'''

class ResidentialQualityCompanionGates(unittest.TestCase):
    """Keep the residential fix inside a CI target that is already mandatory."""

    def _run(self, cmd):
        import subprocess
        root = Path(__file__).resolve().parents[2]
        proc = subprocess.run(cmd, cwd=root, capture_output=True, text=True,
                              timeout=60)
        self.assertEqual(proc.returncode, 0,
                         (proc.stdout or '') + '\n' + (proc.stderr or ''))

    def test_residential_massing_contract_remains_green(self):
        self._run([sys.executable,
                   'tests/remediation/test_residential_quality.py'])

    def test_residential_presentation_contract_remains_green(self):
        self._run(['node',
                   'tests/remediation/test_residential_presentation.js'])
'''
          path.write_text(text.replace(anchor, block + anchor), encoding='utf-8')
          PY

      - name: Prove the mandatory target runs both companions
        run: python3 tests/remediation/test_generation_spatial_context.py

      - name: Commit only the non-workflow CI gate
        run: |
          git add tests/remediation/test_generation_spatial_context.py
          git config user.name 'NAIFMUSFER'
          git config user.email 'whili9070@gmail.com'
          git commit -m 'Gate residential quality through spatial CI [residential-quality-wired]'
          git push origin HEAD:fix/residential-quality-pass
