name: Plan-first frozen-baseline CAD export
on:
  pull_request:
    paths:
      - 'tools/acs_plan_cad_export.py'
      - 'acs_plan_projection.py'
      - 'acs_plan_lock_binding.py'
      - 'tests/remediation/test_plan_cad_export.py'
      - 'tests/remediation/test_plan_projection.py'
      - '.github/workflows/plan-approved-cad-export.yml'
permissions:
  contents: read
concurrency:
  group: plan-approved-cad-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile approval-bound CAD exporter
        run: python -m py_compile tools/acs_plan_cad_export.py tests/remediation/test_plan_cad_export.py
      - name: Install existing locks and optional CAD test dependency
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install --only-binary=:all: ezdxf==1.4.4 pyparsing==3.3.2 fonttools==4.65.0
          python -m pip check
      - name: Frozen-baseline CAD and projection regressions
        env:
          ACS_ENV: test
          ANTHROPIC_API_KEY: dummy
        run: |
          python tests/remediation/test_plan_cad_export.py
          python tests/remediation/test_plan_projection.py
      - name: No generated diff
        run: git diff --exit-code
