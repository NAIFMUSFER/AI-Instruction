name: Temporary ACS built clean-source bundle refresh
on:
  push:
    branches:
      - feature/async-exact-comparison-v2
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          bash tools/netlify-build.sh
          git checkout -- public/app/boot/build-info.js
          python3 tools/bundle_report.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/performance/bundle_report.json
          if ! git diff --cached --quiet; then
            git commit -m "docs(acs): refresh built clean-source bundle measurement"
            git push origin HEAD:feature/async-exact-comparison-v2
          fi
