name: PR178 exact pre-stamp doc claims repair
on:
  push:
    branches: [acs-v2/brief-thousands-area-questions-20260916]
    paths: [.github/workflows/pr178-doc-claims-exact-fix.yml]
permissions: {contents: write}
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: acs-v2/brief-thousands-area-questions-20260916, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Repair stale stamped-build measurements to exact source measurements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            'tests/performance/bundle_report.json': {
              '"boot_bytes": 52468': '"boot_bytes": 52460',
              '"bytes": 5437,\n        "path": "public/app/boot/build-info.js"': '"bytes": 5429,\n        "path": "public/app/boot/build-info.js"',
              '"gzip_bytes": 2388,\n        "loaded": "boot-classic",\n        "path": "public/app/boot/build-info.js"': '"gzip_bytes": 2336,\n        "loaded": "boot-classic",\n        "path": "public/app/boot/build-info.js"',
              '"first_party_total_bytes": 2127369': '"first_party_total_bytes": 2127361',
              '"initial_javascript_bytes": 1661500': '"initial_javascript_bytes": 1661492',
              'application JavaScript (2127369 bytes)': 'application JavaScript (2127361 bytes)',
            },
            'KNOWN-ISSUES.md': {
              '**2,127,369 B in 41 modules**': '**2,127,361 B in 41 modules**',
              '**1,661,500 B**': '**1,661,492 B**',
            },
          }
          for name, reps in replacements.items():
              p = Path(name); text = p.read_text()
              for old, new in reps.items():
                  if old not in text:
                      raise SystemExit(f'missing expected stale value in {name}: {old}')
                  text = text.replace(old, new)
              p.write_text(text)
          PY
      - name: Verify exact measurements against current source
        run: |
          python3 tools/bundle_report.py
          git diff --exit-code tests/performance/bundle_report.json
          python3 tools/check_doc_claims.py
      - name: Commit repaired generated measurements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add KNOWN-ISSUES.md tests/performance/bundle_report.json
          git diff --cached --quiet && exit 0
          git commit -m 'docs: align PR178 measurements with unstamped source'
          git push origin HEAD:acs-v2/brief-thousands-area-questions-20260916
