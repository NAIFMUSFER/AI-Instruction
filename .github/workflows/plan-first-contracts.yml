name: Plan-first foundation contracts
on:
  push:
    branches: [feature/plan-first-pipeline-v2]
  pull_request:
    paths:
      - 'acs_plan_review.py'
      - 'acs_plan_bridge.py'
      - 'acs_plan_projection.py'
      - 'tests/remediation/test_plan_review.py'
      - 'tests/remediation/test_plan_bridge*.py'
      - 'tests/remediation/test_plan_projection.py'
      - '.github/workflows/plan-first-contracts.yml'
permissions:
  contents: read
concurrency:
  group: plan-first-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install existing locks and optional CAD test dependency
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install --only-binary=:all: ezdxf==1.4.4
          python -m pip check
      - name: Revision, approval, CAD and real-validator contracts
        env:
          ACS_ENV: test
          ANTHROPIC_API_KEY: dummy
        run: |
          mkdir -p logs
          python -m py_compile acs_plan_review.py acs_plan_bridge.py acs_plan_projection.py
          set -o pipefail
          python tests/remediation/test_plan_review.py 2>&1 | tee logs/plan-review.log
          python tests/remediation/test_plan_bridge.py 2>&1 | tee logs/plan-bridge.log
          python tests/remediation/test_plan_projection.py 2>&1 | tee logs/plan-cad.log
          python tests/remediation/test_plan_bridge_integration.py 2>&1 | tee logs/plan-real-validator.log
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plan-first-contract-logs
          path: logs/
          retention-days: 7
