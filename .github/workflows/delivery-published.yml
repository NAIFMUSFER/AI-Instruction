# Public, free post-deployment acceptance. This is not a paid/private journey
# and is not a required branch check unless repository administration sets it.
name: Published delivery verification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/delivery-published.yml'
      - 'tests/production/**'
      - 'tests/deploy/verify_public_guest.js'
      - 'tests/deploy/verify_backend_live.py'
      - 'tests/deploy/wait_published_revision.py'
      - 'tests/deploy/lib_viewport_pixels.js'
      - 'tests/remediation/test_delivery_published.py'
      - 'tests/remediation/test_public_guest_monitor.cjs'
      - 'tools/pw_chromium.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/delivery-published.yml'
      - 'tests/production/**'
      - 'tests/deploy/verify_public_guest.js'
      - 'tests/deploy/verify_backend_live.py'
      - 'tests/deploy/wait_published_revision.py'
      - 'tests/deploy/lib_viewport_pixels.js'
      - 'tests/remediation/test_delivery_published.py'
      - 'tests/remediation/test_public_guest_monitor.cjs'
      - 'tools/pw_chromium.js'
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: delivery-published-${{ github.event_name }}-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  published-public-journey:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.base.repo.full_name == github.repository &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # The candidate verifier runs against the already published base on PRs.
      # GitHub supplies both immutable IDs. Neither URL comes from the event.
      ACS_VERIFY_EXPECT_SHA: ${{ github.event.pull_request.base.sha || github.event.workflow_run.head_sha || github.sha }}
      ACS_VERIFIER_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
      ACS_RELEASE_SCOPE: ${{ github.event_name == 'pull_request' && 'monitor-on-base' || github.event_name == 'push' && 'early-production' || 'post-ci-production' }}
      ACS_VERIFY_FRONTEND: https://sprightly-selkie-d906c3.netlify.app
      ACS_VERIFY_BACKEND: https://acs-engine.onrender.com
      ACS_GUEST_OUTPUT: logs/published/public-guest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ACS_VERIFIER_SHA }}
          persist-credentials: false
      - name: Check out the asset contract for the published base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ACS_VERIFY_EXPECT_SHA }}
          path: published-source
          persist-credentials: false
      - name: Locate the exact source for published asset checks
        shell: bash
        run: |
          set -euo pipefail
          source_path="$GITHUB_WORKSPACE"
          if [[ "$ACS_RELEASE_SCOPE" == 'monitor-on-base' ]]; then
            source_path="$GITHUB_WORKSPACE/published-source"
          fi
          test "$(git -C "$source_path" rev-parse HEAD)" = "$ACS_VERIFY_EXPECT_SHA"
          echo "ACS_PUBLISHED_SOURCE_ROOT=$source_path" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify checkout identity and bounded wait regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs/published
          test "$(git rev-parse HEAD)" = "$ACS_VERIFIER_SHA"
          python - <<'PY_SCOPE'
          import json, os, re
          from pathlib import Path
          rec = {'scope': os.environ['ACS_RELEASE_SCOPE'],
                 'verifier_checkout': os.environ['ACS_VERIFIER_SHA'],
                 'expected_public_deployment': os.environ['ACS_VERIFY_EXPECT_SHA']}
          if any(not re.fullmatch('[0-9a-f]{40}', v) for k, v in rec.items() if k != 'scope'):
              raise SystemExit('INVALID_WORKFLOW_COMMIT_ID')
          if rec['scope'] != 'monitor-on-base' and rec['verifier_checkout'] != rec['expected_public_deployment']:
              raise SystemExit('UNEXPECTED_PRODUCTION_VERIFIER_REVISION')
          Path('logs/published/public-journey-scope.json').write_text(json.dumps(rec, indent=2) + '\n')
          print('Public journey scope:', rec)
          PY_SCOPE
          env -u ACS_PUBLISHED_SOURCE_ROOT python tests/remediation/test_delivery_published.py 2>&1 | tee logs/published/wait-contracts.log
          node tests/remediation/test_public_guest_monitor.cjs 2>&1 | tee logs/published/guest-controls.log
      - name: Install locked Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee logs/published/npm-install.log
          npx playwright install --with-deps chromium 2>&1 | tee logs/published/chromium-install.log
      - name: Wait at most ten minutes for both published revisions
        id: published
        timeout-minutes: 11
        shell: bash
        run: |
          set -euo pipefail
          python tests/deploy/wait_published_revision.py --seconds 600 2>&1 | tee logs/published/revision-wait.log
      - name: Fresh desktop and mobile guest journey with exact revision evidence
        if: ${{ !cancelled() && steps.published.outcome == 'success' }}
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          bash tests/production/run_all.sh 2>&1 | tee logs/published/public-journey.log
      - name: Anonymous backend error contracts remain 401 without generation
        if: ${{ !cancelled() && steps.published.outcome == 'success' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python tests/deploy/verify_backend_live.py "$ACS_VERIFY_BACKEND" 2>&1 | tee logs/published/backend-auth-boundary.log
          backend_exit=${PIPESTATUS[0]}
          set -e
          ACS_BACKEND_EXIT="$backend_exit" python - <<'PY'
          import json, os, re
          from pathlib import Path
          text = Path('logs/published/backend-auth-boundary.log').read_text()
          summaries = re.findall(r'^BACKEND LIVE: (\d+) passed, (\d+) failed', text, re.M)
          denied = text.count('POST /v1/understand -> HTTP 401 ACS_AUTH_REQUIRED')
          ok = (os.environ['ACS_BACKEND_EXIT'] == '0' and len(summaries) == 1
                and int(summaries[0][0]) > 0 and int(summaries[0][1]) == 0 and denied == 2)
          evidence = {'scope': 'free public backend and anonymous 401 contracts; paid generation excluded',
              'process_exit': int(os.environ['ACS_BACKEND_EXIT']), 'verdict': 'PASS' if ok else 'FAIL',
              'unauthenticated_401_checks': denied, 'summaries': summaries}
          Path('logs/published/backend-verdict.json').write_text(json.dumps(evidence, indent=2) + '\n')
          print('Published anonymous API:', evidence['verdict'])
          raise SystemExit(0 if ok else 1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ env.ACS_RELEASE_SCOPE }}-${{ env.ACS_VERIFY_EXPECT_SHA }}-${{ github.run_id }}
          path: |
            logs/published/
            tests/production/outputs/
          if-no-files-found: error
          retention-days: 30
