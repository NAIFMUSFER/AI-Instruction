name: Audit PR16 integration after PR19

on:
  push:
    branches:
      - audit/live-async-smoke-20260911

permissions:
  contents: read

jobs:
  conflict-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a66871a217b53179062928bba04aa7f259c14893
          fetch-depth: 0
      - name: Dry-run merge OpenAI provider branch and report exact conflicts
        run: |
          set -euo pipefail
          git config user.name audit
          git config user.email audit@example.invalid
          git fetch origin feature/openai-provider
          set +e
          git merge --no-commit --no-ff origin/feature/openai-provider
          rc=$?
          set -e
          echo "MERGE_RC=$rc"
          echo '--- conflicts ---'
          git diff --name-only --diff-filter=U | tee /tmp/conflicts.txt
          echo '--- changed paths after merge attempt ---'
          git status --short
          if [ -s /tmp/conflicts.txt ]; then
            echo 'PR16_INTEGRATION_CONFLICTS=YES'
          else
            echo 'PR16_INTEGRATION_CONFLICTS=NO'
          fi
          git merge --abort 2>/dev/null || true
