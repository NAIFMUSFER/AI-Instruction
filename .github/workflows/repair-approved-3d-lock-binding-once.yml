name: Repair approved 3D lock binding once

on:
  push:
    branches:
      - audit/approved-3d-lock-binding-v2
    paths:
      - '.github/workflows/repair-approved-3d-lock-binding-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/approved-3d-lock-binding-v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Apply minimal lock-binding handoff repair
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/acs_plan_handoff.py')
          s = p.read_text(encoding='utf-8')

          old = "from acs_plan_review import PlanError, PlanWorkspace, canonical, digest\nfrom acs_plan_projection import PROVENANCE_SCHEMA, provenance_map\n"
          new = "from acs_plan_review import PlanError, PlanWorkspace, canonical, digest\nfrom acs_plan_lock_binding import PlanLockWorkspace, SCHEMA as LOCK_BINDING_SCHEMA\nfrom acs_plan_projection import PROVENANCE_SCHEMA, provenance_map\n"
          assert old in s
          s = s.replace(old, new, 1)

          old = "    if not isinstance(workspace, PlanWorkspace):\n        raise PlanError(\"INVALID_WORKSPACE\", \"Approved 3D handoff requires a PlanWorkspace\")\n"
          new = "    if not isinstance(workspace, (PlanWorkspace, PlanLockWorkspace)):\n        raise PlanError(\"INVALID_WORKSPACE\", \"Approved 3D handoff requires a PlanWorkspace-compatible approved workspace\")\n"
          assert old in s
          s = s.replace(old, new, 1)

          anchor = "    if baseline.get(\"model_hash\") != before_hash or revision.model_hash != before_hash:\n        raise PlanError(\"BASELINE_CHANGED\", \"Approved handoff model hash does not match its receipt\")\n    source_map_hash = digest(source_map)\n"
          replacement = "    if baseline.get(\"model_hash\") != before_hash or revision.model_hash != before_hash:\n        raise PlanError(\"BASELINE_CHANGED\", \"Approved handoff model hash does not match its receipt\")\n\n    lock_binding = {}\n    if isinstance(workspace, PlanLockWorkspace):\n        if baseline.get(\"lock_binding_schema\") != LOCK_BINDING_SCHEMA:\n            raise PlanError(\"LOCK_RECEIPT_CHANGED\", \"Approved 3D handoff has an unknown semantic-lock binding schema\")\n        expected_lock = {\n            \"lock_binding_schema\": LOCK_BINDING_SCHEMA,\n            \"bound_content_hash\": revision.bound_content_hash,\n            \"semantic_lock_manifest_hash\": revision.semantic_lock_manifest_hash,\n            \"semantic_lock_count\": revision.semantic_lock_count,\n        }\n        if any(baseline.get(key) != value for key, value in expected_lock.items()):\n            raise PlanError(\"LOCK_RECEIPT_CHANGED\", \"Approved semantic-lock binding is detached from the Frozen Baseline\")\n        lock_binding = expected_lock\n    source_map_hash = digest(source_map)\n"
          assert anchor in s
          s = s.replace(anchor, replacement, 1)

          old = "            \"source_map_hash\": source_map_hash,\n        }\n        _embed_baseline_marker(temp_artifact, marker)\n"
          new = "            \"source_map_hash\": source_map_hash,\n            **lock_binding,\n        }\n        _embed_baseline_marker(temp_artifact, marker)\n"
          assert old in s
          s = s.replace(old, new, 1)

          old = "            \"source_map_hash\": source_map_hash,\n            \"source_map\": source_map,\n            \"compiler\": compiler_id,\n"
          new = "            \"source_map_hash\": source_map_hash,\n            \"source_map\": source_map,\n            **lock_binding,\n            \"compiler\": compiler_id,\n"
          assert old in s
          s = s.replace(old, new, 1)

          old = "    expected = {k: receipt.get(k) for k in (\n        \"schema\", \"revision_id\", \"model_hash\", \"content_hash\", \"approval_scope\",\n        \"provenance_schema\", \"requirements_hash\", \"provenance_hash\", \"source_map_hash\")}\n"
          new = "    marker_keys = [\n        \"schema\", \"revision_id\", \"model_hash\", \"content_hash\", \"approval_scope\",\n        \"provenance_schema\", \"requirements_hash\", \"provenance_hash\", \"source_map_hash\",\n    ]\n    lock_keys = (\"lock_binding_schema\", \"bound_content_hash\",\n                 \"semantic_lock_manifest_hash\", \"semantic_lock_count\")\n    present_lock_keys = [key for key in lock_keys if key in receipt]\n    if present_lock_keys:\n        if len(present_lock_keys) != len(lock_keys) or receipt.get(\"lock_binding_schema\") != LOCK_BINDING_SCHEMA:\n            raise PlanError(\"INVALID_BASELINE_RECEIPT\", \"3D semantic-lock receipt is incomplete or unknown\")\n        if type(receipt.get(\"semantic_lock_count\")) is not int or receipt[\"semantic_lock_count\"] < 0:\n            raise PlanError(\"INVALID_BASELINE_RECEIPT\", \"3D semantic-lock count is invalid\")\n        bound_hash = receipt.get(\"bound_content_hash\")\n        lock_hash = receipt.get(\"semantic_lock_manifest_hash\")\n        if not isinstance(bound_hash, str) or len(bound_hash) != 64:\n            raise PlanError(\"INVALID_BASELINE_RECEIPT\", \"3D bound-content hash is invalid\")\n        if lock_hash is not None and (not isinstance(lock_hash, str) or len(lock_hash) != 64):\n            raise PlanError(\"INVALID_BASELINE_RECEIPT\", \"3D semantic-lock manifest hash is invalid\")\n        marker_keys.extend(lock_keys)\n    expected = {k: receipt.get(k) for k in marker_keys}\n"
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify focused and legacy regressions
        env:
          ACS_ENV: test
          ANTHROPIC_API_KEY: dummy
        run: |
          python -m py_compile tools/acs_plan_handoff.py tests/remediation/test_plan_handoff_lock_binding.py tests/remediation/test_plan_handoff.py
          python -S tests/remediation/test_plan_handoff_lock_binding.py
          python -S tests/remediation/test_plan_handoff.py
      - name: Commit repair and self-removal
        run: |
          rm .github/workflows/repair-approved-3d-lock-binding-once.yml
          git config user.name 'NAIFMUSFER'
          git config user.email 'whili9070@gmail.com'
          git add tools/acs_plan_handoff.py .github/workflows/repair-approved-3d-lock-binding-once.yml
          git commit -m 'fix(acs-v2): preserve semantic-lock binding in approved 3D'
          git push origin HEAD:audit/approved-3d-lock-binding-v2
