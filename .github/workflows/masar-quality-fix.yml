name: MASAR chalet client acceptance
on:
  push:
    branches: ['audit/masar-chalet-generation-20260908']
    paths: ['masar-studio/**', '.github/workflows/masar-quality-fix.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: masar-chalet-quality-${{ github.ref }}
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Check syntax build and every engine server and security regression
        working-directory: masar-studio
        run: |
          mkdir -p test-output
          npm ci --ignore-scripts && npm run check && npm run build
          npm test > test-output/chalet-all-node.log 2>&1 || { grep -A 40 '^not ok' test-output/chalet-all-node.log; tail -12 test-output/chalet-all-node.log; exit 1; }
          tail -12 test-output/chalet-all-node.log
      - name: Install exact browsers and compile self-hosted material viewer
        run: |
          python -m pip install playwright==1.62.0 > /tmp/pip.log 2>&1
          python -m playwright install --with-deps chromium webkit > /tmp/browsers.log 2>&1 || { tail -80 /tmp/browsers.log; exit 1; }
          cd masar-studio/render-viewer && npm ci --include=dev && npm run build
      - name: Original customer description on mobile and desktop including invalid input recovery
        working-directory: masar-studio
        run: python tests/browser_chalet.py
      - name: Existing 56 standalone user journeys
        working-directory: masar-studio
        run: python tests/browser_flows.py
      - name: Dispatch independent full Blender IFC Docker and three-browser gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api repos/NAIFMUSFER/AI-Instruction/git/ref/heads/audit/masar-chalet-generation-20260908 --jq '.object.sha')
          test "$current" = "$GITHUB_SHA"
          gh api --method POST repos/NAIFMUSFER/AI-Instruction/actions/workflows/masar-blender-ci.yml/dispatches -f ref=audit/masar-chalet-generation-20260908
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: masar-chalet-fixed-acceptance
          path: |
            masar-studio/test-output/chalet-acceptance/
            masar-studio/test-output/chalet-all-node.log
            masar-studio/docs/browser-tests.json
          retention-days: 14
