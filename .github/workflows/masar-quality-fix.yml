name: MASAR chalet fix and client acceptance
on:
  push:
    branches: ['audit/masar-chalet-generation-20260908']
    paths: ['.github/workflows/masar-quality-fix.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: audit/masar-chalet-generation-20260908
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Record remaining failures before refining the audited source
        run: |
          cd masar-studio
          mkdir -p test-output/chalet-acceptance
          node --test tests/chalet-quality.test.mjs tests/chalet-provenance.test.mjs > test-output/chalet-acceptance/refinement-before.log 2>&1 || true
          python - <<'PY'
          from pathlib import Path
          lines=Path('test-output/chalet-acceptance/refinement-before.log').read_text().splitlines()
          for i,line in enumerate(lines):
              if line.startswith('not ok'):print('\n'.join(lines[i:i+26]))
          print('\n'.join(lines[-10:]))
          PY
      - name: Refine primary building identity and prevent raw-prompt duplication
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('masar-studio/shared/model.js');assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='41048d4d7dc3c2902bd23858d82f0a6aa54788e5'
          s=p.read_text();start=s.index('function requestedProjectType(t) {');end=s.index('function requestedBuildingArea(t)',start)
          s=s[:start]+r'''function requestedProjectType(t) {
              const classify=x=>{
                  if (/(?:فيلا|فله|منزل)\s*(?:بنظام|بطابع|باسلوب)\s*شاليه/.test(x)) return 'chalet';
                  const candidates=[[/شاليه/,'chalet'],[/(?:فيلا|فله|منزل|\bvilla\b)/,'villa'],[/(?:مستودع|مخزن|warehouse)/,'warehouse'],[/(?:مكاتب|مكتب اداري|office)/,'office'],[/(?:متجر|محل تجاري|تجز[يئ]ه|retail)/,'retail']]
                      .map(([re,type])=>({index:x.search(re),type})).filter(c=>c.index>=0).sort((a,b)=>a.index-b.index);
                  return candidates[0]?.type;
              };
              return classify(t.split(/[،.\n]/)[0])||classify(t)||'villa';
          }
          '''+s[end:]
          old=r"        requestedDetails: String(prompt).split(/\n\s*\n/).filter(Boolean).flatMap(x=>x.match(/[\s\S]{1,800}/g)||[]).slice(0,55),"
          assert s.count(old)==1;s=s.replace(old+'\n','')
          old='...(brief.requestedDetails||[]).map((label,i)=>'
          new=r"...String(brief.prompt||'').split(/\n\s*\n/).filter(Boolean).flatMap(x=>x.match(/[\s\S]{1,800}/g)||[]).slice(0,55).map((label,i)=>"
          assert s.count(old)==1;s=s.replace(old,new)
          old="const priority = /خصوصي/.test(t) ? 'privacy'"
          new=r"const priority = /(?:ال)?اولويه[^،.\n]{0,100}(?:حديق|مسبح|منتجع|شاليه|حوش)/.test(t) ? 'outdoor' : /خصوصي/.test(t) ? 'privacy'"
          assert s.count(old)==1;s=s.replace(old,new);p.write_text(s)
          PY
          cd masar-studio && npm run check && npm run build
      - name: Commit only reviewed model refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add masar-studio/shared/model.js
          git diff --cached --check
          git commit -m 'fix(masar): prefer primary building use and preserve description-sharing privacy'
          git push origin HEAD:audit/masar-chalet-generation-20260908
          git rev-parse HEAD
      - name: Run every engine, server and security regression
        working-directory: masar-studio
        run: |
          npm test > test-output/chalet-all-node.log 2>&1 || { grep -A 40 '^not ok' test-output/chalet-all-node.log; tail -12 test-output/chalet-all-node.log; exit 1; }
          tail -12 test-output/chalet-all-node.log
      - name: Install exact browsers and compile local viewer
        run: |
          python -m pip install playwright==1.62.0 > /tmp/pip.log 2>&1
          python -m playwright install --with-deps chromium webkit > /tmp/browsers.log 2>&1 || { tail -80 /tmp/browsers.log; exit 1; }
          cd masar-studio/render-viewer && npm ci --include=dev && npm run build
      - name: Exercise exact customer description, error recovery and exported geometry
        working-directory: masar-studio
        run: python tests/browser_chalet.py
      - name: Verify existing standalone interactions
        working-directory: masar-studio
        run: python tests/browser_flows.py
      - name: Dispatch full Blender IFC Docker and three-browser gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/NAIFMUSFER/AI-Instruction/actions/workflows/masar-blender-ci.yml/dispatches -f ref=audit/masar-chalet-generation-20260908
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: masar-chalet-fixed-acceptance
          path: |
            masar-studio/test-output/chalet-acceptance/
            masar-studio/test-output/chalet-all-node.log
            masar-studio/docs/browser-tests.json
          retention-days: 14
