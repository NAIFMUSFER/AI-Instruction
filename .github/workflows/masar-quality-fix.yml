name: MASAR chalet fix and client acceptance
on:
  push:
    branches: ['audit/masar-chalet-generation-20260908']
    paths: ['.github/workflows/masar-quality-fix.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: audit/masar-chalet-generation-20260908
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install exact browsers and build self-hosted viewer
        run: |
          python -m pip install playwright==1.62.0 > /tmp/pip.log 2>&1
          python -m playwright install --with-deps chromium webkit > /tmp/browsers.log 2>&1 || { tail -80 /tmp/browsers.log; exit 1; }
          cd masar-studio && npm ci --ignore-scripts && npm run build
          cd render-viewer && npm ci --include=dev && npm run build
      - name: Prove client regression is red and collect blocked type-correction path
        working-directory: masar-studio
        run: |
          mkdir -p test-output/chalet-acceptance
          if node --test tests/chalet-quality.test.mjs > test-output/chalet-acceptance/before-node.log 2>&1; then echo 'Expected the unchanged release to fail the new client contract'; exit 1; fi
          MASAR_CHALET_ENGINES=chromium python tests/browser_chalet.py --baseline --base https://masar-blender-preview.onrender.com
          tail -12 test-output/chalet-acceptance/before-node.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masar-chalet-blocked-before
          path: masar-studio/test-output/chalet-acceptance/
          retention-days: 14
      - name: Apply audited repair and check syntax before committing candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.masar-ops/fix-chalet-quality.py')
          source=p.read_text().replace("const CACHE='masar-4.1.0-shell-v3';", "const CACHE='masar-4.1.0-shell-v4-blender';")
          compile(source,str(p),'exec');exec(compile(source,str(p),'exec'))
          PY
          cd masar-studio && npm run check && npm run build
          python -m py_compile tests/browser_chalet.py
      - name: Store only the three reviewed application paths on the audit branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add masar-studio/shared/model.js masar-studio/src/app.js masar-studio/public/sw.js
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(masar): preserve chalet intent and bounded area, expose validation in dialog'
          git push origin HEAD:audit/masar-chalet-generation-20260908
          git rev-parse HEAD
      - name: Run all old and new engine/server/security tests
        working-directory: masar-studio
        run: |
          npm test > test-output/chalet-all-node.log 2>&1 || { tail -150 test-output/chalet-all-node.log; exit 1; }
          tail -12 test-output/chalet-all-node.log
      - name: Run original and corrected customer journey in real browsers
        working-directory: masar-studio
        run: |
          python tests/browser_chalet.py
          python tests/browser_flows.py
      - name: Dispatch full Blender/IFC/Docker/three-browser integration gates on fixed source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/NAIFMUSFER/AI-Instruction/actions/workflows/masar-blender-ci.yml/dispatches -f ref=audit/masar-chalet-generation-20260908
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: masar-chalet-fixed-acceptance
          path: |
            masar-studio/test-output/chalet-acceptance/
            masar-studio/test-output/chalet-all-node.log
            masar-studio/docs/browser-tests.json
          retention-days: 14
