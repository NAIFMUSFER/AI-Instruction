name: Commercial auth boundary
on:
  push:
    branches:
      - 'feature/commercial-auth-boundary-v2'
    paths:
      - 'acs_auth.py'
      - 'acs_api_errors.py'
      - 'tests/remediation/test_commercial_auth_boundary.py'
      - '.github/workflows/commercial-auth-boundary.yml'
  pull_request:
    paths:
      - 'acs_auth.py'
      - 'acs_api_errors.py'
      - 'tests/remediation/test_commercial_auth_boundary.py'
      - '.github/workflows/commercial-auth-boundary.yml'
permissions:
  contents: read
concurrency:
  group: commercial-auth-boundary-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install locked backend dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Compile auth contracts
        run: python -m py_compile acs_api_errors.py tests/remediation/test_commercial_auth_boundary.py
      - name: Commercial authentication regressions
        env:
          ACS_ENV: test
          ANTHROPIC_API_KEY: dummy
        run: python -S tests/remediation/test_commercial_auth_boundary.py
      - name: No generated diff
        run: git diff --exit-code
