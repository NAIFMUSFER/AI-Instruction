name: ACS warehouse feasibility runtime wire
on:
  push:
    branches: [acs-v2/warehouse-program-feasibility-20260915]
    paths: [tools/wire_warehouse_feasibility_runtime.py]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acs-v2/warehouse-program-feasibility-20260915
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python tools/wire_warehouse_feasibility_runtime.py
      - run: |
          PYTHONPATH=. python tests/remediation/test_warehouse_program_feasibility.py
          node tests/remediation/test_brief_program.mjs
          python -m py_compile warehouse_program_feasibility.py acs_workspace_service.py
      - name: Commit exact runtime wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app/core/brief-program.mjs acs_workspace_service.py warehouse_program_feasibility.py Dockerfile
          git commit -m 'feat(acs-v2): wire warehouse feasibility before layout'
          git push origin HEAD:acs-v2/warehouse-program-feasibility-20260915
