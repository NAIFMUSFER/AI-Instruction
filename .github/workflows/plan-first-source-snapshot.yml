name: Plan-first tracked source snapshot
on:
  push:
    branches: [feature/plan-first-approval-20260911]
    paths: [.github/workflows/plan-first-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive tracked source only; exclude runtime credentials and Git metadata
        run: git archive --format=zip --output=acs-tracked-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: acs-plan-first-tracked-source
          path: acs-tracked-source.zip
          retention-days: 1
          if-no-files-found: error
