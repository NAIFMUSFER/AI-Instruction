name: PR50 sync latest ACS v2 RC
on:
  push:
    branches:
      - feature/warehouse-viewport-exact-selection-v2
    paths:
      - '.github/workflows/tmp-pr50-sync-latest-rc.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/warehouse-viewport-exact-selection-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge latest RC, refusing engineering-code conflicts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin release/acs-design-pipeline-v2-rc1
          set +e
          git merge --no-commit --no-ff origin/release/acs-design-pipeline-v2-rc1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            echo "Conflicts:"
            printf '%s\n' "$conflicts"
            unsafe="$(printf '%s\n' "$conflicts" | grep -Ev '^(KNOWN-ISSUES\.md|tests/performance/bundle_report\.json)$' || true)"
            if [ -n "$unsafe" ]; then
              echo 'Refusing automatic resolution outside generated measurement artifacts.' >&2
              exit 1
            fi
            for f in KNOWN-ISSUES.md tests/performance/bundle_report.json; do
              if printf '%s\n' "$conflicts" | grep -Fxq "$f"; then
                git checkout --theirs -- "$f"
                git add "$f"
              fi
            done
          fi
      - name: Regenerate deterministic frontend measurements on combined tree
        run: |
          set -euo pipefail
          python3 tools/bundle_report.py
          python3 - <<'PY'
          from tools.check_doc_claims import check_state
          ok, msg = check_state(fix=True)
          print(msg)
          if not ok:
              raise SystemExit(1)
          PY
          git add tests/performance/bundle_report.json KNOWN-ISSUES.md
      - name: Commit and push combined tree
        run: |
          set -euo pipefail
          git commit -m 'Merge latest ACS v2 RC into warehouse viewport selection'
          git push origin HEAD:feature/warehouse-viewport-exact-selection-v2
