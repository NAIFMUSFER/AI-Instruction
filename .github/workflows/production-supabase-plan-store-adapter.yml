name: Production Supabase plan-store adapter

on:
  pull_request:
    paths:
      - 'acs_supabase_plan_store.py'
      - 'acs_workspace_http.py'
      - 'acs_generation_job.py'
      - 'acs_plan_store_reload.py'
      - 'tests/remediation/test_plan_store_postgres_boundary.py'
      - 'tests/remediation/test_plan_store_paged_history.py'
      - 'tests/remediation/test_delivery_job_leases_postgres.py'
      - 'tests/remediation/test_delivery_progress_ack.py'
      - 'acs_plan_session.py'
      - 'tests/remediation/test_rls_history_transport.py'
      - 'tests/remediation/test_rls_history_postgrest.py'
      - 'tests/remediation/test_plan_store_authenticated_session.py'
      - 'supabase/migrations/**'
      - 'tests/remediation/test_supabase_plan_store_adapter.py'
      - 'tests/remediation/test_supabase_plan_store_rpc_schema.py'
      - '.github/workflows/production-supabase-plan-store-adapter.yml'

permissions:
  contents: read

jobs:
  supabase-plan-store-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      PG_BINDIR: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile adapter contracts
        run: |
          python -m py_compile acs_supabase_plan_store.py \
            tests/remediation/test_supabase_plan_store_adapter.py \
            tests/remediation/test_supabase_plan_store_rpc_schema.py
      - name: Verify authenticated Supabase adapter
        env:
          PYTHONPATH: .
        run: |
          python tests/remediation/test_supabase_plan_store_adapter.py
          python tests/remediation/test_rls_history_transport.py
          python tests/remediation/test_plan_store_authenticated_session.py
      - name: Verify atomic RPC schema
        run: PYTHONPATH=. python tests/remediation/test_supabase_plan_store_rpc_schema.py
      - name: Execute PostgreSQL authorization, job leases and history regressions
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$PG_BINDIR/postgres" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-16
          fi
          test -x "$PG_BINDIR/postgres"
          python tests/remediation/test_plan_store_postgres_boundary.py
          python tests/remediation/test_plan_store_paged_history.py
          python tests/remediation/test_delivery_job_leases_postgres.py
          python tests/remediation/test_delivery_progress_ack.py
      - name: No generated diff
        run: git diff --exit-code


  postgrest-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONPATH: .
      PGPASSWORD: local-postgres-test-only
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-postgres-test-only
          POSTGRES_DB: acs_history_fixture
        ports:
          - 127.0.0.1:55329:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare isolated users, roles and immutable receipts
        run: python tests/remediation/test_rls_history_postgrest.py prepare
      - name: Start PostgREST on loopback
        run: |
          docker run -d --name acs-history-rest --network host \
            -e PGRST_DB_URI=postgres://acs_history_api:isolated-api-role@127.0.0.1:55329/acs_history_fixture \
            -e PGRST_DB_ANON_ROLE=anon -e PGRST_SERVER_HOST=127.0.0.1 -e PGRST_SERVER_PORT=55330 \
            -e PGRST_JWT_SECRET=isolated-postgrest-test-issuer-no-production-use postgrest/postgrest:v12.2.12
      - name: Verify real relational reads, approval recovery and role enforcement
        run: python tests/remediation/test_rls_history_postgrest.py verify
