name: Wire warehouse requirements preflight UI
on:
  push:
    branches: [acs-v2/warehouse-preflight-ui]
    paths: [.github/workflows/patch-warehouse-preflight-ui.yml]
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: acs-v2/warehouse-preflight-ui, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Apply deterministic client preflight and regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/app/core/brief-program.mjs')
          s=p.read_text(encoding='utf-8')
          marker="const normal = s => s.replace(/[٠-٩۰-۹أإآ]/g,c=>{"
          assert marker in s
          fn="""export function warehouseRequirementsPreflight(requirements) {\n  const reqs=Array.isArray(requirements)?requirements:[];\n  const confirmed=metric=>{\n    const values=reqs.filter(r=>r&&typeof r==='object'&&r.metric===metric).map(r=>r.expected);\n    if(values.length!==1)return null;\n    const value=values[0];\n    return typeof value==='number'&&Number.isFinite(value)?value:null;\n  };\n  const w=confirmed('site_width_m'),d=confirmed('site_depth_m'),levels=confirmed('level_count'),target=confirmed('building_target_area_m2');\n  if([w,d,levels,target].some(v=>v===null))return {status:'NOT_EVALUATED',may_generate_layout:true};\n  const site=w*d;\n  if(target>site*levels)return {status:'BUILDING_TARGET_EXCEEDS_THEORETICAL_FLOOR_AREA',site_area_m2:site,building_target_m2:target,level_count:levels,may_generate_layout:false};\n  if(levels===1&&target>=site)return {status:'BUILDABLE_ENVELOPE_NOT_VERIFIED',site_area_m2:site,building_target_m2:target,level_count:levels,unallocated_site_area_m2:Math.max(0,site-target),may_generate_layout:false};\n  return {status:'FEASIBLE_FOR_LAYOUT_PREFLIGHT',site_area_m2:site,building_target_m2:target,level_count:levels,unallocated_site_area_m2:levels?site-target/levels:null,may_generate_layout:true};\n}\n\n"""
          s=s.replace(marker,fn+marker,1)
          marker2="    known.set(key,r);\n  }\n  const grouped=new Map();"
          assert marker2 in s
          guard="""    known.set(key,r);\n  }\n  if(input.type==='warehouse'){\n    const preflight=warehouseRequirementsPreflight(values);\n    if(!preflight.may_generate_layout){\n      if(preflight.status==='BUILDABLE_ENVELOPE_NOT_VERIFIED')throw new Error('مساحة المبنى المستهدفة تستهلك كامل مساحة الموقع في مشروع من دور واحد. أدخل مساحة مبنى أصغر أو موقعًا أكبر؛ لن يخترع ACS ارتدادات أو أبعادًا تنظيمية.');\n      if(preflight.status==='BUILDING_TARGET_EXCEEDS_THEORETICAL_FLOOR_AREA')throw new Error('مساحة المبنى المستهدفة أكبر من المساحة النظرية المتاحة عبر عدد الأدوار المؤكد. عدّل مساحة المبنى أو أبعاد الموقع أو عدد الأدوار قبل الانتقال إلى البدائل.');\n    }\n  }\n  const grouped=new Map();"""
          s=s.replace(marker2,guard,1)
          p.write_text(s,encoding='utf-8')

          t=Path('tests/remediation/test_brief_program.mjs')
          q=t.read_text(encoding='utf-8')
          q=q.replace("import {analyzeBrief, buildBriefProgram} from '../../public/app/core/brief-program.mjs';","import {analyzeBrief, buildBriefProgram, warehouseRequirementsPreflight} from '../../public/app/core/brief-program.mjs';",1)
          insert="""  ['Warehouse site/building envelope stops in requirements before design options', () => {\n    const reqs=(target=5000,levels=1)=>[\n      {metric:'site_width_m',expected:50},{metric:'site_depth_m',expected:100},\n      {metric:'level_count',expected:levels},{metric:'building_target_area_m2',expected:target},\n    ];\n    const blocked=warehouseRequirementsPreflight(reqs());\n    assert.equal(blocked.status,'BUILDABLE_ENVELOPE_NOT_VERIFIED');\n    assert.equal(blocked.site_area_m2,5000);assert.equal(blocked.unallocated_site_area_m2,0);assert.equal(blocked.may_generate_layout,false);\n    assert.equal(warehouseRequirementsPreflight(reqs(2000)).status,'FEASIBLE_FOR_LAYOUT_PREFLIGHT');\n    assert.equal(warehouseRequirementsPreflight(reqs(5000,2)).may_generate_layout,true);\n    assert.equal(warehouseRequirementsPreflight(reqs(10001,2)).status,'BUILDING_TARGET_EXCEEDS_THEORETICAL_FLOOR_AREA');\n    assert.equal(warehouseRequirementsPreflight(reqs().slice(0,3)).status,'NOT_EVALUATED');\n    const warehouse=form('مستودع لوجستي',{type:'warehouse',width:'50',depth:'100',levels:'1',rows:[{metric:'building_target_area_m2',expected:'5000'}]});\n    assert.throws(()=>buildBriefProgram(warehouse),/تستهلك كامل مساحة الموقع/);\n    assert.doesNotThrow(()=>buildBriefProgram(form('مستودع لوجستي',{type:'warehouse',width:'50',depth:'100',levels:'1',rows:[{metric:'building_target_area_m2',expected:'2000'}]})));\n    assert.doesNotThrow(()=>buildBriefProgram(form('مشروع سكني',{type:'residential',width:'50',depth:'100',levels:'1',rows:[{metric:'building_target_area_m2',expected:'5000'}]})));\n  }],\n"""
          marker3="  ['Conflicting description and inputs stop before generation', () => {"
          assert marker3 in q
          q=q.replace(marker3,insert+marker3,1)
          t.write_text(q,encoding='utf-8')
          PY
          node tests/remediation/test_brief_program.mjs
          python3 tests/remediation/test_warehouse_program_feasibility.py
      - name: Commit product change
        shell: bash
        run: |
          git config user.name 'NAIFMUSFER'
          git config user.email 'whili9070@gmail.com'
          git add public/app/core/brief-program.mjs tests/remediation/test_brief_program.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'fix(acs-v2): surface warehouse site envelope before options'
          git push origin HEAD:acs-v2/warehouse-preflight-ui
