name: MASAR exact customer journey audit
on:
  push:
    branches: ['audit/masar-customer-journey-20260908']
    paths: ['.github/workflows/masar-customer-audit.yml']
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Inspect unmodified generation with exact input
        working-directory: masar-studio
        run: |
          mkdir -p test-output/customer-before
          node --input-type=module <<'JS' | tee test-output/customer-before/engine.jsonl
          import {readFileSync} from 'node:fs';
          import {understand,generate,validate,totals} from './shared/model.js';
          const prompt=readFileSync('tests/fixtures/customer-chalet-ar.txt','utf8');
          const b=understand(prompt);console.log(JSON.stringify({phase:'understand',characters:prompt.length,brief:b}));
          for(const [name,brief] of [['as-parsed',b],['correct-project-type',{...b,projectType:'chalet',bedrooms:3,floors:1}]]){
            try{const m=generate(brief);console.log(JSON.stringify({name,totals:totals(m),issues:validate(m),site:m.site,rooms:m.levels.map(l=>l.rooms.map(r=>({id:r.id,name:r.name,kind:r.kind,w:r.w,d:r.d,x:r.x,y:r.y})))}));}
            catch(e){console.log(JSON.stringify({name,error:e.message,stack:e.stack}));}
          }
          JS
      - name: Install diagnostic browsers
        run: |
          python -m pip install playwright==1.62.0 > /tmp/pip.log 2>&1
          python -m playwright install --with-deps chromium webkit > /tmp/browser-install.log 2>&1 || { tail -80 /tmp/browser-install.log; exit 1; }
      - name: Act as customer on the published preview, no accounts or server writes
        working-directory: masar-studio
        run: |
          python - <<'PY'
          import json,traceback
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path('test-output/customer-before');prompt=Path('tests/fixtures/customer-chalet-ar.txt').read_text()
          with sync_playwright() as p:
              for engine in ['chromium','webkit']:
                  browser=getattr(p,engine).launch(headless=True)
                  context=browser.new_context(viewport={'width':390,'height':844},device_scale_factor=2,has_touch=True,is_mobile=True)
                  page=context.new_page();page.set_default_timeout(15000)
                  errors=[];console=[];result={'engine':engine,'viewport':'390x844','origin':'https://masar-blender-preview.onrender.com'}
                  page.on('pageerror',lambda e:errors.append(str(e)))
                  page.on('console',lambda m:console.append({'type':m.type,'text':m.text}))
                  try:
                      page.goto(result['origin'],wait_until='domcontentloaded',timeout=120000)
                      page.locator('#scene[data-ready="true"]').wait_for(state='attached',timeout=60000)
                      page.locator('button[data-action="new"]').first.click()
                      page.locator('#new-prompt').fill(prompt)
                      page.locator('#new-form button[type="submit"]').click()
                      page.locator('#brief-form').wait_for()
                      result['fields']=page.locator('#brief-form').evaluate("f=>[...f.elements].filter(e=>e.name).map(e=>({name:e.name,value:e.value,type:e.type,valid:e.validity.valid,validation:e.validationMessage}))")
                      page.evaluate("window.auditInvalid=[];document.addEventListener('invalid',e=>window.auditInvalid.push({name:e.target.name,message:e.target.validationMessage}),true)")
                      page.locator('#brief-form input[name="confirm"]').check()
                      page.screenshot(path=str(out/(engine+'-before-submit.png')),full_page=True)
                      page.locator('#brief-form button[type="submit"]').click()
                      page.wait_for_timeout(800)
                      result.update(page.evaluate("()=>({modalOpen:document.querySelector('#modal').open,modalTitle:document.querySelector('#modal-title').textContent,toasts:document.querySelector('#toasts').innerText,invalid:window.auditInvalid,projectTitle:document.querySelector('#project-title').textContent,modalText:document.querySelector('#modal-content').innerText})"))
                      page.screenshot(path=str(out/(engine+'-after-submit.png')),full_page=True)
                  except Exception as e:result['diagnosticError']=str(e);result['traceback']=traceback.format_exc()
                  result.update({'errors':errors,'console':console[-20:]})
                  (out/(engine+'.json')).write_text(json.dumps(result,ensure_ascii=False,indent=2));print('CUSTOMER_DIAGNOSTIC '+json.dumps(result,ensure_ascii=False),flush=True)
                  browser.close()
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: masar-exact-customer-before
          path: masar-studio/test-output/customer-before/
          retention-days: 14
