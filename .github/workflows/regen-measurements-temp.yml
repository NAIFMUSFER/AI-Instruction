name: Temporary measured frontend artifact
on:
  push:
    branches: [feat/google-signin]
    paths:
      - '.github/workflows/regen-measurements-temp.yml'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate deterministic measurements
        run: |
          python3 tools/bundle_report.py
          python3 tools/check_doc_claims.py --fix
      - uses: actions/upload-artifact@v4
        with:
          name: measured-frontend-artifacts
          path: |
            tests/performance/bundle_report.json
            KNOWN-ISSUES.md
