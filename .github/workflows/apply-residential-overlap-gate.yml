name: Prove and correct residential overlap gate
on:
  push:
    branches: [fix/residential-overlap-gate-20260911]
    paths: [.github/workflows/apply-residential-overlap-gate.yml]
permissions:
  contents: write
jobs:
  prove-and-correct:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACS_ENV: test
      ACS_LLM_PROVIDER: anthropic
      ANTHROPIC_API_KEY: dummy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install existing locked test dependencies
        run: python -m pip install -q -r requirements.txt -r requirements-dev.txt
      - name: Prove actual validator finding is lost, then correct only the selector
        run: |
          mkdir -p logs
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          result = subprocess.run([sys.executable, 'tests/remediation/test_residential_quality.py'],
                                  capture_output=True, text=True, timeout=90)
          text = result.stdout + result.stderr
          Path('logs/overlap-before.log').write_text(text, encoding='utf-8')
          expected = 'residential: actual overlap findings reach the residential repair gate'
          if result.returncode != 1 or ('AssertionError: ' + expected) not in text:
              raise SystemExit('Baseline did not reproduce the exact reviewed defect; no source was changed.')
          print('REPRODUCED: real validator reports overlapping rooms; residential repair gate loses the finding.')
          path = Path('acs_understand.py')
          src = path.read_text(encoding='utf-8')
          old = 'keys=("تتداخل", "خارج حدود",'
          new = 'keys=("تداخل بين", "تتداخل", "خارج حدود",'
          if src.count(old) != 1:
              raise SystemExit('Expected selector is not unique; refusing the source change.')
          path.write_text(src.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify the correction and existing geometry contracts
        run: |
          set -o pipefail
          python -m py_compile acs_understand.py tests/remediation/test_residential_quality.py
          python tests/remediation/test_residential_quality.py 2>&1 | tee logs/overlap-after.log
          python tests/remediation/test_generation_spatial_context.py 2>&1 | tee logs/spatial-context.log
          python tests/remediation/test_validate_topology.py 2>&1 | tee logs/topology.log
          python tests/remediation/test_validate_against_real_models.py 2>&1 | tee logs/real-model-fixtures.log
          git diff --check
          git diff --stat
      - name: Commit verified selector without overwriting concurrent work
        run: |
          git fetch origin refs/heads/fix/residential-overlap-gate-20260911
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add acs_understand.py
          git commit -m 'fix: pass actual room-overlap findings into residential plan repair'
          git push origin HEAD:fix/residential-overlap-gate-20260911
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: residential-overlap-before-after
          path: logs/
          retention-days: 7
