name: MASAR exact offline-test patch
on:
  push:
    branches: ['masar/production-v4']
    paths: ['.github/workflows/masar-patch-offline.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - name: Replace browser-offline emulator with real origin outage
        run: |
          python - <<'PY'
          from pathlib import Path
          f=Path('masar-studio/tests/browser_http.py')
          s=f.read_text()
          edits=[
            ("                # A fresh same-context navigation is a stronger PWA check than calling\n                # Page.reload while offline and avoids a Playwright/WebKit reload bug.\n", "                # Stop the actual origin instead of relying on Playwright's offline emulator.\n                # This exercises the real PWA outage path equally in all three engines.\n"),
            ("                context.set_offline(True);offline_page=context.new_page();offline_page.set_default_timeout(15000);observe(offline_page)\n", "                server.terminate();server.wait(timeout=8);offline_page=context.new_page();offline_page.set_default_timeout(15000);observe(offline_page)\n"),
            ("                    offline_page.close();context.set_offline(False)\n", "                    offline_page.close()\n"),
            ("            check('offline PWA fresh navigation restores local project without claiming cloud connectivity',offline)\n", "            check('PWA survives real origin outage and restores local project without claiming cloud connectivity',offline)\n"),
          ]
          for old,new in edits:
              assert s.count(old)==1, 'expected exact browser test fragment not found once: '+old[:70]
              s=s.replace(old,new)
          f.write_text(s)
          PY
          git diff --check
          git diff -- masar-studio/tests/browser_http.py
      - name: Commit exact test-harness fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add masar-studio/tests/browser_http.py
          git commit -m 'test(masar): validate PWA under real origin outage'
          git push origin HEAD:masar/production-v4
