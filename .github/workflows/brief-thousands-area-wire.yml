name: ACS brief grouped measured-area questions wire
on:
  push:
    branches: [acs-v2/brief-thousands-area-questions-20260916]
    paths: [tools/patch_brief_thousands_area_questions.py]
permissions: {contents: write}
jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: acs-v2/brief-thousands-area-questions-20260916, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python tools/patch_brief_thousands_area_questions.py
      - run: node tests/remediation/test_brief_program.mjs
      - run: node --check public/app/core/brief-program.mjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app/core/brief-program.mjs tests/remediation/test_brief_program.mjs
          git commit -m 'fix(acs-v2): ignore thousands separators in measured-area review questions'
          git push origin HEAD:acs-v2/brief-thousands-area-questions-20260916
