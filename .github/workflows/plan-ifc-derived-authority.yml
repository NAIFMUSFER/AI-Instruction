name: Plan-first IFC derived authority
on:
  pull_request:
    paths:
      - 'tools/acs_plan_ifc_export.py'
      - 'tests/remediation/test_plan_ifc_derived_authority.py'
      - '.github/workflows/plan-ifc-derived-authority.yml'
permissions:
  contents: read
concurrency:
  group: plan-ifc-derived-authority-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile IFC authority contracts
        run: python -m py_compile tools/acs_plan_ifc_export.py tests/remediation/test_plan_ifc_derived_authority.py
      - name: Explicit IFC derived-authority regressions
        env:
          ACS_ENV: test
          ANTHROPIC_API_KEY: dummy
        run: python -S tests/remediation/test_plan_ifc_derived_authority.py
      - name: No generated diff
        run: git diff --exit-code
