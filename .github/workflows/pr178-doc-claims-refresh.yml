name: PR178 pre-stamp doc claims refresh
on:
  push:
    branches: [acs-v2/brief-thousands-area-questions-20260916]
    paths: [tools/pr178-doc-claims-refresh.trigger]
permissions: {contents: write}
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: acs-v2/brief-thousands-area-questions-20260916, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Preserve the same pre-stamp bundle measurement CI checks
        run: |
          python3 tools/bundle_report.py
          cp tests/performance/bundle_report.json /tmp/bundle_report.pre-stamp.json
          bash tools/netlify-build.sh
          cp /tmp/bundle_report.pre-stamp.json tests/performance/bundle_report.json
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Refresh and verify measured documentation claims
        run: |
          python3 tools/check_doc_claims.py --fix
          cp /tmp/bundle_report.pre-stamp.json tests/performance/bundle_report.json
          python3 tools/check_doc_claims.py
      - name: Commit only measured documentation outputs
        run: |
          git checkout -- public/app/boot/build-info.js build_info.json 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --quiet && exit 0
          git commit -m 'docs: refresh measured current-state claims for PR178'
          git push origin HEAD:acs-v2/brief-thousands-area-questions-20260916
