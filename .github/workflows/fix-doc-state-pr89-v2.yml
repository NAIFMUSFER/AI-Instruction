name: PR89 repair partial-browser documentation measurement

on:
  push:
    branches:
      - release/production-supabase-auth-ui
    paths:
      - '.github/workflows/fix-doc-state-pr89-v2.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/production-supabase-auth-ui
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repair guard, regression, and measured claims
        run: |
          python3 - <<'PY'
          from pathlib import Path

          guard = Path('tools/check_doc_claims.py')
          text = guard.read_text(encoding='utf-8')
          needle = (
              "    text = proc.stdout.decode('utf-8', 'replace')\n"
              "    if proc.returncode != 0:\n"
              "        tail = ' | '.join(text.strip().splitlines()[-3:])[:240]\n"
              "        return None, 'suite exited %d: %s' % (proc.returncode, tail)\n"
              "    best = None\n"
          )
          replacement = (
              "    text = proc.stdout.decode('utf-8', 'replace')\n"
              "    if proc.returncode != 0:\n"
              "        tail = ' | '.join(text.strip().splitlines()[-3:])[:240]\n"
              "        return None, 'suite exited %d: %s' % (proc.returncode, tail)\n"
              "    # A summary that explicitly marks its live layer NOT VERIFIED is a\n"
              "    # partial measurement. Do not let --fix promote its static count to\n"
              "    # a claim about the full browser suite. Separate scope notes remain\n"
              "    # allowed; only a measurement summary carrying the qualifier skips.\n"
              "    partial = re.search(\n"
              "        r'(?m)^[^\\n]*(?:passed|failed)[^\\n]*NOT VERIFIED — EXTERNAL ENVIRONMENT REQUIRED[^\\n]*$',\n"
              "        text)\n"
              "    if partial:\n"
              "        return None, 'SKIP: الحزمة أعلنت قياساً جزئياً بلا طبقتها الحيّة'\n"
              "    best = None\n"
          )
          assert text.count(needle) == 1, 'guard insertion point drifted'
          guard.write_text(text.replace(needle, replacement), encoding='utf-8')

          test = Path('tests/remediation/test_doc_claims.py')
          text = test.read_text(encoding='utf-8')
          anchor = "    def test_unparseable_success_is_not_a_measurement(self):\n"
          addition = (
              "    def test_partial_live_summary_cannot_supply_a_documented_count(self):\n"
              "        count, error = self.measure_script(\n"
              "            \"print('PANEL ENTRY: 14 passed, 0 failed  (الطبقة الحيّة: NOT VERIFIED — EXTERNAL ENVIRONMENT REQUIRED)')\\n\")\n"
              "        self.assertIsNone(count)\n"
              "        self.assertIn('SKIP:', error)\n\n"
          )
          assert text.count(anchor) == 1, 'test insertion point drifted'
          test.write_text(text.replace(anchor, addition + anchor), encoding='utf-8')

          doc = Path('KNOWN-ISSUES.md')
          text = doc.read_text(encoding='utf-8')
          live_old = 'tests/remediation/test_panel_entry.js — 14 assertions, up from 29, in real'
          live_new = 'tests/remediation/test_panel_entry.js — 37 assertions, up from 29, in real'
          hist_old = '`tests/remediation/test_panel_entry.js` — 14 assertions as of F-27, in real'
          hist_new = '`tests/remediation/test_panel_entry.js` — 29 assertions as of F-27, in real'
          assert text.count(live_old) == 1, 'live panel claim drifted'
          assert text.count(hist_old) == 1, 'historical panel claim drifted'
          doc.write_text(text.replace(live_old, live_new).replace(hist_old, hist_new), encoding='utf-8')
          PY
      - name: Focused regression
        run: python3 -m unittest tests.remediation.test_doc_claims -v
      - name: Commit audited repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/check_doc_claims.py tests/remediation/test_doc_claims.py KNOWN-ISSUES.md
          git diff --cached --check
          git commit -m 'CI: reject partial browser doc measurements'
          git push origin HEAD:release/production-supabase-auth-ui
