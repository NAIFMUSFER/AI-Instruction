name: MASAR read-only rooms and schedules
on:
  push:
    branches: ['audit/masar-customer-journey-20260908']
    paths: ['masar-studio/**', '.github/workflows/masar-room-review.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: masar-room-review-quality
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build committed standalone and all engine server and security tests
        working-directory: masar-studio
        run: |
          mkdir -p test-output/room-review
          git rev-parse HEAD > test-output/room-review/tested-commit.txt
          npm ci --ignore-scripts && npm run check && npm run build
          npm test > test-output/room-review/node.log 2>&1 || { grep -A 45 '^not ok' test-output/room-review/node.log; tail -15 test-output/room-review/node.log; exit 1; }
          tail -12 test-output/room-review/node.log
          cd render-viewer && npm ci --include=dev && npm run build
      - name: Install exact customer browser and IFC test environments
        run: |
          python -m pip install playwright==1.62.0 pillow==11.3.0 ifcopenshell==0.8.5 pytest==8.4.2 > /tmp/masar-pip.log 2>&1 || { tail -80 /tmp/masar-pip.log; exit 1; }
          python -m playwright install --with-deps chromium firefox webkit > /tmp/masar-browser.log 2>&1 || { tail -80 /tmp/masar-browser.log; exit 1; }
      - name: Real room search selected-floor SVG report downloads and immutable histories
        working-directory: masar-studio
        run: |
          MASAR_BROWSER=chromium python tests/room_review_browser.py
          MASAR_BROWSER=webkit python tests/room_review_browser.py
      - name: Preserve inspection layout quality legacy recovery and full customer text journeys
        working-directory: masar-studio
        run: |
          MASAR_BROWSER=chromium python tests/plan_inspection_browser.py
          MASAR_BROWSER=webkit python tests/plan_inspection_browser.py
          MASAR_BROWSER=chromium python tests/layout_quality_browser.py
          MASAR_BROWSER=webkit python tests/layout_quality_browser.py
          MASAR_BROWSER=chromium python tests/visual_source_browser.py
          MASAR_BROWSER=webkit python tests/visual_source_browser.py
          MASAR_BROWSER=chromium python tests/acceptance_chalet.py
          MASAR_BROWSER=webkit python tests/acceptance_chalet.py
      - name: Original HTTP offline three-engine standalone and IFC gates
        working-directory: masar-studio
        run: |
          MASAR_BROWSER=chromium python tests/browser_http.py
          MASAR_BROWSER=firefox python tests/browser_http.py
          MASAR_BROWSER=webkit python tests/browser_http.py
          python tests/browser_flows.py
          node tests/ifc-fixtures.mjs
          python tests/ifc_external.py
      - name: Preserve actual results only; this job never commits or deploys
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masar-room-review-ci
          path: |
            masar-studio/test-output/room-review/
            masar-studio/test-output/plan-inspection/*/report.json
            masar-studio/test-output/layout-quality-ui/*/report.json
            masar-studio/test-output/visual-source/*/report.json
            masar-studio/test-output/customer-ui/*report.json
            masar-studio/test-output/browser-http-*/report.json
            masar-studio/test-output/ifc/independent-report.json
            masar-studio/docs/browser-tests.json
          retention-days: 14
          if-no-files-found: error
