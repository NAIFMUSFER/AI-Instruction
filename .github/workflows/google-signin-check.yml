name: Google sign-in
on:
  pull_request:
    paths:
      - 'acs_auth_gateway.py'
      - 'public/index.html'
      - 'public/app/boot/engine-guard.js'
      - 'public/app/styles/app.css'
      - 'tests/remediation/test_auth_gateway.py'
      - 'tests/remediation/test_auth_session.js'
      - 'tests/remediation/test_auth_shipped_page.cjs'
      - '.github/workflows/google-signin-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: google-signin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Auth session and gateway contracts
        run: |
          node tests/remediation/test_auth_session.js
          python3 tests/remediation/test_auth_gateway.py
      - name: Build shipped frontend
        run: bash tools/netlify-build.sh
      - name: Generate deterministic measurement artifacts
        run: |
          python3 tools/bundle_report.py
          python3 tools/check_doc_claims.py --fix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: measured-frontend-artifacts
          path: |
            tests/performance/bundle_report.json
            KNOWN-ISSUES.md
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Google redirect and existing account UI on desktop and mobile
        run: node tests/remediation/test_auth_shipped_page.cjs
