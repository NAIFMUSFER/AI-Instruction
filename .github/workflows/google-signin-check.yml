name: Google sign-in
on:
  pull_request:
    paths:
      - 'acs_auth_gateway.py'
      - 'public/index.html'
      # Auth's shipped-page check also executes the real guest journey. Include
      # its transitive browser modules, rather than only the original guard.
      - 'public/app/**'
      - 'tools/frontend_local.txt'
      - 'tests/remediation/test_auth_gateway.py'
      - 'tests/remediation/test_auth_session.js'
      - 'tests/remediation/test_auth_shipped_page.cjs'
      - 'tests/remediation/test_auth_fixture_waits.cjs'
      - 'tests/remediation/test_guest_workspace.cjs'
      - 'tests/remediation/test_guest_roof_parity.py'
      - 'tests/remediation/guest_roof_parity.mjs'
      - 'tests/remediation/test_guest_roof_integration.cjs'
      - '.github/workflows/google-signin-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: google-signin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Auth session and gateway contracts
        run: |
          node tests/remediation/test_auth_session.js
          node tests/remediation/test_auth_fixture_waits.cjs
          python3 tests/remediation/test_auth_gateway.py
      - name: Build shipped frontend
        run: bash tools/netlify-build.sh
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Google redirect and existing account UI on desktop and mobile
        run: node tests/remediation/test_auth_shipped_page.cjs
      - name: Retain masked synthetic auth failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-auth-failure-${{ github.run_id }}
          path: |
            logs/auth-failure-*.json
            logs/auth-failure-*.png
            logs/guest-diagnostics/*.json
          if-no-files-found: ignore
          retention-days: 14
