name: Plan Review scorecard disclosures
on:
  pull_request:
    paths:
      - 'public/plan-review/review.mjs'
      - 'tests/remediation/test_plan_review_scorecard_disclosures.cjs'
      - '.github/workflows/plan-review-scorecard-disclosures.yml'
permissions:
  contents: read
concurrency:
  group: plan-review-scorecard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  disclosure-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Measured scorecard labels and unavailable-reason contract
        run: node tests/remediation/test_plan_review_scorecard_disclosures.cjs
      - name: No generated diff
        run: git diff --exit-code
