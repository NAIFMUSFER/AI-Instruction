name: One-shot measured documentation state sync
on:
  push:
    branches: [feature/workspace-viewport-selection-v2]
permissions:
  contents: write
jobs:
  sync:
    if: github.ref == 'refs/heads/feature/workspace-viewport-selection-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/workspace-viewport-selection-v2
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Regenerate measured source snapshot with repository tools
        run: |
          set -euo pipefail
          python3 tools/bundle_report.py
          python3 - <<'PY'
          import tools.check_doc_claims as c
          ok, msg = c.check_state(fix=True)
          print(msg)
          if not ok:
              raise SystemExit(1)
          PY
          git diff -- KNOWN-ISSUES.md tests/performance/bundle_report.json
      - name: Commit only generated measurements and remove this one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'acs-ci-doc-sync'
          git config user.email 'actions@users.noreply.github.com'
          git add KNOWN-ISSUES.md tests/performance/bundle_report.json
          git rm .github/workflows/one-shot-doc-state-sync.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No measured documentation change required.'
            exit 0
          fi
          git commit -m 'docs(measured): regenerate current source-state snapshot'
          git push origin HEAD:feature/workspace-viewport-selection-v2
