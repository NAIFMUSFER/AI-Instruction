name: Firebase phone check UI
on:
  pull_request:
    paths:
      - 'public/firebase-check/**'
      - 'tests/remediation/test_firebase_phone_check.cjs'
      - '.github/workflows/firebase-phone-check.yml'
      - 'netlify.toml'
permissions:
  contents: read
jobs:
  phone-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node tests/remediation/test_firebase_phone_check.cjs
