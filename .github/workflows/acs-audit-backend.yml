name: ACS backend audit contracts
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acs-audit-backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACS_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned runtime dependencies
        run: python -m pip install --require-hashes -r requirements.lock -r requirements-dev.txt
      - name: Provider failure, usage and corpus regression contracts
        run: |
          mkdir -p logs
          bash tools/ci_run.sh --log logs/backend-audit.log --label backend-audit --runner python3 \
            tests/remediation/test_audit_backend_provider.py \
            tests/remediation/test_audit_backend_corpus.py \
            tests/remediation/test_provider_integration.py \
            tests/remediation/test_provider_accounting.py \
            tests/remediation/test_provider_reject.py \
            tests/remediation/test_multi_provider.py \
            tests/remediation/test_autofix_propose_boundary.py \
            tests/remediation/test_rule_source_boundary.py
      - name: Ensure checks leave tracked files unchanged
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: acs-backend-audit-logs
          path: logs/
          retention-days: 7
