name: Plan-first generic role-area constraints
on:
  pull_request:
    paths:
      - 'acs_plan_review.py'
      - 'acs_plan_scorecard.py'
      - 'tests/remediation/test_plan_role_area_constraints.py'
      - '.github/workflows/plan-role-area-constraints.yml'
permissions:
  contents: read
concurrency:
  group: plan-role-area-constraints-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile role-area Program contracts
        run: python -m py_compile acs_plan_review.py acs_plan_scorecard.py tests/remediation/test_plan_role_area_constraints.py
      - name: Generic measured role-area constraint regressions
        env:
          ACS_ENV: test
          ANTHROPIC_API_KEY: dummy
        run: python -S tests/remediation/test_plan_role_area_constraints.py
      - name: No generated diff
        run: git diff --exit-code
