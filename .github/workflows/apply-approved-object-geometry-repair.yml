name: Apply approved object geometry repair

on:
  push:
    branches: [audit/approved-object-geometry-v2]
    paths:
      - .github/workflows/apply-approved-object-geometry-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/approved-object-geometry-v2
          fetch-depth: 0
      - name: Apply audited repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          handoff = Path('tools/acs_plan_handoff.py')
          text = handoff.read_text(encoding='utf-8')
          marker = '''def _is_finite_number(value: object) -> bool:\n    return type(value) in (int, float) and math.isfinite(value)\n\n\n'''
          if marker not in text:
              raise SystemExit('handoff helper anchor missing')
          if 'def _require_explicit_object_geometry' in text:
              raise SystemExit('generic object repair already present')
          insert = '''def _require_explicit_object_geometry(building: dict) -> None:\n    \"\"\"Prevent approved 3D from inventing shared room.objects geometry.\"\"\"\n    floors = building.get(\"floors\")\n    if not isinstance(floors, dict):\n        return  # PlanWorkspace owns the top-level model contract.\n    panel_kinds = {\n        \"tv\", \"rug\", \"curtain\", \"sign\",\n        \"شاشة\", \"تلفزيون\", \"سجادة\", \"ستارة\", \"لوحة\",\n    }\n    for template, floor in floors.items():\n        if not isinstance(floor, dict) or not isinstance(floor.get(\"rooms\"), list):\n            continue\n        for room in floor[\"rooms\"]:\n            if not isinstance(room, dict) or \"objects\" not in room:\n                continue\n            objects = room.get(\"objects\")\n            if not isinstance(objects, list):\n                continue  # Existing provenance admission owns malformed collection shapes.\n            for index, obj in enumerate(objects):\n                where = f\"{template}/{room.get('id')}/objects/{index}\"\n                if not isinstance(obj, dict):\n                    continue  # Existing provenance admission owns malformed entries.\n                required = (\"kind\", \"x\", \"z\", \"y\", \"w\", \"d\", \"h\", \"count\", \"pitch\", \"dir\")\n                missing = [key for key in required if key not in obj]\n                if missing:\n                    raise PlanError(\n                        \"DOWNSTREAM_GEOMETRY_NOT_SPECIFIED\",\n                        f\"Approved object geometry is missing {','.join(missing)} at {where}\",\n                    )\n                kind = obj[\"kind\"]\n                if not isinstance(kind, str) or not kind.strip():\n                    raise PlanError(\"DOWNSTREAM_GEOMETRY_INVALID\", f\"Object kind is invalid at {where}\")\n                if obj[\"dir\"] not in {\"x\", \"z\"}:\n                    raise PlanError(\"DOWNSTREAM_GEOMETRY_INVALID\", f\"Object direction is invalid at {where}\")\n                for key in (\"x\", \"z\", \"y\"):\n                    if not _is_finite_number(obj[key]):\n                        raise PlanError(\n                            \"DOWNSTREAM_GEOMETRY_INVALID\",\n                            f\"Object {key} must be an explicit finite number at {where}\",\n                        )\n                for key in (\"w\", \"d\", \"h\", \"pitch\"):\n                    value = obj[key]\n                    if not _is_finite_number(value) or value <= 0:\n                        raise PlanError(\n                            \"DOWNSTREAM_GEOMETRY_INVALID\",\n                            f\"Object {key} must be an explicit positive finite number at {where}\",\n                        )\n                count = obj[\"count\"]\n                if type(count) is not int or not 1 <= count <= 200:\n                    raise PlanError(\n                        \"DOWNSTREAM_GEOMETRY_INVALID\",\n                        f\"Approved object count would be changed by the 3D compiler at {where}\",\n                    )\n                if kind.strip().lower() in panel_kinds:\n                    if \"height\" not in obj:\n                        raise PlanError(\n                            \"DOWNSTREAM_GEOMETRY_NOT_SPECIFIED\",\n                            f\"Approved panel object vertical position is missing height at {where}\",\n                        )\n                    height = obj[\"height\"]\n                    if not _is_finite_number(height) or height < 0:\n                        raise PlanError(\n                            \"DOWNSTREAM_GEOMETRY_INVALID\",\n                            f\"Panel object height must be an explicit non-negative finite number at {where}\",\n                        )\n\n\n'''
          text = text.replace(marker, marker + insert, 1)
          call_anchor = '''    building = json.loads(canonical(handoff.get(\"building\")))\n    _require_explicit_warehouse_rack_geometry(building)\n'''
          if call_anchor not in text:
              raise SystemExit('compile handoff anchor missing')
          text = text.replace(
              call_anchor,
              '''    building = json.loads(canonical(handoff.get(\"building\")))\n    _require_explicit_object_geometry(building)\n    _require_explicit_warehouse_rack_geometry(building)\n''',
              1,
          )
          handoff.write_text(text, encoding='utf-8')

          tests = Path('tests/remediation/test_plan_handoff_object_geometry.py')
          t = tests.read_text(encoding='utf-8')
          old = '''    def test_nonfinite_or_nonpositive_geometry_fails_before_3d(self):\n        for field, value in ((\"x\", float(\"inf\")), (\"z\", float(\"nan\")),\n                             (\"w\", 0.0), (\"d\", -1.0), (\"h\", 0.0), (\"pitch\", 0.0)):\n            with self.subTest(field=field, value=value):\n                model = residential_model()\n                self.obj(model)[field] = value\n                self.assertFailsBeforeCompiler(model, expected=\"DOWNSTREAM_GEOMETRY_INVALID\")\n\n    def test_panel_vertical_position_must_be_explicit(self):\n        model = residential_model()\n        obj = self.obj(model)\n        obj[\"kind\"] = \"tv\"\n        obj[\"w\"], obj[\"d\"], obj[\"h\"] = 1.3, 0.08, 0.75\n        # Current compiler otherwise invents a panel height of 1.35 m.\n        self.assertFailsBeforeCompiler(model)\n'''
          new = '''    def test_nonfinite_geometry_is_already_rejected_before_approval(self):\n        for field, value in ((\"x\", float(\"inf\")), (\"z\", float(\"nan\"))):\n            with self.subTest(field=field, value=value):\n                model = residential_model()\n                self.obj(model)[field] = value\n                self.assertCode(\"NON_FINITE\", lambda: workspace(model))\n\n    def test_nonpositive_geometry_fails_before_3d(self):\n        for field, value in ((\"w\", 0.0), (\"d\", -1.0), (\"h\", 0.0), (\"pitch\", 0.0)):\n            with self.subTest(field=field, value=value):\n                model = residential_model()\n                self.obj(model)[field] = value\n                self.assertFailsBeforeCompiler(model, expected=\"DOWNSTREAM_GEOMETRY_INVALID\")\n\n    def test_panel_vertical_position_must_be_explicit(self):\n        for kind in (\"tv\", \"rug\", \"curtain\", \"sign\"):\n            with self.subTest(kind=kind):\n                model = residential_model()\n                obj = self.obj(model)\n                obj[\"kind\"] = kind\n                obj[\"w\"], obj[\"d\"], obj[\"h\"] = 1.3, 0.08, 0.75\n                # Current compiler otherwise invents a panel vertical position.\n                self.assertFailsBeforeCompiler(model)\n'''
          if old not in t:
              raise SystemExit('test correction anchor missing')
          tests.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile tools/acs_plan_handoff.py tests/remediation/test_plan_handoff_object_geometry.py
          python tests/remediation/test_plan_handoff_object_geometry.py
          git diff --check
      - name: Commit repair and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-approved-object-geometry-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/acs_plan_handoff.py tests/remediation/test_plan_handoff_object_geometry.py .github/workflows/apply-approved-object-geometry-repair.yml
          git commit -m "fix(plan-v2): fail closed on approved generic object defaults"
          git push origin HEAD:audit/approved-object-geometry-v2
