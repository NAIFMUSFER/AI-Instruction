name: Plan-first registered typology lifecycle
on:
  pull_request:
    paths:
      - 'acs_programs.json'
      - 'acs_plan_review.py'
      - 'acs_plan_scorecard.py'
      - 'acs_plan_projection.py'
      - 'acs_plan_lock_binding.py'
      - 'tools/acs_plan_handoff.py'
      - 'tests/remediation/test_plan_typology_lifecycle.py'
      - '.github/workflows/plan-typology-lifecycle.yml'
permissions:
  contents: read
concurrency:
  group: plan-typology-lifecycle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Every registered typology obeys approval-first Frozen Baseline handoff
        run: |
          set -o pipefail
          mkdir -p logs
          python -S tests/remediation/test_plan_typology_lifecycle.py 2>&1 | tee logs/plan-typology-lifecycle.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plan-typology-lifecycle-log
          path: logs/
          retention-days: 7
