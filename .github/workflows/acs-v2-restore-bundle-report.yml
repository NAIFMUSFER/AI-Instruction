name: ACS v2 restore committed bundle report

on:
  push:
    branches:
      - acs-v2/connected-property-lock-ui-20260915-r2

permissions:
  contents: write

jobs:
  restore:
    if: github.repository == 'NAIFMUSFER/AI-Instruction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acs-v2/connected-property-lock-ui-20260915-r2
          fetch-depth: 0
      - name: Restore committed report from current production main
        run: |
          git fetch origin main
          git checkout origin/main -- tests/performance/bundle_report.json
          git add tests/performance/bundle_report.json
          if git diff --cached --quiet; then
            echo 'Committed report already matches production main.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(acs-v2): keep committed bundle report baseline stable'
          git push origin HEAD:acs-v2/connected-property-lock-ui-20260915-r2
