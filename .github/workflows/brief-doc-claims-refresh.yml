name: ACS PR178 measured doc claims refresh
on:
  push:
    branches: [acs-v2/brief-thousands-area-questions-20260916]
    paths: [.github/workflows/brief-doc-claims-refresh.yml, tools/brief-doc-claims-refresh.trigger]
permissions: {contents: write}
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: acs-v2/brief-thousands-area-questions-20260916, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - name: Measure source bundle before provenance stamping
        run: python3 tools/bundle_report.py
      - name: Install pinned dependencies used by measured suites
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Refresh and verify measured documentation
        run: |
          python3 tools/check_doc_claims.py --fix
          python3 tools/check_doc_claims.py
      - name: Commit only generated measurements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.md' tests/performance/bundle_report.json
          if git diff --cached --quiet; then
            echo 'No measured documentation drift remains.'
            exit 0
          fi
          git commit -m 'docs: refresh measured current-state claims for PR178'
          git push origin HEAD:acs-v2/brief-thousands-area-questions-20260916
