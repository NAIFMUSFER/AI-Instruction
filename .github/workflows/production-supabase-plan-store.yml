name: Production Supabase durable plan store

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'tests/remediation/test_supabase_plan_store_schema.py'
      - 'tests/remediation/test_plan_rpc_membership_postgres.py'
      - 'tests/remediation/test_one_running_job_postgres.py'
      - '.github/workflows/production-supabase-plan-store.yml'

permissions:
  contents: read

jobs:
  durable-plan-store:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile contract
        run: python -m py_compile tests/remediation/test_supabase_plan_store_schema.py
      - name: Verify immutable owner-scoped Supabase schema
        run: python tests/remediation/test_supabase_plan_store_schema.py
      - name: Plan RPCs deny non-members on real PostgreSQL
        # Missing PostgreSQL fails this step (exit 1); it is never reported as skipped.
        env:
          PG_BINDIR: /usr/lib/postgresql/16/bin
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$PG_BINDIR/postgres" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-16
          fi
          python tests/remediation/test_plan_rpc_membership_postgres.py
          python tests/remediation/test_one_running_job_postgres.py
      - name: No generated diff
        run: git diff --exit-code
