name: Production Supabase durable plan store

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260912_acs_plan_store_v2.sql'
      - 'tests/remediation/test_supabase_plan_store_schema.py'
      - '.github/workflows/production-supabase-plan-store.yml'

permissions:
  contents: read

jobs:
  durable-plan-store:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile contract
        run: python -m py_compile tests/remediation/test_supabase_plan_store_schema.py
      - name: Verify immutable owner-scoped Supabase schema
        run: python tests/remediation/test_supabase_plan_store_schema.py
      - name: No generated diff
        run: git diff --exit-code
