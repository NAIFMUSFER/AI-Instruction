name: Apply Plan-first HTTP boundary once

on:
  push:
    branches:
      - release/plan-http-command-boundary-v2
    paths:
      - '.github/workflows/apply-plan-http-boundary-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Register the authenticated boundary in the production ASGI app
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('acs_understand_api.py')
          text = path.read_text(encoding='utf-8')

          import_old = 'import acs_async_jobs as ASYNC_JOBS\n'
          import_new = import_old + 'import acs_plan_http as PLAN_HTTP\n'
          if 'import acs_plan_http as PLAN_HTTP' not in text:
              if text.count(import_old) != 1:
                  raise SystemExit('expected exactly one async-jobs import anchor')
              text = text.replace(import_old, import_new, 1)

          middleware_old = 'app.add_middleware(ASYNC_JOBS.AsyncGenerationMiddleware)\napp.add_middleware(\n    CORSMiddleware,'
          middleware_new = ('app.add_middleware(PLAN_HTTP.PlanCommandMiddleware)\n'
                            'app.add_middleware(ASYNC_JOBS.AsyncGenerationMiddleware)\n'
                            'app.add_middleware(\n    CORSMiddleware,')
          if 'app.add_middleware(PLAN_HTTP.PlanCommandMiddleware)' not in text:
              if text.count(middleware_old) != 1:
                  raise SystemExit('expected exactly one middleware registration anchor')
              text = text.replace(middleware_old, middleware_new, 1)

          if text.count('import acs_plan_http as PLAN_HTTP') != 1:
              raise SystemExit('Plan HTTP import count is not exactly one')
          if text.count('app.add_middleware(PLAN_HTTP.PlanCommandMiddleware)') != 1:
              raise SystemExit('Plan HTTP middleware count is not exactly one')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify focused source invariants
        run: |
          python -m py_compile acs_plan_http.py acs_understand_api.py tests/remediation/test_plan_http_command_boundary.py
          python - <<'PY'
          from pathlib import Path
          text = Path('acs_understand_api.py').read_text(encoding='utf-8')
          assert text.count('import acs_plan_http as PLAN_HTTP') == 1
          assert text.count('app.add_middleware(PLAN_HTTP.PlanCommandMiddleware)') == 1
          docker = Path('Dockerfile').read_text(encoding='utf-8')
          assert 'acs_plan_http.py' in docker
          print('Plan-first HTTP production registration source proof: PASS')
          PY
      - name: Commit audited registration and self-remove
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-plan-http-boundary-once.yml
          git add acs_understand_api.py
          git diff --cached --check
          git commit -m 'feat: register authenticated Plan-first HTTP boundary'
          git push origin HEAD:release/plan-http-command-boundary-v2
