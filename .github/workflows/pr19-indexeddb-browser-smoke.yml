name: PR19 IndexedDB design-version browser smoke

on:
  push:
    branches:
      - audit/live-async-smoke-20260911

permissions:
  contents: read

jobs:
  indexeddb:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a66871a217b53179062928bba04aa7f259c14893
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked browser and build shipped frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          bash tools/netlify-build.sh
      - name: Prove saved design versions survive a real Chromium reload
        run: |
          cat > /tmp/idb-smoke.js <<'NODE'
          const fs=require('fs'),path=require('path'),http=require('http');
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const PUB=path.join(process.cwd(),'public');
          const MIME={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.mjs':'text/javascript; charset=utf-8','.css':'text/css; charset=utf-8','.json':'application/json','.png':'image/png','.svg':'image/svg+xml'};
          const srv=http.createServer((rq,rs)=>{
            const u=decodeURIComponent(rq.url.split('?')[0]);
            const p=path.normalize(path.join(PUB,u==='/'?'index.html':u));
            if(!p.startsWith(PUB)||!fs.existsSync(p)||fs.statSync(p).isDirectory()){rs.writeHead(404);rs.end();return;}
            rs.writeHead(200,{'Content-Type':MIME[path.extname(p)]||'application/octet-stream','X-Content-Type-Options':'nosniff'});
            fs.createReadStream(p).pipe(rs);
          });
          (async()=>{
            await new Promise(r=>srv.listen(0,'127.0.0.1',r));
            const url='http://127.0.0.1:'+srv.address().port+'/index.html';
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext();
            const pg=await ctx.newPage();
            const errors=[]; pg.on('pageerror',e=>errors.push(String(e)));
            await pg.goto(url,{waitUntil:'domcontentloaded'});
            await pg.waitForFunction(()=>window.ACS&&window.ACS.trustReady===true&&window.ACS.designVersions&&typeof window.ACS.setModel==='function',{timeout:30000});
            const fixtures=JSON.parse(fs.readFileSync(path.join(process.cwd(),'tests/phase3/fixtures/base_fixtures.json'),'utf8'));
            const model=fixtures.villa_glazed||fixtures.villa;
            if(!model) throw new Error('villa fixture absent');
            await pg.evaluate(m=>window.ACS.setModel(m),model);
            const before=await pg.evaluate(()=>window.ACS.designVersions.list());
            if(before.length!==0) throw new Error('expected clean version store, got '+before.length);
            const saved=await pg.evaluate(()=>window.ACS.designVersions.save());
            if(!saved||!saved.ok||saved.label!=='V1') throw new Error('save failed '+JSON.stringify(saved));
            const first=await pg.evaluate(()=>window.ACS.designVersions.list());
            if(first.length!==1||first[0].record_id!==saved.record_id) throw new Error('saved record not readable');
            await pg.reload({waitUntil:'domcontentloaded'});
            await pg.waitForFunction(()=>window.ACS&&window.ACS.trustReady===true&&window.ACS.designVersions,{timeout:30000});
            const afterReload=await pg.evaluate(()=>window.ACS.designVersions.list());
            if(afterReload.length!==1||afterReload[0].version_label!=='V1') throw new Error('version did not survive reload');
            const restored=await pg.evaluate(id=>window.ACS.designVersions.restore(id),saved.record_id);
            if(!restored||!restored.ok) throw new Error('restore failed '+JSON.stringify(restored));
            const restoredModel=await pg.evaluate(()=>window.ACS.exportModel());
            if(JSON.stringify(restoredModel)!==JSON.stringify(model)) throw new Error('restored model differs from saved model');
            const accepted=await pg.evaluate(id=>window.ACS.designVersions.accept(id),saved.record_id);
            if(!accepted||!accepted.ok) throw new Error('accept failed');
            const acceptedRows=await pg.evaluate(()=>window.ACS.designVersions.list());
            if(!acceptedRows[0]||acceptedRows[0].accepted!==true) throw new Error('accepted flag was not persisted');
            await pg.reload({waitUntil:'domcontentloaded'});
            await pg.waitForFunction(()=>window.ACS&&window.ACS.designVersions,{timeout:30000});
            const acceptedAfterReload=await pg.evaluate(()=>window.ACS.designVersions.list());
            if(!acceptedAfterReload[0]||acceptedAfterReload[0].accepted!==true) throw new Error('accepted flag did not survive reload');
            const removed=await pg.evaluate(id=>window.ACS.designVersions.remove(id),saved.record_id);
            if(!removed||!removed.ok) throw new Error('delete failed');
            const finalRows=await pg.evaluate(()=>window.ACS.designVersions.list());
            if(finalRows.length!==0) throw new Error('delete did not clear saved version');
            if(errors.length) throw new Error('page errors: '+errors.join(' | '));
            console.log('INDEXEDDB DESIGN VERSIONS: PASS — save/read/reload/restore/accept/reload/delete on real Chromium');
            await browser.close(); srv.close();
          })().catch(async e=>{console.error(e.stack||e); try{srv.close();}catch(_){} process.exit(1);});
          NODE
          node /tmp/idb-smoke.js
