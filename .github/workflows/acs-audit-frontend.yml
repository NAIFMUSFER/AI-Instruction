name: ACS frontend audit contracts

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Exercise frontend contracts and reject deliberate mutations
        env:
          ACS_ENV: test
        run: |
          node tests/remediation/test_audit_frontend_guards.js
          node tests/remediation/test_audit_frontend_brief.mjs
          node tests/remediation/test_audit_frontend_panels.js --mutations
          node tests/remediation/test_panel_entry.js
          node tests/remediation/test_accessibility.js
          node tests/remediation/test_module_graph.js
      - name: Keep generated architecture markup reproducible
        run: |
          python3 tools/build_archdetail_browser.py
          git diff --exit-code -- public/index.html public/app/generated/arch-detail.js public/app/generated/arch-detail-bridge.js public/app/styles/app.css
