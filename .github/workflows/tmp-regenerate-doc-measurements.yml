name: Temporary regenerate measured docs

on:
  push:
    branches:
      - feature/connected-brief-provenance-20260913

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/connected-brief-provenance-20260913
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies needed by measured suites
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          npm ci
      - name: Regenerate deterministic bundle report and current measured documentation
        env:
          ACS_ENV: test
          ANTHROPIC_API_KEY: dummy
        run: |
          python3 tools/bundle_report.py
          python3 tools/check_doc_claims.py --fix
          python3 tools/check_doc_claims.py
      - name: Commit only generated measurement evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add KNOWN-ISSUES.md tests/performance/bundle_report.json
          if git diff --cached --quiet; then
            echo 'No measured documentation drift to commit.'
            exit 0
          fi
          git commit -m 'Docs: regenerate measured frontend state'
          git push origin HEAD:feature/connected-brief-provenance-20260913
