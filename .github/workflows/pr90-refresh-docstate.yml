name: PR90 refresh measured source state

on:
  push:
    branches:
      - chore/acs-pr90-refresh-docstate-20260913

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regenerate measured bundle report
        run: python3 tools/bundle_report.py
      - name: Regenerate only the measured current-state block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tools.check_doc_claims as c

          path = Path(c.STATE_DOC)
          text = path.read_text(encoding='utf-8')
          start = text.index(c.STATE_BEGIN)
          end = text.index(c.STATE_END, start) + len(c.STATE_END)
          refreshed = text[:start] + c.render_state() + text[end:]
          path.write_text(refreshed, encoding='utf-8')
          PY
      - name: Commit exact measured artifacts when changed
        run: |
          if git diff --quiet -- KNOWN-ISSUES.md tests/performance/bundle_report.json; then
            echo 'Measured state already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add KNOWN-ISSUES.md tests/performance/bundle_report.json
          git commit -m 'docs(ci): refresh measured source state'
          git push origin HEAD:chore/acs-pr90-refresh-docstate-20260913
