name: MASAR customer quality repair
on:
  push:
    branches: ['audit/masar-customer-journey-20260908']
    paths: ['.github/workflows/masar-customer-fix.yml', '.masar-ops/customer-model-snippet.js', '.masar-ops/apply-customer-fix.py', 'masar-studio/tests/customer-*']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Apply reviewed patch only to the known source tree
        run: python .masar-ops/apply-customer-fix.py
      - name: Core and customer engineering acceptance, no skipped assertions
        working-directory: masar-studio
        run: |
          mkdir -p test-output/customer-after
          npm ci --ignore-scripts && npm run check && npm run build
          npm test > test-output/customer-after/node.log 2>&1 || { grep -A 45 -B 3 'not ok' test-output/customer-after/node.log; tail -15 test-output/customer-after/node.log; exit 1; }
          tail -12 test-output/customer-after/node.log
      - name: Persist exact tested runtime sources on audit branch only
        run: |
          test "$GITHUB_REF_NAME" = 'audit/masar-customer-journey-20260908'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add masar-studio/shared/model.js masar-studio/src/app.js masar-studio/src/style.css
          git diff --cached --check
          git commit -m 'fix(masar): respect explicit chalet intent and footprint; show modal validation errors'
          git push origin HEAD:audit/masar-customer-journey-20260908
          git rev-parse HEAD > masar-studio/test-output/customer-after/source-commit.txt
      - name: Install browser regression tools
        run: |
          python -m pip install playwright==1.62.0 > /tmp/pip.log 2>&1
          python -m playwright install --with-deps chromium webkit > /tmp/browser-install.log 2>&1 || { tail -80 /tmp/browser-install.log; exit 1; }
      - name: Original full stack browser regressions
        working-directory: masar-studio
        run: |
          MASAR_BROWSER=chromium python tests/browser_http.py
          MASAR_BROWSER=webkit python tests/browser_http.py
          python tests/browser_flows.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: masar-customer-quality-evidence
          path: |
            masar-studio/test-output/customer-after/
            masar-studio/test-output/browser-http-*/
            masar-studio/docs/browser-tests.json
          retention-days: 14
