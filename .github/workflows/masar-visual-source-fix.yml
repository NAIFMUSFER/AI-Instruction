name: MASAR visual source and safe recovery
on:
  push:
    branches: ['audit/masar-customer-journey-20260908']
    paths: ['.github/workflows/masar-visual-source-fix.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: masar-visual-source-repair
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Apply only hash-verified changes to the known application source
        run: |
          test "$GITHUB_REF" = 'refs/heads/audit/masar-customer-journey-20260908'
          python - <<'PY'
          from pathlib import Path
          import hashlib,base64,zlib,subprocess,json
          root=Path('masar-studio')
          before={'shared/model.js':'47e1e6e81103ea29f21e70f9fa83ffb8e6b0be5a902e9de42d569cfac380428e','src/render-ui.js':'14e26a947c0a953f77c770a7066ff42419af7fadc5d32d9ec36b85ce056e6d65','src/app.js':'fae4310ec6936d7756aa2140d6acb0b8a9d985cba418b7c79f622b4f2b4f2615','src/style.css':'ba4a99f466514ce1fc51402a745d35ecdadfd7bdefe76adf25699888bdc2022e','public/sw.js':'31912a258a8154a249fad3443e919abf013d89e0f2ba4f200de20974af9e433f'}
          after={'shared/model.js':'6f56d57fa56f56719ee260ed59e875aa00e6cc841f51381811e1ded6a29bc716','src/render-ui.js':'8f20b8b5352024b43ee2f4662faec9aa25f54da92504eb034f769d186c0ef52d','src/app.js':'721b2318475acb77b683c8d1ed7bf2bb4b6240d9037695bfa3fc9897d4ab40ac','src/style.css':'e9bbc57dfc48aeab82465b40e61278031f83df9328e1251a281f3c04fdf5649e','public/sw.js':'bbfc94bbfc31afb4463ae1810e367e0a298eb02dcf8257c8b5765f49a21d6ce1','tests/fixtures/legacy-chalet-source.json':'034b27baccdaba9cc78bb3790a53d86b8c59a23f2bb3904c5ead882c53a79b41','tests/visual-source.test.mjs':'eb62ad3f3cc1f9f33f0bd8569412683d41036cb58d09f8e98b493e40cdffe53c','tests/visual_source_browser.py':'2afa518250997eb1e3b020bd591af38db134ef439d44d7a3f689b2d87ebc8c15'}
          digest=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          for name,value in before.items():assert digest(root/name)==value,'Source changed: '+name
          parts=sorted(Path('.masar-ops/visual-source-20260909').glob('part-*'));assert len(parts)==3
          patch=zlib.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts)))
          assert hashlib.sha256(patch).hexdigest()=='d18cabe312d2a688cdbacb92528a47e97bef925cfa6ec63afb0766d4792a5a10','Patch digest mismatch'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          for name,value in after.items():assert digest(root/name)==value,'Patched bytes differ: '+name
          out=root/'test-output/visual-source';out.mkdir(parents=True,exist_ok=True)
          (out/'verified-source-hashes.json').write_text(json.dumps(after,indent=2))
          compile((root/'tests/visual_source_browser.py').read_text(),'visual_source_browser.py','exec')
          PY
      - name: Build and run every Node regression including the legacy fixture
        working-directory: masar-studio
        run: |
          npm ci --ignore-scripts && npm run check && npm run build
          npm test > test-output/visual-source/node.log 2>&1 || { tail -120 test-output/visual-source/node.log; exit 1; }
          tail -12 test-output/visual-source/node.log
          cd render-viewer && npm ci --include=dev && npm run build
      - name: Install pinned browsers
        run: |
          python -m pip install playwright==1.62.0 pillow==11.3.0 > /tmp/masar-pip.log 2>&1 || { tail -80 /tmp/masar-pip.log; exit 1; }
          python -m playwright install --with-deps chromium firefox webkit > /tmp/masar-browsers.log 2>&1 || { tail -80 /tmp/masar-browsers.log; exit 1; }
      - name: New source-identity and restored-project journeys
        working-directory: masar-studio
        run: |
          MASAR_BROWSER=chromium python tests/visual_source_browser.py
          MASAR_BROWSER=webkit python tests/visual_source_browser.py
      - name: Preserve original full-description acceptance and original browser regressions
        working-directory: masar-studio
        run: |
          MASAR_BROWSER=chromium python tests/acceptance_chalet.py
          MASAR_BROWSER=webkit python tests/acceptance_chalet.py
          MASAR_BROWSER=chromium python tests/browser_http.py
          MASAR_BROWSER=firefox python tests/browser_http.py
          MASAR_BROWSER=webkit python tests/browser_http.py
          python tests/browser_flows.py
      - name: Commit verified application files only and remove completed transport
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add masar-studio/shared/model.js masar-studio/src/render-ui.js masar-studio/src/app.js masar-studio/src/style.css masar-studio/public/sw.js masar-studio/tests/fixtures/legacy-chalet-source.json masar-studio/tests/visual-source.test.mjs masar-studio/tests/visual_source_browser.py
          git rm .masar-ops/visual-source-20260909/part-001 .masar-ops/visual-source-20260909/part-002 .masar-ops/visual-source-20260909/part-003
          git diff --cached --check
          git commit -m 'fix(masar): expose actual visualization source and recover generic chalet layouts without data loss'
          git push origin HEAD:audit/masar-customer-journey-20260908
          git rev-parse HEAD > masar-studio/test-output/visual-source/runtime-commit.txt
      - name: Preserve evidence even on an assertion failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masar-visual-source-evidence
          path: |
            masar-studio/test-output/visual-source/
            masar-studio/test-output/customer-ui/
            masar-studio/test-output/browser-http-*/report.json
            masar-studio/docs/browser-tests.json
          retention-days: 14
          if-no-files-found: error
