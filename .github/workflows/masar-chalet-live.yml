name: MASAR corrected chalet live acceptance
on:
  push:
    branches: ['ops/masar-quality-live-20260908']
    paths: ['.github/workflows/masar-chalet-live.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: masar-quality-live
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      MASAR_AUDIT_URL: https://masar-quality-preview.onrender.com
      MASAR_AUDIT_COMMIT: deeebae4b548c46b446692e57a20c3818fe645a5
      MASAR_ENGINEER_OUT: quality-live/engineer
      MASAR_EVIDENCE_DIR: quality-live/option-a
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned browsers
        run: |
          python -m pip install playwright==1.62.0 pillow==11.3.0 > /tmp/pip.log 2>&1 || { tail -80 /tmp/pip.log; exit 1; }
          python -m playwright install --with-deps chromium webkit > /tmp/browsers.log 2>&1 || { tail -80 /tmp/browsers.log; exit 1; }
      - name: Wait for the exact approved revision, not just any responding server
        run: |
          python - <<'PY'
          import os,time,json,urllib.request
          from pathlib import Path
          base=os.environ['MASAR_AUDIT_URL'];expected=os.environ['MASAR_AUDIT_COMMIT'];out=Path('quality-live');out.mkdir()
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(base+'/api/version',timeout=15) as r:v=json.load(r)
                  assert v['commit']==expected,(v['commit'],expected)
                  (out/'published-version.json').write_text(json.dumps(v,indent=2));print('PASS published revision',v);break
              except Exception as e:
                  if attempt==11:raise
                  print('Waiting for approved deployment:',type(e).__name__,flush=True);time.sleep(5)
          PY
      - name: Original full client description on mobile and desktop Chromium and WebKit
        working-directory: masar-studio
        run: python tests/browser_chalet.py --base "$MASAR_AUDIT_URL"
      - name: Engineer examines real exported rooms, previews, revisions, invalid edits and material output
        run: python .masar-ops/chalet-engineer.py
      - name: Repeat previous published option-A capabilities and privacy checks on new service
        run: |
          git fetch --depth=1 origin refs/heads/ops/masar-blender-preview-a-20260908
          git show FETCH_HEAD:.masar-ops/blender-preview-a.py > /tmp/masar-option-a.py
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path('/tmp/masar-option-a.py');s=p.read_text()
          old="BASE='https://masar-blender-preview.onrender.com'";assert s.count(old)==1
          s=s.replace(old,'BASE='+repr(os.environ['MASAR_AUDIT_URL']))
          old="COMMIT='23bf68db1eba2dbb8863642b54c5c0c83613cc00'";assert s.count(old)==1
          s=s.replace(old,'COMMIT='+repr(os.environ['MASAR_AUDIT_COMMIT']));p.write_text(s)
          PY
          python /tmp/masar-option-a.py
      - name: Assemble count summary and publish only non-sensitive QA images and reports on ops branch
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,shutil,os,hashlib
          out=Path('quality-live');customer=Path('masar-studio/test-output/chalet-acceptance')
          shutil.copytree(customer,out/'customer',dirs_exist_ok=True)
          c=json.loads((customer/'report.json').read_text());e=json.loads((out/'engineer/report.json').read_text());a=json.loads((out/'option-a/report.json').read_text())
          assert c['failures']==0 and len(c['cases'])==4 and e['status']=='PASS' and a['status']=='PASS'
          summary={'applicationCommit':os.environ['MASAR_AUDIT_COMMIT'],'url':os.environ['MASAR_AUDIT_URL'],'customerCases':len(c['cases']),'customerChecks':c['passedChecks'],'engineerChecks':e['passed'],'optionAChecks':a['passed'],'pageErrors':sum(len(r['pageErrors']) for r in c['cases'])+len(e['pageErrors'])+len(a['pageErrors']),'failed':0,'scope':'Functional generation and conceptual geometry QA; full architectural programme and regulatory compliance are not certified'}
          (out/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2));print(json.dumps(summary,ensure_ascii=False,indent=2))
          dest=Path('.masar-ops/quality-evidence');dest.mkdir(parents=True,exist_ok=True)
          for source,name in [(out/'summary.json','live-summary.json'),(out/'engineer/report.json','engineer-report.json'),(out/'engineer/generated-plan-desktop.png','chalet-plan.png'),(out/'engineer/chalet-materials-desktop.png','chalet-materials.png'),(customer/'webkit-390-generated.png','chalet-mobile.png'),(customer/'webkit-390-error-visible.png','error-visible-mobile.png')]:shutil.copyfile(source,dest/name)
          (out/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+str(p.relative_to(out))+'\n' for p in sorted(out.rglob('*')) if p.is_file() and p.name!='SHA256SUMS'))
          PY
          test "$GITHUB_REF" = 'refs/heads/ops/masar-quality-live-20260908'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .masar-ops/quality-evidence/
          git diff --cached --check
          git commit -m 'test(masar): archive corrected chalet customer and engineer live evidence'
          git push origin HEAD:ops/masar-quality-live-20260908
      - name: Preserve all live evidence even when an assertion fails
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: masar-chalet-quality-live-evidence
          path: |
            quality-live/
            masar-studio/test-output/chalet-acceptance/
          retention-days: 30
