name: ACS temporary measured-doc refresh

on:
  push:
    branches:
      - acs-v2/connected-property-lock-ui-20260915

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Recompute measured bundle state
        run: |
          python3 tools/bundle_report.py
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          script = Path('tools/check_doc_claims.py')
          spec = importlib.util.spec_from_file_location('acs_doc_claims', script)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          path = Path(module.STATE_DOC)
          text = path.read_text(encoding='utf-8')
          start = text.index(module.STATE_BEGIN)
          end = text.index(module.STATE_END, start) + len(module.STATE_END)
          replacement = module.render_state()
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
          git checkout -- tests/performance/bundle_report.json 2>/dev/null || true
          git diff --check
      - name: Commit generated measured state only
        run: |
          if git diff --quiet -- KNOWN-ISSUES.md; then
            echo 'Measured documentation state already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add KNOWN-ISSUES.md
          git commit -m 'docs: refresh measured current bundle state'
          git push origin HEAD:${GITHUB_REF_NAME}
