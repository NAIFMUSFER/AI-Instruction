name: Public apartment and warehouse walkthrough

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'acs_compiler.py'
      - 'acs_arch.py'
      - 'acs_visual.py'
      - 'tests/remediation/test_audit_engineering_door_meshes.py'
      - 'requirements.lock'
      - 'netlify.toml'
      - 'tools/guest_apartment_usdz.mjs'
      - 'tools/build_guest_apartment_usdz.py'
      - 'assets/guest/**'
      - 'tools/netlify-build.sh'
      - 'package-lock.json'
      - 'tests/remediation/test_guest_quicklook.py'
      - 'tests/remediation/test_public_apartment_journey.cjs'
      - 'tests/remediation/test_guest_brief_variations.cjs'
      - 'tests/remediation/test_guest_software_studio.cjs'
      - 'requirements.txt'
      - 'tests/fixtures/briefs/**'
      - 'tests/remediation/test_local_apartment.mjs'
      - 'tests/remediation/test_guest_cutaway.mjs'
      - 'tests/remediation/test_guest_floor_plan.mjs'
      - 'tools/build_guest_apartment_plans.py'
      - '.github/workflows/public-apartment-journey.yml'
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'acs_compiler.py'
      - 'acs_arch.py'
      - 'acs_visual.py'
      - 'tests/remediation/test_audit_engineering_door_meshes.py'
      - 'requirements.lock'
      - 'netlify.toml'
      - 'tools/guest_apartment_usdz.mjs'
      - 'tools/build_guest_apartment_usdz.py'
      - 'assets/guest/**'
      - 'tools/netlify-build.sh'
      - 'package-lock.json'
      - 'tests/remediation/test_guest_quicklook.py'
      - 'tests/remediation/test_public_apartment_journey.cjs'
      - 'tests/remediation/test_guest_brief_variations.cjs'
      - 'tests/remediation/test_guest_software_studio.cjs'
      - 'requirements.txt'
      - 'tests/fixtures/briefs/**'
      - 'tests/remediation/test_local_apartment.mjs'
      - 'tests/remediation/test_guest_cutaway.mjs'
      - 'tests/remediation/test_guest_floor_plan.mjs'
      - 'tools/build_guest_apartment_plans.py'
      - '.github/workflows/public-apartment-journey.yml'

permissions:
  contents: read

concurrency:
  group: public-apartment-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guest-model:
    name: ${{ matrix.brief }} at ${{ matrix.width }}px
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.brief == 'riyadh-20x25' && 60 || 32 }}
    strategy:
      fail-fast: false
      matrix:
        width: [393, 1440]
        brief: [riyadh-20x25, riyadh-24x28, central-courtyard, saudi-west-entry]
    env:
      ACS_VERIFY_EXPECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ACS_APARTMENT_EVIDENCE: logs/public-apartment
      ACS_APARTMENT_VIEWPORT: ${{ matrix.width }}
      ACS_APARTMENT_CASE: ${{ matrix.brief }}
      ACS_APARTMENT_LIVE: ${{ github.event_name == 'push' && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ACS_VERIFY_EXPECT_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install the geometry compiler's locked NumPy wheel
        run: |
          awk '/^numpy==/ {found=1} found {print; if ($0 !~ /\\$/) exit}' requirements.lock > "$RUNNER_TEMP/acs-numpy.txt"
          test -s "$RUNNER_TEMP/acs-numpy.txt"
          python3 -m pip install --require-hashes --only-binary=:all: --no-deps -r "$RUNNER_TEMP/acs-numpy.txt"
      - name: Install pinned browser libraries and Chromium
        env:
          COMMIT_REF: ${{ env.ACS_VERIFY_EXPECT_SHA }}
        run: |
          bash tools/netlify-build.sh
          python3 tools/ci_prepare_apt.py
          npx playwright install --with-deps chromium
      - name: Verify derived floor plans and source identity
        id: geometry
        run: |
          PYTHONPATH=. python3 tests/remediation/test_audit_engineering_door_meshes.py
          node tests/remediation/test_local_apartment.mjs
          python3 tools/build_guest_apartment_usdz.py --check
          python3 tests/remediation/test_guest_quicklook.py
          node tests/remediation/test_guest_cutaway.mjs
          node tests/remediation/test_guest_floor_plan.mjs
          python3 tools/build_guest_apartment_plans.py --check
      - name: Verify both production revision stamps before the published run
        id: published
        if: github.event_name == 'push'
        run: |
          python3 tests/deploy/wait_published_revision.py --expect-sha "$ACS_VERIFY_EXPECT_SHA" --seconds 600 --output logs/public-apartment/published-revision.json
      - name: Verify independent projects and interactive courtyard and entrance revisions
        id: variations
        if: matrix.brief == 'riyadh-20x25'
        timeout-minutes: 20
        run: node tests/remediation/test_guest_brief_variations.cjs
      - name: Verify editing and recovery when WebGL is unavailable
        if: ${{ !cancelled() && matrix.brief == 'riyadh-20x25' && (steps.variations.outcome == 'success' || steps.variations.outcome == 'failure') }}
        timeout-minutes: 5
        run: node tests/remediation/test_guest_software_studio.cjs
      - name: Verify the selected brief through the public studio
        if: ${{ !cancelled() && steps.geometry.outcome == 'success' && (github.event_name != 'push' || steps.published.outcome == 'success') }}
        timeout-minutes: 19
        run: node tests/remediation/test_public_apartment_journey.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-apartment-${{ matrix.brief }}-${{ matrix.width }}-${{ env.ACS_VERIFY_EXPECT_SHA }}-${{ github.run_attempt }}
          path: logs/public-apartment/
          if-no-files-found: error
          retention-days: 30
