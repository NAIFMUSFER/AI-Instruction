<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>acsAI — اختبار كود الجوال</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<main>
  <a href="/">العودة إلى acsAI</a>
  <h1>اختبار كود الجوال</h1>
  <p>هذه صفحة اختبار إعدادات Firebase. نجاح التحقق هنا لا يسجّل دخولك إلى مشاريع acsAI.</p>
  <p>بالضغط على إرسال، توافق على إرسال رقمك إلى Google للتحقق وإرسال رسالة SMS. قد تُحتسب رسوم الرسائل، وقد يُنشأ حساب تحقق لدى Firebase.</p>
  <form id="phone-form">
    <label for="phone">رقم الجوال السعودي</label>
    <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="05xxxxxxxx" required maxlength="20" dir="ltr">
    <div id="recaptcha"></div>
    <button id="send" disabled>إرسال كود التحقق</button>
  </form>
  <form id="code-form" hidden>
    <label for="code">الكود المكوّن من 6 أرقام</label>
    <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" required maxlength="6" dir="ltr">
    <button id="confirm">تحقق من الكود</button>
  </form>
  <p id="status" role="status" aria-live="polite">جارٍ تحميل خدمة التحقق…</p>
  <noscript>فعّل JavaScript لإجراء الاختبار.</noscript>
</main>
<script type="module" src="./check.js"></script>
</body>
</html>
