# ينشر Netlify محتوى مجلد public فقط — فلا تُنشر ملفات الخادم Python
[build]
  publish = "public"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    # حماية من التأطير (clickjacking)
    X-Frame-Options = "DENY"
    # صلاحيات المتصفح: يُسمح بالكاميرا وتتبّع WebXR للواجهة نفسها فقط، والبقية معطّلة
    Permissions-Policy = "camera=(self), xr-spatial-tracking=(self), fullscreen=(self), microphone=(), geolocation=(), payment=(), usb=()"
    # سياسة محتوى دفاعية. ملاحظات الاستثناءات:
    #  • script-src يسمح بالـCDN الثلاثة (three@unpkg، es-module-shims@jsdelivr، pdf.js@cdnjs)
    #    و'unsafe-inline'/'unsafe-eval' لأن الوحدة الرئيسية inline وes-module-shims قد يحتاج eval.
    #  • worker-src blob: لعامل pdf.js.  • img-src data:/blob: لخامات WebGL واللقطات.
    #  • connect-src مثبّت على نطاق خادم الفهم المعروف (acs-engine.onrender.com).
    #    عند تجاوز الخادم يدوياً (الإعدادات المتقدّمة) لنطاق آخر، أضِف نطاقه هنا.
    #  • frame-ancestors 'none' + object-src 'none' + base-uri 'self' لتقليل السطح.
    #  ملاحظة: لم تُضَف COEP عمداً لأنها تكسر سكربتات الـCDN وخامات الكانفس.
    #  بعد الاستضافة المحلية (tools/vendor.sh) احذف نطاقات الـCDN من script-src.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; connect-src 'self' https://acs-engine.onrender.com"
